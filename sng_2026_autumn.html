      }

             (teamData || []).forEach((team, tIdx) => { (team || []).forEach((p, pIdx) => { if (p.name === playerData.name) { foundTIdx = tIdx; foundPIdx = pIdx; } }); });

             }

          setAllScores(newAllScores);

                <div className="overflow-y-auto flex-1 space-y-4 mb-6 no-scrollbar">
                  <div><label className="block text-xs font-bold text-slate-500 mb-2 pl-1">시상 명칭</label><input type="text" value={tempStablefordTitle} onChange={e=>setTempStablefordTitle(e.target.value)} className="w-full bg-[#F8F9FA] border rounded-xl px-4 py-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-[#0D8A5E]" /></div>

                    {(tempStablefordConfig || []).map((item,idx)=>(<div key={item.id} className="flex items-center gap-2 w-full"><input type="text" value={item.label} onChange={e=>{const nc=[...tempStablefordConfig];nc[idx].label=e.target.value;setTempStablefordConfig(nc);}} className="flex-1 border rounded-xl px-3 py-2 text-sm font-bold outline-none"/><div className="flex items-center gap-1 bg-slate-50 rounded-xl p-1 border shrink-0"><button onClick={()=>{const nc=[...tempStablefordConfig];nc[idx].score-=1;setTempStablefordConfig(nc);}} className="w-7 h-7 rounded-lg bg-white flex items-center justify-center transition-colors"><Icons.Minus className="w-3 h-3"/></button><span className="font-black text-sm w-6 text-center text-[#0D8A5E]">{item.score>0?`+${item.score}`:item.score}</span><button onClick={()=>{const nc=[...tempStablefordConfig];nc[idx].score+=1;setTempStablefordConfig(nc);}} className="w-7 h-7 rounded-lg bg-white flex items-center justify-center transition-colors"><Icons.Plus className="w-3 h-3"/></button></div></div>))}
                  </div>
                </div>
                <button onClick={()=>{setStablefordTitle(tempStablefordTitle);setStablefordConfig(tempStablefordConfig);setShowStablefordModal(false);}} className="w-full bg-[#0D8A5E] text-white font-bold py-3.5 rounded-xl shadow-md transition-all active:scale-[0.98]">설정 완료</button>

                  <div><span className="font-bold text-slate-700 block mb-2 text-sm">니어리스트 홀 (파3 중첩 코스)</span><select value={tempSpecialHoles.nearest ? JSON.stringify(tempSpecialHoles.nearest) : ""} onChange={e => setTempSpecialHoles({...tempSpecialHoles, nearest: e.target.value ? JSON.parse(e.target.value) : null})} className="w-full bg-[#F8F9FA] border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-[#0D8A5E] outline-none"><option value="">설정 안함</option>{overlappingCourses.map(c => Array.from({length: 9}).map((_, i) => { if (currentCourseData.courses[c] && currentCourseData.courses[c][i] === 3) return <option key={`${c}-${i+1}`} value={JSON.stringify({course: c, hole: i+1})}>{c} {i+1}H (파3)</option>; return null; }))}</select></div>
                  <div><span className="font-bold text-slate-700 block mb-2 text-sm">롱기스트 홀 (파5 중첩 코스)</span><select value={tempSpecialHoles.longest ? JSON.stringify(tempSpecialHoles.longest) : ""} onChange={e => setTempSpecialHoles({...tempSpecialHoles, longest: e.target.value ? JSON.parse(e.target.value) : null})} className="w-full bg-[#F8F9FA] border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-[#0D8A5E] outline-none"><option value="">설정 안함</option>{overlappingCourses.map(c => Array.from({length: 9}).map((_, i) => { if (currentCourseData.courses[c] && currentCourseData.courses[c][i] === 5) return <option key={`${c}-${i+1}`} value={JSON.stringify({course: c, hole: i+1})}>{c} {i+1}H (파5)</option>; return null; }))}</select></div>
                  <div className="pt-2 border-t border-slate-100"><label className="flex items-center gap-2 cursor-pointer mb-1"><input type="checkbox" checked={tempSpecialHoles.requirePar !== false} onChange={e => setTempSpecialHoles({...tempSpecialHoles, requirePar: e.target.checked})} className="w-4 h-4 text-[#0D8A5E] rounded focus:ring-[#0D8A5E] outline-none" /><span className="font-bold text-slate-700 text-sm">파(Par) 이하 기록 시에만 유효</span></label></div>
                </div>
                <button onClick={()=>{setShowSpecialHoleModal(false);}} className="w-full bg-[#0D8A5E] text-white font-bold py-3.5 rounded-xl shadow-md active:scale-[0.98] transition-all">설정 완료</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const isInviteLink = !!urlParams.get('roomId');

      const [currentView, setCurrentView] = usePersistentState('golf_currentView_v26', isInviteLink ? 'waitingRoom' : 'settings');
      const [handicapType, setHandicapType] = usePersistentState('golf_handicapType_v26', 'strokes');
      const [eventName, setEventName] = usePersistentState('golf_eventName_v26', '2026 SNG 추계 라운드');
      const [courseInfo, setCourseInfo] = usePersistentState('golf_courseInfo_v26', { name: '포천 베어크리크 (크리크)', front: '크리크 OUT', back: '크리크 IN' });
      const [isMultiCourse, setIsMultiCourse] = usePersistentState('golf_isMultiCourse_v26', true);
      
      const defaultTeamCourses = Array(20).fill({front: '크리크 OUT', back: '크리크 IN'});
      defaultTeamCourses[0] = { front: '크리크 OUT', back: '크리크 IN' }; // 1조 OUT 시작
      defaultTeamCourses[1] = { front: '크리크 OUT', back: '크리크 IN' }; // 2조 OUT 시작
      defaultTeamCourses[2] = { front: '크리크 IN', back: '크리크 OUT' }; // 3조 IN 시작
      defaultTeamCourses[3] = { front: '크리크 IN', back: '크리크 OUT' }; // 4조 IN 시작
      const [teamCourses, setTeamCourses] = usePersistentState('golf_teamCourses_v26', defaultTeamCourses);
      
      const [isRoundStarted, setIsRoundStarted] = usePersistentState('golf_isRoundStarted_v26', false);
      
      const [teamNames, setTeamNames] = usePersistentState('golf_teamNames_v26', ['1조', '2조', '3조', '4조']);
      const [teamData, setTeamData] = usePersistentState('golf_teamData_v26', getInitialTeams());
      const [enableTeamComp, setEnableTeamComp] = usePersistentState('golf_enableTeamComp_v26', true);
      const [enableGroupComp, setEnableGroupComp] = usePersistentState('golf_enableGroupComp_v26', true);
      const [teamBalanceMode, setTeamBalanceMode] = usePersistentState('golf_teamBalanceMode_v26', 'average');
      const [customGroups, setCustomGroups] = usePersistentState('golf_customGroups_v26', getInitialGroups());
      const [groupBalanceMode, setGroupBalanceMode] = usePersistentState('golf_groupBalanceMode_v26', 'average');
      const [selectedAwards, setSelectedAwards] = usePersistentState('golf_selectedAwards_v26', ALL_AWARDS_KEYS);
      const [stablefordTitle, setStablefordTitle] = usePersistentState('golf_stablefordTitle_v26', '변형스테이블포드');
      const [stablefordConfig, setStablefordConfig] = usePersistentState('golf_stablefordConfig_v26', [{ id: 'albatross', label: '알바트로스', score: 8 }, { id: 'eagle', label: '이글', score: 5 }, { id: 'birdie', label: '버디', score: 2 }, { id: 'par', label: '파', score: 0 }, { id: 'bogey', label: '보기', score: -1 }, { id: 'doubleBogey', label: '더블보기 이상', score: -3 }]);
      const [specialHoles, setSpecialHoles] = usePersistentState('golf_specialHoles_v26', { nearest: null, longest: null, requirePar: true });
      const [specialRecords, setSpecialRecords] = usePersistentState('golf_specialRecords_v26', Array(18).fill(null).map(() => ({})));
      const [currentHole, setCurrentHole] = usePersistentState('golf_currentHole_v26', 1);
      
      const [allPars, setAllPars] = usePersistentState('golf_allPars_v26', []);
      const [allScores, setAllScores] = usePersistentState('golf_allScores_v26', []);
      const [hostSelectedTeam, setHostSelectedTeam] = usePersistentState('golf_hostSelectedTeam_v26', 0);
      const [isAwardsManuallyOpened, setIsAwardsManuallyOpened] = usePersistentState('golf_isAwardsManuallyOpened_v26', false);
      const [currentUserRole, setCurrentUserRole] = usePersistentState('golf_currentUserRole_v26', isInviteLink ? 'guest' : 'host');
      const [myPlayerInfo, setMyPlayerInfo] = usePersistentState('golf_myPlayerInfo_v26', null);
      const [joinedStatus, setJoinedStatus] = usePersistentState('golf_joinedStatus_v26', []);
      const [lastEditors, setLastEditors] = usePersistentState('golf_lastEditors_v26', {});
      const [scoreInputPermission, setScoreInputPermission] = usePersistentState('golf_scoreInputPermission_v26', 'host');
      const [scoreInputAuthorizedPlayers, setScoreInputAuthorizedPlayers] = usePersistentState('golf_scoreInputAuthorizedPlayers_v26', []);

      const [previousView, setPreviousView] = useState('scoreInput');
      const [detailModal, setDetailModal] = useState(null);
      const [isAwardInfoOpen, setIsAwardInfoOpen] = useState(false);
      const [roomId, setRoomId] = usePersistentState('golf_roomId_v30', null);
      const manuallyClearedRef = useRef({});
      const [isDbConnected, setIsDbConnected] = useState(false);
      const [user, setUser] = useState(null);
      const [refreshTrigger, setRefreshTrigger] = useState(0);
      const [isPosterOpen, setIsPosterOpen] = useState(() => !isRoundStarted && shouldShowPoster()); // 라운드 시작 전에만 자동 노출

      useEffect(() => { 
        try { if (window.localStorage.getItem('golf_host_verified') === 'true') setCurrentUserRole('host'); } catch(e) {} 
        try { const urlParams = new URLSearchParams(window.location.search); const rId = urlParams.get('roomId'); if (rId) setRoomId(rId); } catch(e) {}
      }, [setCurrentUserRole, setRoomId]);

      useEffect(() => { 
        if (!auth) return; 
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await auth.signInWithCustomToken(__initial_auth_token);
            } else {
              await auth.signInAnonymously();
            }
          } catch (e) { console.error("Auth Error", e); }
        };
        initAuth();
        const unsubscribe = auth.onAuthStateChanged((u) => {
          setUser(u);
          if (u) setIsDbConnected(true);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!db || !roomId || !isDbConnected || !user) return;
        const roomRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('golf_rooms').doc(roomId);
        const unsubscribe = roomRef.onSnapshot((docSnap) => {
          if (docSnap.exists) {
            const data = docSnap.data();
            if (data.allScores) { try { setAllScores(typeof data.allScores === 'string' ? JSON.parse(data.allScores) : data.allScores); } catch(e) { setAllScores(data.allScores); } }
            if (data.allPars) { try { setAllPars(typeof data.allPars === 'string' ? JSON.parse(data.allPars) : data.allPars); } catch(e) { setAllPars(data.allPars); } }
            if (data.joinedStatus) { try { setJoinedStatus(typeof data.joinedStatus === 'string' ? JSON.parse(data.joinedStatus) : data.joinedStatus); } catch(e) { setJoinedStatus(data.joinedStatus); } }
            if (data.teamData) { try { setTeamData(typeof data.teamData === 'string' ? JSON.parse(data.teamData) : data.teamData); } catch(e) { setTeamData(data.teamData); } }
            if (data.specialRecords) setSpecialRecords(data.specialRecords);
            if (data.lastEditors) setLastEditors(data.lastEditors); if (data.isRoundStarted !== undefined) setIsRoundStarted(data.isRoundStarted); if (data.eventName) setEventName(data.eventName); if (data.scoreInputAuthorizedPlayers) setScoreInputAuthorizedPlayers(data.scoreInputAuthorizedPlayers);
          }
        }, (err) => console.error("Firebase Sync Error:", err));
        return () => unsubscribe();
      }, [roomId, isDbConnected, user]);

      const syncToDB = async (updates, explicitRoomId) => { 
        const targetRoom = explicitRoomId || roomId;
        if (!db || !targetRoom || !isDbConnected || !user) return; 
        try { 
          const roomRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('golf_rooms').doc(targetRoom);
          const formattedUpdates = { ...updates };
          if (formattedUpdates.allScores) formattedUpdates.allScores = JSON.stringify(formattedUpdates.allScores);
          if (formattedUpdates.allPars) formattedUpdates.allPars = JSON.stringify(formattedUpdates.allPars);
          if (formattedUpdates.joinedStatus) formattedUpdates.joinedStatus = JSON.stringify(formattedUpdates.joinedStatus);
          if (formattedUpdates.teamData) formattedUpdates.teamData = JSON.stringify(formattedUpdates.teamData);
          await roomRef.set(formattedUpdates, { merge: true }); 
        } catch (e) { console.error("Sync Error", e); } 
      };

      const handleManualRefresh = async () => {
        setRefreshTrigger(prev => prev + 1);
        if (!db || !roomId || !isDbConnected || !user) return;
        try {
          const roomRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('golf_rooms').doc(roomId);
          const docSnap = await roomRef.get();
          if (docSnap.exists) {
            const data = docSnap.data();
            if (data.allScores) { try { setAllScores(typeof data.allScores === 'string' ? JSON.parse(data.allScores) : data.allScores); } catch(e) { setAllScores(data.allScores); } }
            if (data.allPars) { try { setAllPars(typeof data.allPars === 'string' ? JSON.parse(data.allPars) : data.allPars); } catch(e) { setAllPars(data.allPars); } }
            if (data.joinedStatus) { try { setJoinedStatus(typeof data.joinedStatus === 'string' ? JSON.parse(data.joinedStatus) : data.joinedStatus); } catch(e) { setJoinedStatus(data.joinedStatus); } }
            if (data.teamData) { try { setTeamData(typeof data.teamData === 'string' ? JSON.parse(data.teamData) : data.teamData); } catch(e) { setTeamData(data.teamData); } }
            if (data.specialRecords) setSpecialRecords(data.specialRecords);
            if (data.lastEditors) setLastEditors(data.lastEditors); 
            if (data.isRoundStarted !== undefined) setIsRoundStarted(data.isRoundStarted); 
            if (data.eventName) setEventName(data.eventName); 
            if (data.scoreInputAuthorizedPlayers) setScoreInputAuthorizedPlayers(data.scoreInputAuthorizedPlayers);
          }
        } catch(e) { console.error("Manual Refresh Error:", e); }
      };

      const handleCompleteSettings = (data, type) => {
        setTeamData(data); setHandicapType(type); setCurrentUserRole('host'); try { window.localStorage.setItem('golf_host_verified', 'true'); } catch(e) {}
        let currentRoomId = roomId; if (!currentRoomId) { currentRoomId = Math.random().toString(36).substring(2, 8).toUpperCase(); setRoomId(currentRoomId); }
        try { const url = new URL(window.location.href); if (url.searchParams.get('roomId') !== currentRoomId) { url.searchParams.set('roomId', currentRoomId); window.history.pushState({}, '', url.toString()); } } catch(e) {}
        if (!isRoundStarted) { const initialJoin = data.map(t => (t || []).map(() => false)); setJoinedStatus(initialJoin); setCurrentView('waitingRoom'); syncToDB({ teamData: data, eventName: eventName, joinedStatus: initialJoin, isRoundStarted: false }, currentRoomId); } 
        else { setCurrentView('scoreInput'); }
      };

      const handleStartRound = () => {
        let newPars = allPars; let newScores = allScores;
        if (allPars.length === 0 || typeof allPars[0] === 'number') {
          const d = GOLF_COURSES_DATA.find(c => c.name === courseInfo.name) || GOLF_COURSES_DATA[0];
          newPars = teamData.map((_, tIdx) => { const tc = isMultiCourse ? teamCourses[tIdx] : courseInfo; return [...d.courses[tc.front], ...d.courses[tc.back]]; });
          setAllPars(newPars); newScores = Array(18).fill(null).map(() => (teamData || []).map(t => (t || []).map(() => null))); setAllScores(newScores);
        }
        setIsRoundStarted(true); setCurrentView('scoreInput'); syncToDB({ allPars: newPars, allScores: newScores, isRoundStarted: true });
      };

      const handleResetGame = () => {
        setIsRoundStarted(false); setJoinedStatus([]); setMyPlayerInfo(null); setCurrentHole(1); setAllScores([]); setAllPars([]); setIsAwardsManuallyOpened(false); setSpecialRecords(Array(18).fill(null).map(() => ({}))); setLastEditors({}); manuallyClearedRef.current = {}; setCurrentView('settings');
        syncToDB({ allScores: [], allPars: [], isRoundStarted: false, joinedStatus: [], specialRecords: Array(18).fill(null).map(() => ({})) });
      };

      const handleEndGame = () => { setIsAwardsManuallyOpened(true); setPreviousView('settings'); setCurrentView('awards'); };

      const getAwardStats = (basis = 'realtime') => {
        let syncHoles = [];
        if (basis === 'min_hole_sync') {
          for (let i = 0; i < 18; i++) {
            let allPlayed = true;
            for (let t = 0; t < teamData.length; t++) { for (let p = 0; p < teamData[t].length; p++) { if (allScores[i]?.[t]?.[p] == null) { allPlayed = false; break; } } if (!allPlayed) break; }
            if (allPlayed) syncHoles.push(i);
          }
        }
        return (teamData || []).flatMap((team, tIdx) => (team || []).map((player, pIdx) => {
          let score = 0, actualDiff = 0, birds = 0, sfScore = 0, holes = 0, vari = 0, prevD = null;
          let daPa = 0, daBogey = 0, realPars = 0, realBogeys = 0, realDoublePars = 0;
          let details = { birdies: [], daPa: [], daBogey: [], realPars: [], realBogeys: [], realDoublePars: [], variance: [], stableford: [] };
          allScores.slice(0, 18).forEach((hs, hIdx) => {
            if (basis === 'min_hole_sync' && !syncHoles.includes(hIdx)) return;
            const s = hs[tIdx]?.[pIdx];
            if (s != null) {
              holes++; const p = allPars[tIdx]?.[hIdx] || 4; const d = s - p; const hName = `${hIdx+1}H`;
              score += s; actualDiff += d;
              if (d <= -1) { birds++; details.birdies.push(`${hName}(${s})`); }
              if (d === 0) { realPars++; details.realPars.push(hName); daPa += 1; details.daPa.push(`${hName}(1)`); }
              else if (d >= p) { realDoublePars++; details.realDoublePars.push(hName); daPa += 2; details.daPa.push(`${hName}(2)`); }
              else { if (d === 1) { realBogeys++; details.realBogeys.push(hName); } daBogey += d; details.daBogey.push(`${hName}(${d})`); }
              if (prevD !== null && hIdx >= 1) { const diffVal = Math.abs(d - prevD); details.variance.push(`${hName}(${diffVal})`); vari += diffVal; }
              prevD = d;
              const conf = (id) => stablefordConfig.find(c => c.id === id)?.score || 0;
              let sfDelta = 0;
              if (d <= -3) sfDelta = conf('albatross'); else if (d === -2) sfDelta = conf('eagle'); else if (d === -1) sfDelta = conf('birdie'); else if (d === 0) sfDelta = conf('par'); else if (d === 1) sfDelta = conf('bogey'); else if (d >= 2) sfDelta = conf('doubleBogey');
              sfScore += sfDelta;
              if (sfDelta !== 0) details.stableford.push(`${hName}(${sfDelta})`);
            }
          });
          const handi = parseFloat(String(player.handicap || "0").replace(/[^0-9+\-.]/g, '')) || 0; const handicapOverPar = handicapType === 'strokes' ? handi - 72 : handi;
          const handiTrend = handicapOverPar / 18; const expectedDiffNow = handiTrend * holes; const diffVsExpected = actualDiff - expectedDiffNow;
          let perfText = '';
          if (holes > 0) {
            if (diffVsExpected < 0) perfText = `예상 ${safeDisplayDiff(expectedDiffNow)} → 실제 ${safeDisplayDiff(actualDiff)} (${Math.abs(Math.round(diffVsExpected))}타 이득)`;
            else if (diffVsExpected > 0) perfText = `예상 ${safeDisplayDiff(expectedDiffNow)} → 실제 ${safeDisplayDiff(actualDiff)} (${Math.round(diffVsExpected)}타 손해)`;
            else perfText = `예상 ${safeDisplayDiff(expectedDiffNow)} → 실제 ${safeDisplayDiff(actualDiff)} (기대치 부합)`;
            details.perfText = [perfText];
          }
          return { ...player, tIdx, pIdx, score, actualDiff, diff: actualDiff, birdies: birds, daPaScore: daPa, daBogeyScore: daBogey, realPars, realBogeys, realDoublePars, details, netDiff: holes > 0 ? (actualDiff - (handicapOverPar * (holes/18))) : 0, ilchiScore: holes > 0 ? diffVsExpected : 9999, nakchaScore: holes > 0 ? diffVsExpected : -9999, stablefordScore: sfScore, mockNewPeoriaNet: holes > 0 ? (score - (actualDiff * 0.8)) : 0, playedHoles: holes, variance: vari };
        }));
      };

      const getPredictionStats = () => {
        const physicalHoleDiffs = {}; const physicalHoleCounts = {};
        allScores.forEach((hs, hI) => { hs.forEach((team, tI) => { team.forEach((score, pI) => { if (score != null) { const tc = isMultiCourse ? teamCourses[tI] : courseInfo; const cName = hI < 9 ? tc.front : tc.back; const cHole = hI < 9 ? hI + 1 : hI - 8; const key = `${cName}-${cHole}`; const par = allPars[tI]?.[hI] || 4; if (!physicalHoleDiffs[key]) { physicalHoleDiffs[key] = 0; physicalHoleCounts[key] = 0; } physicalHoleDiffs[key] += (score - par); physicalHoleCounts[key]++; } }); }); });
        Object.keys(physicalHoleDiffs).forEach(k => { physicalHoleDiffs[k] /= physicalHoleCounts[k]; });
        return (teamData || []).flatMap((team, tIdx) => (team || []).map((player, pIdx) => {
          let actualDiff = 0, playedHoles = 0, score = 0;
          allScores.forEach((hs, hI) => { if (hs[tIdx]?.[pIdx] != null) { score += hs[tIdx][pIdx]; actualDiff += (hs[tIdx][pIdx] - (allPars[tIdx]?.[hI] || 4)); playedHoles++; } });
          const handi = parseFloat(String(player.handicap || "0").replace(/[^0-9+\-.]/g, '')) || 0; const handicapOverPar = handicapType === 'strokes' ? handi - 72 : handi; const handiTrend = handicapOverPar / 18; const currentTrend = playedHoles > 0 ? actualDiff / playedHoles : handiTrend;
          let predictedDiff = actualDiff;
          for (let i = 0; i < 18; i++) { if (allScores[i]?.[tIdx]?.[pIdx] == null) { const tc = isMultiCourse ? teamCourses[tIdx] : courseInfo; const cName = i < 9 ? tc.front : tc.back; const cHole = i < 9 ? i + 1 : i - 8; const key = `${cName}-${cHole}`; const holeDiff = physicalHoleDiffs[key] || 0; predictedDiff += (currentTrend * 0.5) + (holeDiff * 0.3) + (handiTrend * 0.2); } }
          return { ...player, tIdx, pIdx, diff: predictedDiff, score, playedHoles, actualDiff, predictedScore: Math.round(72 + predictedDiff) };
        }));
      };

      const stats = getAwardStats('realtime'); const syncStats = getAwardStats('min_hole_sync'); const predictionStats = getPredictionStats(); const totalPar = allPars.length > 0 && allPars[0] ? allPars[0].reduce((a,b)=>a+b, 0) : 72;
      const isAwardOpenFlag = currentUserRole === 'host' || isAwardsManuallyOpened;

      const renderCurrentView = () => {
        let viewToRender = currentView;
        if (viewToRender === 'settings' && currentUserRole !== 'host') { viewToRender = 'waitingRoom'; }

        switch(viewToRender) {
          case 'settings': return <SettingsView teamNames={teamNames} setTeamNames={setTeamNames} initialData={teamData} setTeamData={setTeamData} initialHandicapType={handicapType} setHandicapType={setHandicapType} eventName={eventName} setEventName={setEventName} courseInfo={courseInfo} setCourseInfo={setCourseInfo} selectedAwards={selectedAwards} setSelectedAwards={setSelectedAwards} stablefordTitle={stablefordTitle} setStablefordTitle={setStablefordTitle} stablefordConfig={stablefordConfig} setStablefordConfig={setStablefordConfig} specialHoles={specialHoles} setSpecialHoles={setSpecialHoles} isMultiCourse={isMultiCourse} setIsMultiCourse={setIsMultiCourse} teamCourses={teamCourses} setTeamCourses={setTeamCourses} onComplete={handleCompleteSettings} onResetGame={handleResetGame} onEndGame={handleEndGame} isRoundStarted={isRoundStarted} enableTeamComp={enableTeamComp} setEnableTeamComp={setEnableTeamComp} enableGroupComp={enableGroupComp} setEnableGroupComp={setEnableGroupComp} teamBalanceMode={teamBalanceMode} setTeamBalanceMode={setTeamBalanceMode} customGroups={customGroups} setCustomGroups={setCustomGroups} groupBalanceMode={groupBalanceMode} setGroupBalanceMode={setGroupBalanceMode} scoreInputPermission={scoreInputPermission} setScoreInputPermission={setScoreInputPermission} onGoToWaitingRoom={() => setCurrentView('waitingRoom')} allScores={allScores} setAllScores={setAllScores} syncToDB={syncToDB} />;
          case 'waitingRoom': return <WaitingRoomView teamData={teamData} currentUserRole={currentUserRole} myPlayerInfo={myPlayerInfo} setMyPlayerInfo={setMyPlayerInfo} joinedStatus={joinedStatus} setJoinedStatus={setJoinedStatus} isRoundStarted={isRoundStarted} onBack={() => setCurrentView('settings')} eventName={eventName} onStartRound={handleStartRound} customGroups={customGroups} roomId={roomId} syncToDB={syncToDB} userUid={user?.uid} scoreInputPermission={scoreInputPermission} scoreInputAuthorizedPlayers={scoreInputAuthorizedPlayers} setScoreInputAuthorizedPlayers={setScoreInputAuthorizedPlayers} setHostSelectedTeam={setHostSelectedTeam} onSpectate={() => setCurrentView('scoreInput')} onOpenPoster={() => setIsPosterOpen(true)} />;
          case 'scoreInput': return <ScoreInputView teamNames={teamNames} teamData={teamData} isMultiCourse={isMultiCourse} teamCourses={teamCourses} courseInfo={courseInfo} currentUserRole={currentUserRole} myPlayerInfo={myPlayerInfo} hostSelectedTeam={hostSelectedTeam} setHostSelectedTeam={setHostSelectedTeam} allPars={allPars} setAllPars={setAllPars} allScores={allScores} setAllScores={setAllScores} specialHoles={specialHoles} specialRecords={specialRecords} setSpecialRecords={setSpecialRecords} eventName={eventName} scoreInputPermission={scoreInputPermission} scoreInputAuthorizedPlayers={scoreInputAuthorizedPlayers} lastEditors={lastEditors} setLastEditors={setLastEditors} customGroups={customGroups} onGoToSettings={() => setCurrentView('settings')} onGoToWaitingRoom={() => setCurrentView('waitingRoom')} onOpenScoreboard={() => setCurrentView('scoreboard')} onOpenAwards={() => { setPreviousView('scoreInput'); setCurrentView('awards'); }} currentHole={currentHole} setCurrentHole={setCurrentHole} manuallyClearedRef={manuallyClearedRef} syncToDB={syncToDB} isRoundStarted={isRoundStarted} />;
          case 'scoreboard': return <ScoreboardView teamNames={teamNames} teamData={teamData} isMultiCourse={isMultiCourse} teamCourses={teamCourses} courseInfo={courseInfo} currentUserRole={currentUserRole} myPlayerInfo={myPlayerInfo} hostSelectedTeam={hostSelectedTeam} allPars={allPars} allScores={allScores} handicapType={handicapType} eventName={eventName} customGroups={customGroups} onGoToSettings={() => setCurrentView('settings')} onBack={() => setCurrentView('scoreInput')} onGoToInput={(h, t) => { setCurrentHole(h); setHostSelectedTeam(t); setCurrentView('scoreInput'); }} onOpenAwards={() => { setPreviousView('scoreboard'); setCurrentView('awards'); }} isRoundStarted={isRoundStarted} onGoToWaitingRoom={() => setCurrentView('waitingRoom')} />;
          case 'awards': return <AwardsPageViewMain stats={stats} syncStats={syncStats} predictionStats={predictionStats} totalPar={totalPar} teamNames={teamNames} teamData={teamData} eventName={eventName} isAwardOpen={isAwardOpenFlag} isAwardsManuallyOpened={isAwardsManuallyOpened} setIsAwardsManuallyOpened={setIsAwardsManuallyOpened} currentUserRole={currentUserRole} customGroups={customGroups} enableGroupComp={enableGroupComp} enableTeamComp={enableTeamComp} teamBalanceMode={teamBalanceMode} groupBalanceMode={groupBalanceMode} selectedAwards={selectedAwards} stablefordTitle={stablefordTitle} allPars={allPars} onBack={() => setCurrentView(previousView)} setDetailModal={setDetailModal} setIsAwardInfoOpen={setIsAwardInfoOpen} onRefresh={handleManualRefresh} isRoundStarted={isRoundStarted} onGoToWaitingRoom={() => setCurrentView('waitingRoom')} specialRankings={{ nearest: specialRecords.flatMap((hr, hI) => hr ? Object.entries(hr).filter(([_,r]) => r.nearest?.pIdx != null).map(([tI, r]) => ({ name: teamData[tI][r.nearest.pIdx].name, tIdx: parseInt(tI), pIdx: r.nearest.pIdx, distance: r.nearest.distance, hIdx: hI, isInvalid: specialHoles.requirePar && allScores[hI]?.[tI]?.[r.nearest.pIdx] - (allPars[tI]?.[hI]||4) > 0 && !r.nearest.isPar })) : []).sort((a,b) => a.isInvalid === b.isInvalid ? a.distance - b.distance : (a.isInvalid ? 1 : -1)), longest: specialRecords.flatMap((hr, hI) => hr ? Object.entries(hr).filter(([_,r]) => r.longest?.pIdx != null).map(([tI, r]) => ({ name: teamData[tI][r.longest.pIdx].name, tIdx: parseInt(tI), pIdx: r.longest.pIdx, distance: r.longest.distance, hIdx: hI, isInvalid: specialHoles.requirePar && allScores[hI]?.[tI]?.[r.longest.pIdx] - (allPars[tI]?.[hI]||4) > 0 && !r.longest.isPar })) : []).sort((a,b) => a.isInvalid === b.isInvalid ? b.distance - a.distance : (a.isInvalid ? 1 : -1)) }} />;
          default: return null;
        }
      };

      return (
        <div className="min-h-screen bg-gray-50 text-[#1E293B] sm:max-w-md sm:mx-auto sm:border-x sm:shadow-2xl relative overflow-x-hidden font-pretendard">
          {renderCurrentView()}
          <DetailModal isOpen={!!detailModal} onClose={() => setDetailModal(null)} config={detailModal} />
          <PosterPopup isOpen={isPosterOpen} onClose={() => setIsPosterOpen(false)} />
          {isAwardInfoOpen && (
            <div className="fixed inset-0 z-[300] flex items-center justify-center px-4 font-sans font-pretendard">
              <div className="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onClick={() => setIsAwardInfoOpen(false)} />
              <div className="bg-white w-full max-w-sm rounded-[32px] p-6 relative z-10 shadow-2xl animate-fade-in-up text-left text-[#1E293B]">
                <div className="flex items-center justify-between mb-4"><h3 className="text-slate-800 font-black text-lg flex items-center gap-2"><Icons.Info className="w-5 h-5 text-[#0D8A5E]"/> 시상 기준 안내</h3><button onClick={() => setIsAwardInfoOpen(false)} className="p-1.5 text-slate-400 hover:bg-slate-50 rounded-full"><Icons.X className="w-5 h-5" /></button></div>
                <div className="space-y-3 text-sm text-slate-600 max-h-[60vh] overflow-y-auto pr-1 pb-4 leading-relaxed no-scrollbar text-left">
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-100"><b>전체 순위 (실시간):</b> 현재까지 플레이한 홀을 기준으로 한 실제 스코어 순위입니다.</div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-100"><b>전체 순위 (예상 기준):</b> 개인의 핸디캡과 당일 타수 페이스를 바탕으로 한 18홀 예상 실제 타수입니다.</div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-100"><b>조별/그룹 순위:</b> 팀 평균 실제 타수를 비교합니다.</div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-100"><b>신페리오:</b> 임의 지정된 12개 홀 성적을 바탕으로 당일 핸디캡을 산출하는 네트 스코어 순위입니다.</div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-100"><b>다파/다찐파:</b> 파(Par) 1점, 양파(Double Par) 2점으로 합산 (다찐파는 양파 제외 순수 파만 카운트)</div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-100"><b>다보기/다찐보기:</b> 보기 1점, 더블 2점, 트리플 3점 등 오버파 수만큼 합산 (다찐보기는 순수 보기만 카운트)</div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-100"><b>다찐양파:</b> 양파(Double Par) 횟수만 카운트합니다.</div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-100"><b>일취월장/낙차큰커브:</b> 핸디캡 대비 스코어를 가장 많이 줄이거나(-) 잃은(+) 플레이어입니다.</div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-100"><b>널뛰기/시몬스:</b> 2번 홀부터 이전 홀과의 타수 차이를 누적 합산합니다.</div>
                </div>
                <button onClick={() => setIsAwardInfoOpen(false)} className="w-full bg-[#0D8A5E] text-white font-bold py-3.5 rounded-xl shadow-md mt-2 active:scale-95 transition-all">확인</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
