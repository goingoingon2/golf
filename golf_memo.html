    // === [라운드 비용 정산기] 그린피·카트·캐디 엔빵 + 게임머니 정산 ===
    function SettleCalc() {
      const [mode, setMode] = useState('split'); // 'split' | 'gae'
      const onlyNum = (v) => (v || '').toString().replace(/[^0-9]/g, '');
      const num = (v) => parseInt(onlyNum(v) || '0', 10) || 0;
      const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
      const amtColor = (v) => /^-/.test(String(v || '')) ? 'text-red-500' : (v ? 'text-blue-600' : 'text-gray-900'); // 음수 빨강 / 양수 파랑
      const normAmt = (v) => { const neg = String(v).trim().startsWith('-'); const d = String(v).replace(/[^0-9]/g, ''); return (neg ? '-' : '') + d; }; // 저장값: 부호+숫자
      const fmtAmt = (v) => { const s = String(v || ''); if (s === '' || s === '-') return s; const neg = s.startsWith('-'); const d = s.replace(/[^0-9]/g, ''); return d === '' ? (neg ? '-' : '') : (neg ? '-' : '') + Number(d).toLocaleString('ko-KR'); }; // 표시값: 콤마

      // --- 비용 엔빵 ---
      const [people, setPeople] = useState(4);
      const [items, setItems] = useState([
        { label: '그린피', value: '' },
        { label: '카트비', value: '' },
        { label: '캐디피', value: '' },
        { label: '식사/기타', value: '' },
      ]);
      const setItemValue = (i, v) => setItems(prev => prev.map((it, idx) => idx === i ? { ...it, value: onlyNum(v) } : it));
      const setItemLabel = (i, v) => setItems(prev => prev.map((it, idx) => idx === i ? { ...it, label: v } : it));
      const addItem = () => setItems(prev => prev.length >= 10 ? prev : [...prev, { label: '', value: '' }]);
      const removeItem = (i) => setItems(prev => prev.length <= 1 ? prev : prev.filter((_, idx) => idx !== i));
      const total = items.reduce((s, it) => s + num(it.value), 0);
      const per = people > 0 ? Math.ceil(total / people / 100) * 100 : 0; // 100원 단위 올림

      // --- 게임머니 정산 ---
      const [gp, setGp] = useState([
        { name: '', amount: '' }, { name: '', amount: '' },
        { name: '', amount: '' }, { name: '', amount: '' },
      ]);
      const setGpField = (i, field, v) => setGp(prev => prev.map((p, idx) => idx === i ? { ...p, [field]: field === 'amount' ? normAmt(v) : v } : p));
      const addGp = () => setGp(prev => prev.length >= 8 ? prev : [...prev, { name: '', amount: '' }]);
      const removeGp = (i) => setGp(prev => prev.length <= 2 ? prev : prev.filter((_, idx) => idx !== i));
      const gpSum = gp.reduce((s, p) => s + (parseInt(p.amount || '0', 10) || 0), 0);

      // --- 개평 계산 (딴 사람이 비율만큼 잃은 사람에게 돌려줌) ---
      const [gaeRatio, setGaeRatio] = useState('10');
      // 제외 비용 (공통비용·캐디팁 등): 게임머니 합계 + 제외 비용 = 0 이어야 균형
      const [exCosts, setExCosts] = useState([{ label: '공통비용', amount: '' }, { label: '캐디 팁', amount: '' }]);
      const setExField = (i, field, v) => setExCosts(prev => prev.map((c, idx) => idx === i ? { ...c, [field]: field === 'amount' ? normAmt(v) : v } : c));
      const addEx = () => setExCosts(prev => prev.length >= 6 ? prev : [...prev, { label: '', amount: '' }]);
      const removeEx = (i) => setExCosts(prev => prev.filter((_, idx) => idx !== i));
      const exSum = exCosts.reduce((s, c) => s + (parseInt(c.amount || '0', 10) || 0), 0);
      const gaeTotal = gpSum + exSum; // 전체 합계 (0이면 균형)
      const computeGaepyeong = () => {
        const ratio = Math.max(0, Math.min(100, parseFloat(gaeRatio || '0') || 0)) / 100;
        const players = gp.map((p, i) => ({ name: (p.name || '').trim() || `P${i + 1}`, amt: parseInt(p.amount || '0', 10) || 0 }));
        const winners = players.filter(p => p.amt > 0);
        const losers = players.filter(p => p.amt < 0);
        const totalLoss = losers.reduce((s, p) => s + (-p.amt), 0);
        const givers = winners.map(p => ({ name: p.name, won: p.amt, give: Math.round(p.amt * ratio) }));
        const pool = givers.reduce((s, g) => s + g.give, 0);
        const receivers = losers.map(p => ({ name: p.name, lost: -p.amt, receive: totalLoss > 0 ? Math.round(pool * (-p.amt) / totalLoss) : 0 }));
        // 반올림 오차는 마지막에 받는 사람이 흡수 (합계 = 개평 총액 보장)
        const recvSum = receivers.reduce((s, r) => s + r.receive, 0);
        if (receivers.length && recvSum !== pool) receivers[receivers.length - 1].receive += (pool - recvSum);
        return { ratio, givers, receivers, pool };
      };
      const gae = mode === 'gae' ? computeGaepyeong() : null;

      const inputCls = "w-full bg-white border border-[#d1c9b8] rounded-2xl px-4 py-3 text-[16px] font-bold outline-none focus:border-[#1a4314] text-right";

      return (
        <div className="p-5 bg-[#fdfcf9] min-h-full flex flex-col gap-5 pb-10">
          <h2 className="text-[24px] font-black pt-2">라운드 정산</h2>

          <div className="flex bg-[#E2D9C8] rounded-2xl p-1 gap-1">
            <button onClick={() => setMode('split')} className={`flex-1 py-2.5 rounded-xl font-black text-[13px] transition-colors ${mode==='split' ? 'bg-[#1a4314] text-white shadow' : 'text-[#1a4314]'}`}>비용 엔빵</button>
            <button onClick={() => setMode('gae')} className={`flex-1 py-2.5 rounded-xl font-black text-[13px] transition-colors ${mode==='gae' ? 'bg-[#1a4314] text-white shadow' : 'text-[#1a4314]'}`}>개평 계산</button>
          </div>

          {mode === 'split' && (
            <>
              <div className="bg-white rounded-[24px] border border-[#d1c9b8] p-4 flex flex-col gap-2.5 shadow-sm">
                {items.map((it, i) => (
                  <div key={i} className="flex items-center gap-2">
                    <input value={it.label} onChange={e=>setItemLabel(i, e.target.value)} placeholder="항목명" className="w-[96px] shrink-0 bg-white border border-[#d1c9b8] rounded-xl px-3 py-2.5 text-[14px] font-bold outline-none focus:border-[#1a4314]" />
                    <input inputMode="numeric" value={it.value ? Number(it.value).toLocaleString('ko-KR') : ''} onChange={e=>setItemValue(i, e.target.value)} placeholder="0" className="flex-1 min-w-0 bg-white border border-[#d1c9b8] rounded-xl px-3 py-2.5 text-[15px] font-bold outline-none focus:border-[#1a4314] text-right" />
                    {items.length > 1 && <button onClick={()=>removeItem(i)} className="text-gray-300 hover:text-red-500 shrink-0"><Icon name="X" size={18}/></button>}
                  </div>
                ))}
                {items.length < 10 && <button onClick={addItem} className="mt-1 py-2.5 rounded-xl border border-dashed border-[#d1c9b8] text-[#1a4314] font-bold text-[13px] flex items-center justify-center gap-1.5"><Icon name="Plus" size={15}/> 항목 추가</button>}
              </div>

              <div className="bg-white rounded-[24px] border border-[#d1c9b8] p-5 flex items-center justify-between shadow-sm">
                <span className="font-extrabold text-[15px] text-gray-800">인원수</span>
                <div className="flex items-center gap-4">
                  <button onClick={()=>setPeople(p=>Math.max(1, p-1))} className="w-10 h-10 rounded-full bg-[#E2D9C8] text-[#1a4314] font-black flex items-center justify-center active:scale-90 transition-transform"><Icon name="Minus" size={18}/></button>
                  <span className="text-[24px] font-black w-8 text-center">{people}</span>
                  <button onClick={()=>setPeople(p=>Math.min(8, p+1))} className="w-10 h-10 rounded-full bg-[#1a4314] text-white font-black flex items-center justify-center active:scale-90 transition-transform"><Icon name="Plus" size={18}/></button>
                </div>
              </div>

              <div className="bg-[#1a4314] text-white rounded-[28px] p-7 shadow-lg flex flex-col items-center relative overflow-hidden">
                <Icon name="Trophy" size={120} className="absolute -right-5 -top-3 opacity-10" />
                <p className="text-[#a5d6a7] text-[13px] font-bold z-10">총 비용 {fmt(total)}원 · {people}인</p>
                <p className="text-[13px] text-[#a5d6a7] font-bold mt-4 z-10">1인당</p>
                <p className="text-[46px] font-black leading-none z-10">{fmt(per)}<span className="text-[22px]">원</span></p>
                {per>0 && total>0 && per*people-total !== 0 && <p className="text-[11px] text-[#a5d6a7]/80 mt-3 z-10">100원 단위 반올림 · 모으면 {fmt(per*people)}원</p>}
              </div>
            </>
          )}

          {mode === 'gae' && (
            <>
              {mode === 'gae' && (
                <div className="bg-white rounded-[24px] border border-[#d1c9b8] p-4 shadow-sm">
                  <div className="font-extrabold text-[14px] text-gray-800 mb-0.5">제외 비용 <span className="text-[11px] text-gray-400 font-bold">(공통비용·캐디팁 등)</span></div>
                  <p className="text-[11px] text-gray-400 font-medium mb-2.5">잃은 돈에서 먼저 빠지는 공통 경비입니다.</p>
                  <div className="flex flex-col gap-2">
                    {exCosts.map((c, i) => (
                      <div key={i} className="flex items-center gap-2">
                        <input value={c.label} onChange={e=>setExField(i,'label',e.target.value)} placeholder="항목명" className="flex-1 min-w-0 bg-white border border-[#d1c9b8] rounded-xl px-3 py-2.5 text-[15px] font-bold outline-none focus:border-[#1a4314]" />
                        <input inputMode="numeric" value={fmtAmt(c.amount)} onChange={e=>setExField(i,'amount',e.target.value)} placeholder="금액" className={`w-[110px] shrink-0 bg-white border border-[#d1c9b8] rounded-xl px-3 py-2.5 text-[15px] font-bold outline-none focus:border-[#1a4314] text-right ${amtColor(c.amount)}`} />
                        <button onClick={()=>removeEx(i)} className="text-gray-300 hover:text-red-500 shrink-0"><Icon name="X" size={18}/></button>
                      </div>
                    ))}
                    {exCosts.length < 6 && <button onClick={addEx} className="mt-1 py-2.5 rounded-xl border border-dashed border-[#d1c9b8] text-[#1a4314] font-bold text-[13px] flex items-center justify-center gap-1.5"><Icon name="Plus" size={15}/> 항목 추가</button>}
                  </div>
                </div>
              )}
              <p className="text-[13px] text-gray-500 font-medium px-1 -mt-1">딴 사람은 <b className="text-blue-600">양수(+)</b>, 잃은 사람은 <b className="text-red-500">음수(-)</b>로 입력하세요.</p>
              <div className="bg-white rounded-[24px] border border-[#d1c9b8] p-4 flex flex-col gap-2.5 shadow-sm">
                {gp.map((p, i) => (
                  <div key={i} className="flex items-center gap-2">
                    <input value={p.name} onChange={e=>setGpField(i,'name',e.target.value)} placeholder={`이름 ${i+1}`} className="flex-1 min-w-0 bg-white border border-[#d1c9b8] rounded-xl px-3 py-2.5 text-[15px] font-bold outline-none focus:border-[#1a4314]" />
                    <input inputMode="numeric" value={fmtAmt(p.amount)} onChange={e=>setGpField(i,'amount',e.target.value)} placeholder="±금액" className={`w-[110px] shrink-0 bg-white border border-[#d1c9b8] rounded-xl px-3 py-2.5 text-[15px] font-bold outline-none focus:border-[#1a4314] text-right ${amtColor(p.amount)}`} />
                    {gp.length > 2 && <button onClick={()=>removeGp(i)} className="text-gray-300 hover:text-red-500 shrink-0"><Icon name="X" size={18}/></button>}
                  </div>
                ))}
                {gp.length < 8 && <button onClick={addGp} className="mt-1 py-2.5 rounded-xl border border-dashed border-[#d1c9b8] text-[#1a4314] font-bold text-[13px] flex items-center justify-center gap-1.5"><Icon name="Plus" size={15}/> 인원 추가</button>}
              </div>

              {mode === 'gae' && (
                <>
                  <div className={`rounded-2xl px-4 py-3 flex items-center justify-between border ${gaeTotal === 0 ? 'bg-[#f0fdf4] border-[#d7ecd9]' : 'bg-orange-50 border-orange-200'}`}>
                    <span className={`text-[13px] font-extrabold flex items-center gap-1.5 ${gaeTotal === 0 ? 'text-[#16a34a]' : 'text-orange-600'}`}>
                      <Icon name={gaeTotal === 0 ? 'Check' : 'Target'} size={15}/>
                      {gaeTotal === 0 ? '전체 합계 균형 (0원)' : `전체 합계 ${fmt(gaeTotal)}원 (0 아님)`}
                    </span>
                    <span className="text-[11px] font-bold text-gray-400">게임 {fmt(gpSum)} + 제외 {fmt(exSum)}</span>
                  </div>

                  <div className="bg-white rounded-[24px] border border-[#d1c9b8] p-5 flex items-center justify-between shadow-sm">
                    <div className="flex flex-col">
                      <span className="font-extrabold text-[15px] text-gray-800">개평 비율</span>
                      <span className="text-[11px] text-gray-400 font-bold mt-0.5">딴 금액에서 돌려줄 비율</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <div className="flex gap-1.5">
                        {['10','20','30','50'].map(r => (
                          <button key={r} onClick={()=>setGaeRatio(r)} className={`w-9 h-9 rounded-lg text-[12px] font-black transition-colors ${gaeRatio===r ? 'bg-[#1a4314] text-white' : 'bg-[#E2D9C8] text-[#1a4314]'}`}>{r}</button>
                        ))}
                      </div>
                      <div className="relative w-[64px]">
                        <input inputMode="numeric" value={gaeRatio} onChange={e=>setGaeRatio(e.target.value.replace(/[^0-9]/g,'').slice(0,3))} className="w-full bg-white border border-[#d1c9b8] rounded-xl pl-3 pr-6 py-2.5 text-[16px] font-black outline-none focus:border-[#1a4314] text-right" />
                        <span className="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 font-bold text-[13px] pointer-events-none">%</span>
                      </div>
                    </div>
                  </div>

                  <div className="bg-[#1a4314] text-white rounded-[24px] px-6 py-5 shadow-lg flex justify-between items-center relative overflow-hidden">
                    <Icon name="Share2" size={90} className="absolute -right-3 -bottom-4 opacity-10" />
                    <span className="text-[#a5d6a7] text-[14px] font-bold z-10">총 개평 금액 ({gae.ratio*100||0}%)</span>
                    <span className="text-[28px] font-black z-10">{fmt(gae.pool)}<span className="text-[15px] ml-0.5">원</span></span>
                  </div>

                  <div className="bg-white rounded-[24px] border border-[#d1c9b8] p-5 shadow-sm">
                    {gae.givers.length === 0 && gae.receivers.length === 0 ? (
                      <p className="text-gray-400 font-bold text-[14px] py-4 text-center">이름과 금액을 입력하면 개평이 계산됩니다.</p>
                    ) : (
                      <>
                        <div className="text-[12px] font-extrabold text-gray-400 mb-2 flex items-center gap-1.5"><Icon name="Minus" size={12} className="text-red-500"/> 개평 주는 사람 (딴 사람)</div>
                        <div className="flex flex-col gap-2 mb-4">
                          {gae.givers.length === 0 ? <p className="text-gray-300 text-[13px] font-bold px-1">없음</p> : gae.givers.map((g, i) => (
                            <div key={i} className="flex items-center justify-between bg-red-50 border border-red-100 rounded-xl px-4 py-3">
                              <span className="font-extrabold text-[14px]">{g.name} <span className="text-gray-400 font-bold text-[12px]">(딴 돈 {fmt(g.won)})</span></span>
                              <span className="font-black text-[15px] text-red-500">-{fmt(g.give)}원</span>
                            </div>
                          ))}
                        </div>
                        <div className="text-[12px] font-extrabold text-gray-400 mb-2 flex items-center gap-1.5"><Icon name="Plus" size={12} className="text-blue-600"/> 개평 받는 사람 (잃은 사람)</div>
                        <div className="flex flex-col gap-2">
                          {gae.receivers.length === 0 ? <p className="text-gray-300 text-[13px] font-bold px-1">없음</p> : gae.receivers.map((r, i) => (
                            <div key={i} className="flex items-center justify-between bg-[#f0fdf4] border border-[#d7ecd9] rounded-xl px-4 py-3">
                              <span className="font-extrabold text-[14px]">{r.name} <span className="text-gray-400 font-bold text-[12px]">(잃은 돈 {fmt(r.lost)})</span></span>
                              <span className="font-black text-[15px] text-blue-600">+{fmt(r.receive)}원</span>
                            </div>
                          ))}
                        </div>
                      </>
                    )}
                  </div>
                </>
              )}
            </>
          )}
        </div>
      );
    }

    // === [골프 메트로놈] 스윙 템포 연습 · 클릭음 + 음성 구령(인앱) ===
    const MET_PHRASES = [
      { name: '백·스윙', beats: 2, labels: ['백', '스윙'] },
      { name: '머리·고정', beats: 2, labels: ['머리', '고정'] },
      { name: '체중·이동', beats: 2, labels: ['체중', '이동'] },
      { name: '힘을·빼자', beats: 2, labels: ['힘을', '빼자'] },
      { name: '골프·메트로·놈', beats: 3, labels: ['골프', '메트로', '놈'] },
      { name: '하체·리드·스윙', beats: 3, labels: ['하체', '리드', '스윙'] },
      { name: '부·드·럽게', beats: 3, labels: ['부', '드', '럽게'] },
      { name: '끝·까·지', beats: 3, labels: ['끝', '까', '지'] },
    ];
    function Metronome() {
      const [bpm, setBpm] = useState(72);
      const [beatsClick, setBeatsClick] = useState(4);
      const [playing, setPlaying] = useState(false);
      const [beat, setBeat] = useState(-1);
      const [accentOn, setAccentOn] = useState(true);
      const [mode, setMode] = useState('click'); // 'click' | 'voice'
      const [phrase, setPhrase] = useState(MET_PHRASES[4]); // 골프·메트로·놈
      const audioRef = useRef(null);
      const beatRef = useRef(0);
      const tapRef = useRef([]);

      const activeBeats = mode === 'voice' ? phrase.beats : beatsClick;
      const setBpmClamped = (v) => setBpm(Math.max(40, Math.min(240, Math.round(v))));
      const adjust = (d) => setBpm(b => Math.max(40, Math.min(240, b + d)));

      const click = (accent) => {
        try {
          if (!audioRef.current) audioRef.current = new (window.AudioContext || window.webkitAudioContext)();
          const ctx = audioRef.current;
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.value = accent ? 1000 : 800;
          g.gain.setValueAtTime(accent ? 0.6 : 0.3, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
          o.start(); o.stop(ctx.currentTime + 0.1);
        } catch (e) {}
      };

      const speak = (text) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const t = text === '2' ? '둘' : text === '3' ? '셋' : text;
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'ko-KR';
        u.rate = Math.min(2.5, Math.max(1.0, bpm / 60));
        u.pitch = 1.1;
        window.speechSynthesis.speak(u);
      };

      // 재생 중에만 박자 타이머 가동. 설정 변경 시 자동 재시작.
      useEffect(() => {
        if (!playing) { setBeat(-1); return; }
        try { if (!audioRef.current) audioRef.current = new (window.AudioContext || window.webkitAudioContext)(); audioRef.current.resume(); } catch (e) {}
        if (mode === 'voice' && 'speechSynthesis' in window) { try { window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {} }
        beatRef.current = 0;
        setBeat(0);
        if (mode === 'voice') speak(phrase.labels[0]); else click(accentOn);
        const id = setInterval(() => {
          beatRef.current = (beatRef.current + 1) % activeBeats;
          setBeat(beatRef.current);
          if (mode === 'voice') speak(phrase.labels[beatRef.current]);
          else click(accentOn && beatRef.current === 0);
        }, 60000 / bpm);
        return () => { clearInterval(id); if ('speechSynthesis' in window) window.speechSynthesis.cancel(); };
      }, [playing, bpm, activeBeats, mode, accentOn, phrase]);

      // 탭 템포: 두드린 간격의 평균으로 BPM 추정
      const handleTap = () => {
        const now = performance.now();
        const arr = tapRef.current.filter(t => now - t < 2000);
        arr.push(now);
        tapRef.current = arr;
        if (arr.length >= 2) {
          const ints = [];
          for (let i = 1; i < arr.length; i++) ints.push(arr[i] - arr[i - 1]);
          const avg = ints.reduce((a, b) => a + b, 0) / ints.length;
          if (avg > 0) setBpmClamped(60000 / avg);
        }
      };

      const tempo = bpm < 60 ? { label: '매우 느림', tag: 'Largo' }
        : bpm < 76 ? { label: '느림', tag: 'Adagio' }
        : bpm < 96 ? { label: '보통', tag: 'Andante' }
        : bpm < 120 ? { label: '조금 빠름', tag: 'Moderato' }
        : bpm < 144 ? { label: '빠름', tag: 'Allegro' }
        : { label: '매우 빠름', tag: 'Presto' };

      return (
        <div className="p-5 flex flex-col items-center gap-4 pb-24">
          <div className="text-center mt-1">
            <div className="text-[22px] font-black text-[#1a4314]">골프 메트로놈</div>
            <div className="text-[12px] font-semibold text-gray-500 mt-1">스윙 템포를 맞춰보세요</div>
          </div>

          {/* 박자 표시 (클릭=점 / 구령=글자) */}
          <div className="flex gap-2 flex-wrap justify-center min-h-[44px] items-center">
            {Array.from({ length: activeBeats }).map((_, i) => (
              mode === 'voice'
                ? <div key={i} className={`min-w-[46px] h-11 px-3 rounded-full border-2 flex items-center justify-center text-[14px] font-black transition-all duration-100 ${beat === i ? (i === 0 ? 'bg-[#1a4314] border-[#1a4314] text-white scale-110' : 'bg-green-400 border-green-400 text-white scale-105') : 'bg-white border-[#d0c8b8] text-gray-500'}`}>{phrase.labels[i]}</div>
                : <div key={i} className={`w-9 h-9 rounded-full border-2 flex items-center justify-center transition-all duration-100 ${beat === i ? (i === 0 ? 'bg-[#1a4314] border-[#1a4314] scale-110' : 'bg-green-400 border-green-400 scale-105') : 'bg-white border-[#d0c8b8]'}`}><div className={`w-2.5 h-2.5 rounded-full ${beat === i ? 'bg-white' : 'bg-[#d0c8b8]'}`}></div></div>
            ))}
          </div>

          {/* BPM 카드 */}
          <div className="w-full bg-white rounded-[20px] border border-[#d8cfc0] p-5 flex flex-col items-center gap-3 shadow-sm">
            <div className="flex items-center gap-5">
              <button onClick={() => adjust(-1)} className="w-11 h-11 rounded-full bg-[#E2D9C8] text-[#1a4314] flex items-center justify-center active:scale-90 transition-transform"><Icon name="Minus" size={20}/></button>
              <div className="flex flex-col items-center">
                <div className="text-[56px] font-black text-[#1a4314] leading-none">{bpm}</div>
                <div className="text-[12px] font-bold text-gray-400 mt-1">BPM · {tempo.label} <span className="text-gray-300">({tempo.tag})</span></div>
              </div>
              <button onClick={() => adjust(1)} className="w-11 h-11 rounded-full bg-[#1a4314] text-white flex items-center justify-center active:scale-90 transition-transform"><Icon name="Plus" size={20}/></button>
            </div>
            <input type="range" min="40" max="240" value={bpm} onChange={e => setBpm(Number(e.target.value))} className="w-full accent-[#1a4314]" />
            <div className="flex gap-1.5 w-full">
              {[60, 72, 80, 96, 120].map(v => (
                <button key={v} onClick={() => setBpm(v)} className={`flex-1 py-1.5 rounded-[10px] text-[12px] font-bold border transition-colors ${bpm === v ? 'bg-[#1a4314] text-white border-[#1a4314]' : 'bg-white text-gray-600 border-[#d8cfc0]'}`}>{v}</button>
              ))}
            </div>
          </div>

          {/* 소리 모드 */}
          <div className="flex bg-[#E2D9C8] rounded-2xl p-1 gap-1 w-full">
            <button onClick={() => setMode('click')} className={`flex-1 py-2.5 rounded-xl font-black text-[13px] transition-colors ${mode === 'click' ? 'bg-[#1a4314] text-white shadow' : 'text-[#1a4314]'}`}>클릭음</button>
            <button onClick={() => setMode('voice')} className={`flex-1 py-2.5 rounded-xl font-black text-[13px] transition-colors ${mode === 'voice' ? 'bg-[#1a4314] text-white shadow' : 'text-[#1a4314]'}`}>🗣️ 음성 구령</button>
          </div>

          {/* 모드별 설정 */}
          {mode === 'voice' ? (
            <div className="w-full bg-white rounded-2xl border border-[#d8cfc0] p-3 shadow-sm">
              <div className="text-[11px] font-bold text-gray-400 mb-2">구령 문구 · 박자에 맞춰 말소리로 읽어줘요</div>
              <div className="flex flex-wrap gap-1.5">
                {MET_PHRASES.map(ph => (
                  <button key={ph.name} onClick={() => setPhrase(ph)} className={`px-2.5 py-1.5 rounded-lg text-[12px] font-bold border transition-colors ${phrase.name === ph.name ? 'bg-[#1a4314] text-white border-[#1a4314]' : 'bg-white text-gray-600 border-[#d8cfc0]'}`}>{ph.name} <span className="opacity-60">{ph.beats}박</span></button>
                ))}
              </div>
            </div>
          ) : (
            <div className="flex gap-2.5 w-full">
              <div className="flex-1 bg-white rounded-2xl border border-[#d8cfc0] p-3 shadow-sm">
                <div className="text-[11px] font-bold text-gray-400 mb-2">박자</div>
                <div className="flex gap-1.5">
                  {[2, 3, 4].map(n => (
                    <button key={n} onClick={() => setBeatsClick(n)} className={`flex-1 py-1.5 rounded-[10px] text-[12px] font-bold border transition-colors ${beatsClick === n ? 'bg-[#1a4314] text-white border-[#1a4314]' : 'bg-white text-gray-600 border-[#d8cfc0]'}`}>{n}/4</button>
                  ))}
                </div>
              </div>
              <button onClick={() => setAccentOn(a => !a)} className={`w-[92px] shrink-0 rounded-2xl py-3 font-bold text-[12px] border transition-colors ${accentOn ? 'bg-[#1a4314] text-white border-[#1a4314]' : 'bg-white text-gray-500 border-[#d8cfc0]'}`}>강박 {accentOn ? 'ON' : 'OFF'}</button>
            </div>
          )}

          {/* 탭 템포 + 시작/정지 */}
          <div className="flex gap-2.5 w-full">
            <button onClick={handleTap} className="flex-1 bg-white border border-[#d8cfc0] rounded-2xl py-3.5 font-black text-[14px] text-[#1a4314] shadow-sm active:scale-95 transition-transform flex items-center justify-center gap-2"><Icon name="Target" size={16}/> 탭 템포</button>
            <button onClick={() => setPlaying(p => !p)} className={`flex-1 rounded-2xl font-black text-[15px] flex items-center justify-center gap-2 text-white shadow-lg active:scale-95 transition-transform ${playing ? 'bg-red-500' : 'bg-[#1a4314]'}`}>
              <Icon name={playing ? 'Pause' : 'Play'} size={20} />{playing ? '정지' : '시작'}
            </button>
          </div>

          {/* 스윙 템포 팁 */}
          <div className="w-full bg-[#e8f5e9] border border-[#b5d8b5] rounded-2xl p-4 flex gap-3">
            <Icon name="Sparkles" size={18} className="text-[#1a4314] mt-0.5 shrink-0" />
            <div>
              <p className="text-[13px] font-extrabold text-[#1a4314] mb-1">스윙 템포 팁</p>
              <p className="text-[12px] text-[#2d6a4f] font-medium leading-[1.5]">백스윙 : 다운스윙 = <b>3 : 1</b> 리듬이 이상적이에요. 음성 구령 모드로 <b>"백·스윙"</b> 같은 문구에 맞춰 리듬을 익혀보세요.</p>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [fbUser, setFbUser] = useState(null);

      const [defaultTab, setDefaultTab] = useState('memo');
      const [currentTab, setCurrentTab] = useState(defaultTab);
      const [view, setView] = useState('list');
      const [activeCategory, setActiveCategory] = useState("전체");
      const [searchQuery, setSearchQuery] = useState("");
      const [categories, setCategories] = useState(INITIAL_CATEGORIES);
      const [memos, setMemos] = useState([]);
      const [shotMemos, setShotMemos] = useState([]);
      const [scores, setScores] = useState([]);
      const [blockedUsers, setBlockedUsers] = useState([]);
      const [hiddenFromUsers, setHiddenFromUsers] = useState([]);
      const [currentMemo, setCurrentMemo] = useState(null);
      const [currentScore, setCurrentScore] = useState(null);
      
      const [isSelectionMode, setIsSelectionMode] = useState(false);
      const [selectedMemoIds, setSelectedMemoIds] = useState([]);
      const [confirmDelMerge, setConfirmDelMerge] = useState(false); // 통합 하단바 삭제 확인
      
      const [blockModalTarget, setBlockModalTarget] = useState(null);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const drawBackRef = useRef(null); // 뽑기게임 단계별 뒤로 핸들러 (상단 헤더에서 호출)
      const [showMergeModal, setShowMergeModal] = useState(false);
      const [isMerging, setIsMerging] = useState(false);

      const [baseFontSize, setBaseFontSize] = useState(15);
      const [followingUsers, setFollowingUsers] = useState(['골프여신']);

      // 첫 진입 온보딩 슬라이드 (localStorage로 한 번만)
      const [showOnboarding, setShowOnboarding] = useState(() => { try { return !localStorage.getItem('golfMemoOnboarded'); } catch (e) { return true; } });
      const finishOnboarding = () => { try { localStorage.setItem('golfMemoOnboarded', '1'); } catch (e) {} setShowOnboarding(false); };
      // 예시 데이터 안내 배너 (메모/숏메모 상단, X로 삭제)
      const [guideNotice, setGuideNotice] = useState(() => { try { return !localStorage.getItem('golfMemoGuideClosed'); } catch (e) { return true; } });
      const closeGuideNotice = () => { try { localStorage.setItem('golfMemoGuideClosed', '1'); } catch (e) {} setGuideNotice(false); };

      // === 로컬 모드: Firebase 미연동 시 샘플 데이터로 시작 ===
      useEffect(() => {
        if (db) return; // Firebase 연동 시에는 아래 스냅샷 이펙트가 처리
        const sortDesc = (arr) => [...arr].sort((a, b) => Number(b.id) - Number(a.id));
        setMemos(sortDesc(INITIAL_MEMOS));
        setShotMemos(sortDesc(INITIAL_SHOT_MEMOS));
        setScores(sortDesc(INITIAL_SCORES));
      }, []);

      // 로컬 모드에서 특정 메모를 갱신하는 헬퍼
      const localUpdateMemo = (id, updater) => setMemos(prev => prev.map(m => m.id === id.toString() ? updater(m) : m));

      // === Firebase Auth Effect ===
      useEffect(() => {
        if (!auth) return;
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) { console.error("Firebase Auth Error", e); }
        };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, setFbUser);
        return () => unsubscribe();
      }, []);

      // === Firebase Data Sync Effects ===
      // 1. Memos (Public)
      useEffect(() => {
        if (!fbUser || !db) return;
        const q = collection(db, 'artifacts', appId, 'public', 'data', 'memos');
        const unsub = onSnapshot(q, (snap) => {
          if (snap.empty) {
            setMemos(INITIAL_MEMOS);
            INITIAL_MEMOS.forEach(async (m) => await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'memos', m.id.toString()), m));
          } else {
            const data = snap.docs.map(d => ({ ...d.data(), id: d.id })).sort((a, b) => Number(b.id) - Number(a.id));
            setMemos(data);
          }
        }, (err) => console.error(err));
        return () => unsub();
      }, [fbUser]);

      // 2. Shot Memos (Private)
      useEffect(() => {
        if (!fbUser || !db) return;
        const q = collection(db, 'artifacts', appId, 'users', fbUser.uid, 'shotMemos');
        const unsub = onSnapshot(q, (snap) => {
          if (snap.empty) {
            setShotMemos(INITIAL_SHOT_MEMOS);
            INITIAL_SHOT_MEMOS.forEach(async (m) => await setDoc(doc(db, 'artifacts', appId, 'users', fbUser.uid, 'shotMemos', m.id.toString()), m));
          } else {
            const data = snap.docs.map(d => ({ ...d.data(), id: d.id })).sort((a, b) => Number(b.id) - Number(a.id));
            setShotMemos(data);
          }
        }, (err) => console.error(err));
        return () => unsub();
      }, [fbUser]);

      // 3. Scores (Private)
      useEffect(() => {
        if (!fbUser || !db) return;
        const q = collection(db, 'artifacts', appId, 'users', fbUser.uid, 'scores');
        const unsub = onSnapshot(q, (snap) => {
          if (snap.empty) {
            setScores(INITIAL_SCORES);
            INITIAL_SCORES.forEach(async (s) => await setDoc(doc(db, 'artifacts', appId, 'users', fbUser.uid, 'scores', s.id.toString()), s));
          } else {
            const data = snap.docs.map(d => ({ ...d.data(), id: d.id })).sort((a, b) => Number(b.id) - Number(a.id));
            setScores(data);
          }
        }, (err) => console.error(err));
        return () => unsub();
      }, [fbUser]);

      // === Data Mutators (Write to Firebase) ===
      const scrollToTop = () => {
        setTimeout(() => {
          const el = document.getElementById('main-scroll-area');
          if (el) el.scrollTo({ top: 0, behavior: 'smooth' });
        }, 50);
      };

      const scrollToBottom = () => {
        setTimeout(() => {
          const el = document.getElementById('main-scroll-area');
          if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
        }, 50);
      };

      const handleSaveMemo = async (memo) => {
        const memoId = memo.id ? memo.id.toString() : Date.now().toString();
        const payload = memo.id ? { ...memo } : { ...memo, id: memoId, author: "나", likes: 0, likedByMe: false, comments: [], views: 0, shares: 0, date: "방금 전", isPinned: false };
        if (!db || !fbUser) {
          setMemos(prev => memo.id ? prev.map(m => m.id === memoId ? { ...m, ...payload } : m) : [payload, ...prev]);
        } else {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'memos', memoId), payload);
        }
        setCurrentTab('memo');
        setView('list');
        scrollToTop();
      };

      const handleDeleteMemo = async (id) => {
        if (!db || !fbUser) {
          setMemos(prev => prev.filter(m => m.id !== id.toString()));
        } else {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'memos', id.toString()));
        }
        setView('list');
      };

      const handleSaveShotMemo = async (memo) => {
        if (!db || !fbUser) {
          setShotMemos(prev => {
            const exists = prev.some(m => m.id === memo.id);
            const next = exists ? prev.map(m => m.id === memo.id ? memo : m) : [memo, ...prev];
            return [...next].sort((a, b) => Number(b.id) - Number(a.id));
          });
        } else {
          await setDoc(doc(db, 'artifacts', appId, 'users', fbUser.uid, 'shotMemos', memo.id.toString()), memo);
        }
        scrollToBottom();
      };

      const handleDeleteShotMemos = async (ids) => {
        if (!db || !fbUser) {
          setShotMemos(prev => prev.filter(m => !ids.includes(m.id)));
          return;
        }
        for (const id of ids) {
          await deleteDoc(doc(db, 'artifacts', appId, 'users', fbUser.uid, 'shotMemos', id.toString()));
        }
      };

      const handleSaveScore = async (score) => {
        const scoreId = score.id ? score.id.toString() : Date.now().toString();
        const payload = { ...score, id: scoreId };
        if (!db || !fbUser) {
          setScores(prev => {
            const exists = prev.some(s => s.id === scoreId);
            const next = exists ? prev.map(s => s.id === scoreId ? payload : s) : [payload, ...prev];
            return [...next].sort((a, b) => Number(b.id) - Number(a.id));
          });
        } else {
          await setDoc(doc(db, 'artifacts', appId, 'users', fbUser.uid, 'scores', scoreId), payload);
        }
        setView('list');
        scrollToTop();
      };


      const filteredMyMemos = memos.filter(m => m.author === "나" && (activeCategory === "전체" || m.category === activeCategory));
      
      const feedMemos = memos
        .filter(m => m.isPublic && !blockedUsers.includes(m.author))
        .sort((a, b) => {
          const aFollow = followingUsers.includes(a.author);
          const bFollow = followingUsers.includes(b.author);
          if (aFollow && !bFollow) return -1;
          if (!aFollow && bFollow) return 1;
          return Number(b.id) - Number(a.id);
        });

      const handleMergeMemos = async (type) => {
        const targetMemos = memos.filter(m => selectedMemoIds.includes(m.id)).sort((a, b) => Number(a.id) - Number(b.id));
        if (targetMemos.length < 2) return;

        setIsMerging(true);
        let mergedContent = "";

        if (type === 'time') {
          mergedContent = targetMemos.map(m => `<div style="color:#10b981; font-size:12px; font-weight:bold; margin-bottom:4px;">[${m.date} - ${m.category}]</div>${m.content}`).join('<br/><br/><hr style="border-top: 1px dashed #e5e7eb; margin: 12px 0;"/><br/>');
        } else {
          const apiKey = "";
          const rawTexts = targetMemos.map(m => `[${m.category}] ${m.content.replace(/<[^>]*>?/gm, '')}`).join('\n\n---\n\n');
          const prompt = `다음은 사용자가 작성한 여러 개의 골프 메모입니다. 이 내용들을 분석하여 유사한 주제끼리 묶어서 가독성 좋고 자연스러운 하나의 완성 글로 합쳐주세요. 강조할 부분은 <b> 태그를, 줄바꿈은 <br/>을 사용하세요.\n\n[원본 메모들]\n${rawTexts}`;

          const payload = { contents: [{ parts: [{ text: prompt }] }] };

          const fetchWithBackoff = async (retries = 3, delay = 1000) => {
            try {
              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
              });
              if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
              return JSON.parse(await response.text());
            } catch (error) {
              if (retries > 0) {
                await new Promise(resolve => setTimeout(resolve, delay));
                return fetchWithBackoff(retries - 1, delay * 2);
              } else throw error;
            }
          };

          try {
            const result = await fetchWithBackoff();
            let text = result.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) mergedContent = text.replace(/```html/gi, '').replace(/```/g, '').trim();
          } catch (error) {
            alert("AI 정리 중 오류가 발생했습니다. 시간순으로 임시 병합됩니다.");
            mergedContent = targetMemos.map(m => `<b>[${m.date}]</b><br/>${m.content}`).join('<br/><br/>');
          }
        }

        const allUrls = [...new Set(targetMemos.flatMap(m => m.urls || []))];
        let checklistIdCounter = Date.now();
        const allChecklists = targetMemos.flatMap(m => m.checklist || []).map(item => ({ id: checklistIdCounter++, text: item.text, completed: item.completed }));
        const firstImage = targetMemos.find(m => m.imageUrl)?.imageUrl || null;

        const newDraft = { id: null, author: "나", category: "기타", content: mergedContent, urls: allUrls, checklist: allChecklists, imageUrl: firstImage, isPublic: false };

        setIsMerging(false); setShowMergeModal(false); setIsSelectionMode(false); setSelectedMemoIds([]);
        setCurrentMemo(newDraft); setView('edit');
      };

      const handleShotMemoMerge = (ids) => { 
        const merged = shotMemos.filter(m => ids.includes(m.id)).map(m => m.content).join('<br/>'); 
        setCurrentMemo({ id: null, author: "나", category: "기타", content: merged, urls: [], checklist: [], imageUrl: null, isPublic: false }); 
        setView('edit'); 
      };
      
      const handleBlockPost = (author) => { if (!blockedUsers.includes(author)) setBlockedUsers([...blockedUsers, author]); setBlockModalTarget(null); alert(`${author} 차단됨`); };
      const handleBlockHide = (author) => { if (!hiddenFromUsers.includes(author)) setHiddenFromUsers([...hiddenFromUsers, author]); setBlockModalTarget(null); alert(`${author}에게 숨김됨`); };
      const handleToggleFollow = (author) => {
        if (author === '나') return;
        setFollowingUsers(prev => prev.includes(author) ? prev.filter(u => u !== author) : [...prev, author]);
      };
      
      const persistMemo = async (id, updated) => {
        if (!db || !fbUser) { localUpdateMemo(id, () => updated); return; }
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'memos', id.toString()), updated);
      };

      const handleToggleLike = async (id) => {
        const memo = memos.find(m => m.id === id);
        if(!memo) return;
        await persistMemo(id, { ...memo, likedByMe: !memo.likedByMe, likes: memo.likedByMe ? memo.likes - 1 : memo.likes + 1 });
      };

      const handleAddComment = async (id, text) => {
        const memo = memos.find(m => m.id === id);
        if(!memo) return;
        await persistMemo(id, { ...memo, comments: [...(memo.comments || []), { id: Date.now(), author: "나", text }] });
      };

      const handleAddReply = async (memoId, commentId, text) => {
        const memo = memos.find(m => m.id === memoId);
        if(!memo) return;
        await persistMemo(memoId, { ...memo, comments: memo.comments.map(c => c.id === commentId ? { ...c, replies: [...(c.replies || []), { id: Date.now(), author: "나", text }] } : c) });
      };

      const handleTogglePin = async (id) => {
        const memo = memos.find(m => m.id === id);
        if(!memo) return;
        await persistMemo(id, { ...memo, isPinned: !memo.isPinned });
      };

      const handleTogglePublic = async (id) => {
        const memo = memos.find(m => m.id === id);
        if(!memo) return;
        await persistMemo(id, { ...memo, isPublic: !memo.isPublic });
      };

      const handleToggleChecklist = async (memoId, itemId) => {
        const memo = memos.find(m => m.id === memoId);
        if(!memo) return;
        await persistMemo(memoId, { ...memo, checklist: memo.checklist.map(c => c.id === itemId ? { ...c, completed: !c.completed } : c) });
      };

      const handleTabChange = (tab) => {
        setIsSelectionMode(false); setSelectedMemoIds([]);
        setCurrentTab(tab); setView('list');
        setCurrentMemo(null); setCurrentScore(null);
        if (tab === 'shot_memo') {
          scrollToBottom();
        } else {
          scrollToTop();
        }
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        setView('list');
        setCurrentTab(defaultTab);
      };

      return (
        <div className="fixed inset-0 bg-[#c8c3b7] flex justify-center sm:items-center sm:py-6 text-gray-900 w-full h-full">
          <GlobalStyle />
          
          {/* 전체 레이아웃 */}
          <div className="w-full h-full max-w-[440px] shadow-2xl flex flex-col bg-white overflow-hidden kraft-bg sm:max-h-[850px] sm:rounded-[40px] sm:border-[10px] sm:border-gray-800 relative">
            
            {showOnboarding ? (
              <Onboarding onDone={finishOnboarding} />
            ) : !isAuthenticated ? (
              <AuthScreen onLogin={() => setIsAuthenticated(true)} />
            ) : (
              <>
                <header className="pt-[max(env(safe-area-inset-top),0.6rem)] pb-2.5 px-4 z-10 flex-shrink-0 flex justify-between items-center gap-2">
                  <div className="flex items-center gap-2 min-w-0">
                    <h1 className="text-[20px] font-[900] stamped-text whitespace-nowrap shrink-0">진심골프메모</h1>
                    {view === 'list' && <div className="flex flex-col border-l-[2px] border-[#1a4314]/80 pl-2 shrink-0"><span className="text-[9px] font-[900] stamped-text leading-tight">GOLF MEMO</span><span className="text-[9px] font-[900] stamped-text leading-tight">& PRACTICE</span></div>}
                  </div>
                  {view === 'list' ? (
                    <div className="ml-auto flex items-center gap-2">
                      <button onClick={() => setView('search')} aria-label="통합 검색" className="p-2 bg-white/60 rounded-full border border-[#d1c9b8] hover:bg-white transition-colors shadow-sm">
                        <Icon name="Search" size={20} className="text-[#1a4314]" />
                      </button>
                      <div className="relative">
                        <button onClick={() => setIsMenuOpen(!isMenuOpen)} aria-label="메뉴" className="p-2 bg-white/60 rounded-full border border-[#d1c9b8] hover:bg-white transition-colors shadow-sm">
                          <Icon name="Menu" size={20} className="text-[#1a4314]" />
                        </button>
                        {isMenuOpen && (
                          <>
                            <div className="fixed inset-0 z-40" onClick={() => setIsMenuOpen(false)}></div>
                            <div className="absolute right-0 top-full mt-2 w-40 bg-white rounded-2xl shadow-xl border border-[#d1c9b8] overflow-hidden z-50 animate-in fade-in zoom-in-95 duration-200">
                              <button onClick={() => { setView('categories'); setIsMenuOpen(false); }} className="w-full flex items-center gap-2.5 px-4 py-3.5 hover:bg-gray-50 font-extrabold text-[14px] text-gray-800 border-b border-gray-100 transition-colors">
                                <Icon name="Layers" size={18} className="text-[#1a4314]"/> 카테고리 편집
                              </button>
                              <button onClick={() => { setView('mypage'); setIsMenuOpen(false); }} className="w-full flex items-center gap-2.5 px-4 py-3.5 hover:bg-gray-50 font-extrabold text-[14px] text-gray-800 transition-colors">
                                <Icon name="User" size={18} className="text-[#1a4314]"/> 마이페이지
                              </button>
                            </div>
                          </>
                        )}
                      </div>
                    </div>
                  ) : (
                    <div className="ml-auto flex items-center gap-2 min-w-0">
                      <button onClick={() => { if(view==='game_draw'){ if(drawBackRef.current) drawBackRef.current(); return; } if(view==='score_detail')setCurrentScore(null); setView('list');}} className="flex items-center text-[#1a4314] font-extrabold shrink-0"><Icon name="ChevronLeft" size={26} /> 뒤로</button>
                      <span className="text-[15px] font-black text-[#1a4314]/70 border-l border-[#1a4314]/25 pl-2 truncate">{({ search: '통합 검색', mypage: '마이페이지', categories: '카테고리 편집', detail: '메모', edit: currentMemo?.id ? '메모 편집' : '메모 작성', game_tee: '순서 뽑기', game_settle: '라운드 정산', game_draw: '뽑기 게임' })[view] || ''}</span>
                    </div>
                  )}
                </header>

                <main id="main-scroll-area" className="flex-1 overflow-y-auto scrollbar-hide relative">
                  {view === 'list' && currentTab === 'memo' && <MemoList memos={filteredMyMemos} categories={categories} activeCategory={activeCategory} setActiveCategory={setActiveCategory} isSelectionMode={isSelectionMode} setIsSelectionMode={setIsSelectionMode} selectedMemoIds={selectedMemoIds} setSelectedMemoIds={setSelectedMemoIds} onOpenDetail={m=>{setCurrentMemo(m); setView('detail');}} onManageCategories={()=>setView('categories')} baseFontSize={baseFontSize} noticeOpen={guideNotice} onCloseNotice={closeGuideNotice} />}
                  {view === 'search' && <GlobalSearch memos={memos} shotMemos={shotMemos} blockedUsers={blockedUsers} onOpenDetail={m=>{setCurrentMemo(m); setView('detail');}} onCancel={()=>setView('list')} baseFontSize={baseFontSize} />}
                  {view === 'list' && currentTab === 'shot_memo' && <ShotMemoMain shotMemos={shotMemos} onSaveShotMemo={handleSaveShotMemo} onDeleteShotMemos={handleDeleteShotMemos} onMerge={handleShotMemoMerge} baseFontSize={baseFontSize} isSelectionMode={isSelectionMode} setIsSelectionMode={setIsSelectionMode} selectedIds={selectedMemoIds} setSelectedIds={setSelectedMemoIds} noticeOpen={guideNotice} onCloseNotice={closeGuideNotice} />}
                  {view === 'list' && currentTab === 'metronome' && <Metronome />}
                  {view === 'mypage' && <MyPage onCancel={()=>setView('list')} blockedUsers={blockedUsers} setBlockedUsers={setBlockedUsers} hiddenFromUsers={hiddenFromUsers} setHiddenFromUsers={setHiddenFromUsers} defaultTab={defaultTab} setDefaultTab={setDefaultTab} baseFontSize={baseFontSize} setBaseFontSize={setBaseFontSize} followingUsers={followingUsers} onToggleFollow={handleToggleFollow} onLogout={handleLogout} />}
                  {view === 'detail' && <MemoDetail memo={memos.find(m => m.id === currentMemo?.id) || currentMemo} onDelete={handleDeleteMemo} onEdit={() => setView('edit')} onToggleLike={handleToggleLike} onAddComment={handleAddComment} onAddReply={handleAddReply} onTogglePublic={handleTogglePublic} onTogglePin={handleTogglePin} onToggleChecklist={handleToggleChecklist} onOpenBlockModal={setBlockModalTarget} baseFontSize={baseFontSize} followingUsers={followingUsers} onToggleFollow={handleToggleFollow} />}
                  {view === 'edit' && <MemoEditor memo={currentMemo} categories={categories} onSave={handleSaveMemo} onCancel={()=>setView(currentMemo?.id ? 'detail' : 'list')} baseFontSize={baseFontSize} />}
                  {view === 'categories' && <CategoryManager categories={categories} setCategories={setCategories} />}
                  {view === 'list' && currentTab === 'game' && <GameMain onSelectGame={id=>setView(`game_${id}`)} />}
                  {view === 'game_draw' && <DrawGame onExit={() => setView('list')} backRef={drawBackRef} />}
                  {view === 'game_tee' && <TeeSpinGame />}
                  {view === 'game_settle' && <SettleCalc />}
                </main>

                {/* 숏메모 카톡형 하단 입력창 (네비게이션 바로 위) */}
                {!isSelectionMode && view === 'list' && currentTab === 'shot_memo' && (
                  <ShotMemoInputBar onSaveShotMemo={handleSaveShotMemo} />
                )}

                {/* 플로팅 글쓰기 버튼: 스크롤 영역 밖으로 빼내어 absolute로 고정. 메뉴 열려 있으면 가림 */}
                {!isSelectionMode && !isMenuOpen && view === 'list' && currentTab === 'memo' && (
                  <button 
                    onClick={() => { setCurrentMemo(null); setView('edit'); }} 
                    className="absolute right-5 w-[56px] h-[56px] bg-[#1a4314] rounded-full flex items-center justify-center text-white shadow-xl z-[40] active:scale-95 transition-transform"
                    style={{ bottom: 'calc(80px + env(safe-area-inset-bottom))' }}
                  >
                    <Icon name="Plus" size={32} />
                  </button>
                )}

                {/* 목록 합치기 하단바: 스크롤 영역과 독립적으로 하단 메뉴 바로 위에 absolute 배치 (붕 뜸 현상 원천 차단) */}
                {isSelectionMode && view === 'list' && (currentTab === 'memo' || currentTab === 'shot_memo') && (
                  <div className="absolute left-0 right-0 bg-white/95 backdrop-blur-md border-t border-[#d1c9b8] p-4 pb-5 flex justify-between items-center z-[50] shadow-[0_-10px_20px_rgba(0,0,0,0.1)] rounded-t-[20px]"
                       style={{ bottom: 'calc(55px + env(safe-area-inset-bottom))' }}>
                    <span className="font-extrabold text-[#1a4314] text-[15px] pl-2">{selectedMemoIds.length}개 선택됨</span>
                    <div className="flex gap-2">
                      <button onClick={()=> {setIsSelectionMode(false); setSelectedMemoIds([]);}} className="px-4 py-2.5 bg-[#E2D9C8] text-[#1a4314] rounded-xl font-bold text-[13px] hover:bg-[#d5ccba] transition-colors border border-[#d1c9b8]">취소</button>
                      {selectedMemoIds.length > 0 && (
                        <button 
                            onClick={() => {
                                if (confirmDelMerge) {
                                    if (currentTab === 'memo') selectedMemoIds.forEach(id => handleDeleteMemo(id));
                                    else handleDeleteShotMemos(selectedMemoIds);
                                    setIsSelectionMode(false);
                                    setSelectedMemoIds([]);
                                    setConfirmDelMerge(false);
                                } else {
                                    setConfirmDelMerge(true);
                                    setTimeout(() => setConfirmDelMerge(false), 3000);
                                }
                            }} 
                            className="px-4 py-2.5 bg-red-50 text-red-600 rounded-xl font-bold text-[13px] shadow-sm hover:bg-red-100"
                        >
                            {confirmDelMerge ? "정말 삭제?" : "삭제"}
                        </button>
                      )}
                      <button onClick={() => {
                          if (currentTab === 'memo') setShowMergeModal(true);
                          else handleShotMemoMerge(selectedMemoIds);
                      }} disabled={selectedMemoIds.length < 2} className="px-4 py-2.5 bg-[#1a4314] text-white rounded-xl font-bold text-[13px] disabled:opacity-50 disabled:bg-gray-400 shadow-md hover:bg-[#2d6a4f] transition-colors">합치기</button>
                    </div>
                  </div>
                )}

                {view === 'list' && (
                  <nav className="shrink-0 bg-[#E8E2D2]/95 border-t border-[#d1c9b8]/60 flex justify-between z-10 text-[9px] font-bold text-[#6b7280] pb-[env(safe-area-inset-bottom)] sm:rounded-b-[30px]">
                    <div onClick={() => handleTabChange('memo')} className={`p-2 flex-1 flex flex-col items-center cursor-pointer ${currentTab==='memo'?'text-[#1a4314]':''}`}><Icon name="PenTool" size={20}/><span>메모</span></div>
                    <div onClick={() => handleTabChange('shot_memo')} className={`p-2 flex-1 flex flex-col items-center cursor-pointer ${currentTab==='shot_memo'?'text-[#1a4314]':''}`}><Icon name="MessageSquare" size={20}/><span>Shot메모</span></div>
                    <div onClick={() => handleTabChange('game')} className={`p-2 flex-1 flex flex-col items-center cursor-pointer ${currentTab==='game'?'text-[#1a4314]':''}`}><Icon name="Dices" size={20}/><span>게임</span></div>
                    <div onClick={() => handleTabChange('metronome')} className={`p-2 flex-1 flex flex-col items-center cursor-pointer ${currentTab==='metronome'?'text-[#1a4314]':''}`}><Icon name="Timer" size={20}/><span>메트로놈</span></div>
                  </nav>
                )}

                {showMergeModal && (
                  <div className="absolute inset-0 bg-black/60 z-[60] flex items-center justify-center p-5 animate-in fade-in duration-200">
                    <div className="bg-[#fcfbf9] rounded-3xl p-6 w-full max-w-sm flex flex-col gap-4 shadow-2xl animate-in zoom-in-95 duration-200 relative overflow-hidden border border-[#d1c9b8]">
                      {isMerging && (
                        <div className="absolute inset-0 bg-white/90 backdrop-blur-sm z-10 flex flex-col items-center justify-center">
                          <Icon name="Loader2" size={40} className="text-[#1a4314] animate-spin mb-3" />
                          <p className="font-bold text-[#1a4314] text-sm">AI가 메모를 합치고 있습니다...</p>
                        </div>
                      )}
                      <h3 className="text-lg font-extrabold text-gray-900 mb-1">어떤 방식으로 합칠까요?</h3>
                      <button onClick={() => handleMergeMemos('time')} className="flex flex-col items-start p-4 border border-gray-200 rounded-xl hover:border-[#1a4314] hover:bg-[#e8f5e9] transition-all text-left bg-white">
                        <span className="font-bold text-gray-800 flex items-center gap-1.5"><Icon name="Calendar" size={16} className="text-[#1a4314]"/> 시간순서로 합치기</span>
                        <span className="text-[12px] text-gray-500 mt-1.5 leading-snug">선택한 메모들을 작성된 순서대로 단순하게 이어 붙입니다.</span>
                      </button>
                      <button onClick={() => handleMergeMemos('ai')} className="flex flex-col items-start p-4 border border-gray-200 rounded-xl hover:border-purple-500 hover:bg-purple-50 transition-all text-left bg-white">
                        <span className="font-bold text-gray-800 flex items-center gap-1.5"><Icon name="Sparkles" size={16} className="text-purple-500"/> AI 유사 내용 묶기</span>
                        <span className="text-[12px] text-gray-500 mt-1.5 leading-snug">AI가 분석하여 비슷한 주제끼리 매끄럽게 재작성합니다.</span>
                      </button>
                      <button onClick={() => setShowMergeModal(false)} className="mt-2 py-3 bg-[#E2D9C8] text-[#1a4314] font-bold rounded-xl hover:bg-[#d5ccba] transition-colors">취소</button>
                    </div>
                  </div>
                )}

                {blockModalTarget && (
                  <div className="absolute inset-0 bg-black/60 z-[70] flex items-end justify-center animate-in fade-in" onClick={() => setBlockModalTarget(null)}>
                    <div className="bg-[#fdfcf9] w-full max-w-[440px] rounded-t-[32px] p-6 pb-[calc(3rem+env(safe-area-inset-bottom))] flex flex-col gap-2 shadow-2xl animate-in slide-in-from-bottom-full border border-[#d1c9b8]" onClick={e => e.stopPropagation()}>
                      <div className="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-4"></div><h3 className="text-[18px] font-black mb-4 px-2">{blockModalTarget}님 차단 설정</h3>
                      <button onClick={() => handleBlockPost(blockModalTarget)} className="w-full text-left px-5 py-4 bg-white border rounded-2xl font-bold text-red-600 hover:bg-red-50">이 유저의 게시물 숨기기</button>
                      <button onClick={() => handleBlockHide(blockModalTarget)} className="w-full text-left px-5 py-4 bg-white border rounded-2xl font-bold text-orange-600 hover:bg-orange-50 mt-2">내 메모를 보지 못하게 차단</button>
                      <button onClick={() => setBlockModalTarget(null)} className="w-full py-4 mt-4 bg-[#E2D9C8] font-extrabold rounded-2xl hover:bg-[#d5ccba]">취소</button>
                    </div>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    }
    
    // React 앱 렌더링 즉시 실행
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
