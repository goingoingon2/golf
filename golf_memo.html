                  <div className="mt-2"><p className="text-[12px] font-bold text-gray-500 mb-2">내 메모 숨김 목록</p><div className="flex flex-col gap-2">{hiddenFromUsers.map(u => (<div key={`hide-${u}`} className="flex justify-between items-center bg-white px-3 py-2 rounded-xl border"><span className="text-[14px] font-bold">{u}</span><button onClick={() => setHiddenFromUsers(hiddenFromUsers.filter(b => b !== u))} className="text-[11px] text-gray-500 font-bold border px-3 py-1.5 rounded-lg">해제</button></div>))}</div></div>

    // 예시 데이터 안내 배너 (메모/숏메모 리스트 상단)

      return (
        <div className="relative bg-[#fff7e6] border border-[#f0d9a8] rounded-2xl p-3.5 pr-9 shadow-sm">
          <p className="text-[12.5px] text-[#8a6d3b] font-medium leading-relaxed">사용자의 이해를 돕기 위해 예시로 넣어둔 내용은 <b>삭제하셔도</b> 됩니다. 이제 나만의 내용으로 채워나가세요! 💪</p>
          <button onClick={onClose} aria-label="안내 닫기" className="absolute top-2 right-2 w-6 h-6 rounded-full flex items-center justify-center text-[#b08948] hover:bg-[#f0d9a8]/50 active:scale-90 transition-transform"><Icon name="X" size={14}/></button>
        </div>
      );

    function MemoList({ memos, categories, activeCategory, setActiveCategory, isSelectionMode, setIsSelectionMode, selectedMemoIds, setSelectedMemoIds, onOpenDetail, onManageCategories, baseFontSize, noticeOpen, onCloseNotice }) {
      const timerRef = useRef(null);
      const isLongPressTriggered = useRef(false);

      const handlePointerDown = (memo) => {
        isLongPressTriggered.current = false;
        if (isSelectionMode) return; // 선택 모드에선 길게누름 타이머 불필요 (탭으로 토글)
        timerRef.current = setTimeout(() => {
          isLongPressTriggered.current = true;
          if ('vibrate' in navigator) navigator.vibrate(50);
          setIsSelectionMode(true);
          setSelectedMemoIds([memo.id]);
        }, 500);
      };

      const handlePointerMove = () => {
        if (timerRef.current) clearTimeout(timerRef.current);
      };

      const handlePointerUp = (memo) => {
        if (timerRef.current) clearTimeout(timerRef.current);
        if (!isLongPressTriggered.current) {
          if (isSelectionMode) {
            setSelectedMemoIds(prev => prev.includes(memo.id) ? prev.filter(id=>id!==memo.id) : [...prev, memo.id]);
          } else {
            onOpenDetail(memo);
          }
        }
      };

      return (
        <div className="flex flex-col gap-4">
          <div className="sticky top-0 z-30 bg-[#E2D9C8]/95 backdrop-blur-md pt-3 pb-3 px-3 -mx-2 mb-2 shadow-sm border-b border-[#d1c9b8]/50 flex flex-col gap-2">
             <div className="flex justify-between items-center px-1">
               <p className="text-[11px] text-gray-700 font-extrabold flex items-center gap-1"><Icon name="Edit3" size={12} className="mr-1"/> 길게 눌러 편집 · 카테고리를 눌러 분류</p>
               {!isSelectionMode && memos.length > 0 && (
                 <button onClick={() => setIsSelectionMode(true)} className="text-[11px] font-extrabold px-3 py-1.5 rounded-lg bg-white border border-[#d1c9b8] text-gray-800 shadow-sm active:scale-95 transition-transform">
                   선택
                 </button>
               )}
             </div>
             {activeCategory !== '전체' && (
               <div className="flex justify-between items-center px-1">
                 <span className="text-[12px] font-extrabold text-[#1a4314] flex items-center gap-1.5"><Icon name="LayoutList" size={13}/> 「{activeCategory}」 카테고리만 보는 중</span>
                 <button onClick={() => setActiveCategory('전체')} className="text-[11px] font-bold px-3 py-1 rounded-full bg-white border border-[#d1c9b8] text-gray-600 flex items-center gap-1 active:scale-95 transition-transform"><Icon name="X" size={11}/> 전체 보기</button>
               </div>
             )}
          </div>

          <div className="flex flex-col gap-4 pb-24 px-1">
            {noticeOpen && <GuideNotice onClose={onCloseNotice} />}
            {memos.length === 0 ? (
              <div className="text-center text-gray-500 mt-10 py-12 bg-white/90 rounded-[24px] border border-dashed border-[#d1c9b8]"><div className="bg-[#E2D9C8] w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3"><Icon name="PenTool" size={24} className="text-[#1a4314]" /></div><p className="font-bold text-[#1a4314]">기록된 메모가 없습니다.</p></div>
            ) : (
              memos.map(memo => (
                <div 
                  key={memo.id} 
                  onPointerDown={() => handlePointerDown(memo)}
                  onPointerMove={handlePointerMove}
                  onPointerUp={() => handlePointerUp(memo)}
                  onPointerCancel={handlePointerMove}
                  onContextMenu={e => e.preventDefault()}
                  style={{ WebkitTouchCallout: 'none', userSelect: 'none' }}
                  className={`bg-[#fdfcf9] rounded-[24px] p-5 shadow-sm border ${isSelectionMode && selectedMemoIds.includes(memo.id) ? 'border-[#1a4314] ring-2 ring-[#1a4314]' : 'border-[#d1c9b8]'} cursor-pointer`}
                >
                  <div className="flex justify-between items-center mb-1">
                    <div className="flex gap-2 items-center">
                       {isSelectionMode && <div className={`w-5 h-5 rounded-md border-2 flex items-center justify-center shrink-0 ${selectedMemoIds.includes(memo.id)?'bg-[#1a4314] border-[#1a4314]':'border-gray-300'}`}>{selectedMemoIds.includes(memo.id) && <Icon name="Check" size={12} className="text-white font-black"/>}</div>}
                       <button
                         onPointerDown={e => { if (!isSelectionMode) e.stopPropagation(); }}
                         onPointerUp={e => { if (isSelectionMode) return; e.stopPropagation(); if (timerRef.current) clearTimeout(timerRef.current); setActiveCategory(activeCategory === memo.category ? '전체' : memo.category); }}
                         className={`text-[12px] font-bold px-3 py-1 rounded-full border active:scale-95 transition-transform ${activeCategory === memo.category ? 'bg-[#1a4314] text-white border-[#1a4314]' : 'text-[#1a4314] bg-[#e8f5e9] border-[#a5d6a7]'}`}
                       >{memo.category}</button>
                       {memo.isPinned && <Icon name="Pin" size={14} className="text-amber-600" />}
                    </div>
                    <span className="text-[12px] font-bold text-gray-400">{memo.date}</span>
                  </div>
                  <div className="flex gap-4 items-start mt-2">
                    <div className="flex-1 min-w-0">
                      <p className="text-gray-800 font-medium leading-[1.6] line-clamp-3" style={{ fontSize: `${baseFontSize}px` }} dangerouslySetInnerHTML={{ __html: memo.content.replace(/<[^>]*>?/gm, '').replace(/&nbsp;/g, ' ') }}></p>
                    </div>
                    {(memo.imageUrl || (memo.urls && memo.urls.length > 0)) && (
                      <div className="flex flex-col gap-2 shrink-0">
                        {memo.imageUrl && <img src={memo.imageUrl} className="w-[80px] h-[80px] object-cover rounded-2xl border" />}
                        {memo.urls && memo.urls.map((url, idx) => {
                          const ytId = getYoutubeId(url);
                          const igId = getInstagramId(url);
                          if (igId) {
                            return (
                              <div key={idx} className="relative w-[80px] h-[60px] rounded-[12px] overflow-hidden border border-gray-200 shadow-sm flex flex-col items-center justify-center bg-white">
                                <Icon name="Instagram" size={18} className="text-pink-600 mb-0.5" />
                                <span className="text-[9px] font-extrabold text-gray-700">Instagram</span>
                              </div>
                            );
                          }
                          if (!ytId) return null;
                          return (
                            <div key={idx} className="relative w-[80px] h-[60px] rounded-[12px] overflow-hidden border border-gray-200 shadow-sm bg-black">
                              <img src={`https://img.youtube.com/vi/${ytId}/mqdefault.jpg`} alt="yt-thumb" className="w-full h-full object-cover opacity-80" />
                              <div className="absolute inset-0 flex items-center justify-center">
                                <Icon name="PlayCircle" size={18} className="text-white drop-shadow-md" />
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    function GlobalSearch({ memos, shotMemos, blockedUsers, onOpenDetail, onCancel, baseFontSize }) {
      const [query, setQuery] = useState("");

      const myMemos = memos.filter(m => m.author === "나" && query && m.content.toLowerCase().includes(query.toLowerCase()));
      const feedMemos = memos.filter(m => m.isPublic && !blockedUsers.includes(m.author) && query && m.content.toLowerCase().includes(query.toLowerCase()));
      const filteredShotMemos = shotMemos.filter(m => query && m.content.toLowerCase().includes(query.toLowerCase()));

      const renderMemo = (memo) => (
        <div key={`s-${memo.id}`} onClick={() => onOpenDetail(memo)} className="bg-white rounded-[20px] p-4 shadow-sm border border-[#d1c9b8] cursor-pointer mb-3 hover:border-[#1a4314] transition-colors">
          <div className="flex justify-between items-center mb-2">
            <span className="text-[11px] font-bold text-[#1a4314] bg-[#e8f5e9] px-2 py-0.5 rounded-md">{memo.category}</span>
            <span className="text-[11px] text-gray-400 font-bold">{memo.date}</span>
          </div>
          <div className="flex gap-3 items-start">
            <div className="flex-1 min-w-0">
              <p className="text-gray-800 font-medium leading-[1.6] line-clamp-2" style={{ fontSize: `${baseFontSize}px` }} dangerouslySetInnerHTML={{ __html: memo.content.replace(/<[^>]*>?/gm, '').replace(/&nbsp;/g, ' ') }}></p>
            </div>
            {memo.imageUrl && <img src={memo.imageUrl} className="w-[60px] h-[60px] object-cover rounded-xl border shrink-0" />}
          </div>
        </div>
      );

      const renderShotMemo = (memo) => (
        <div key={`s-shot-${memo.id}`} className="bg-white rounded-[20px] p-4 shadow-sm border border-[#d1c9b8] mb-3">
           <div className="flex justify-between items-center mb-1">
             <span className="text-[11px] font-bold text-gray-500">Shot메모</span>
             <span className="text-[11px] text-gray-400 font-bold">{memo.date}</span>
           </div>
           <p className="text-gray-800 font-medium" style={{ fontSize: `${baseFontSize}px` }}>{memo.content}</p>
        </div>
      );

      return (
        <div className="p-4 flex flex-col h-full bg-[#fdfcf9]">
          <div className="flex items-center gap-3 mb-4 pt-2">
            <button onClick={onCancel} className="text-[#1a4314] p-1"><Icon name="ChevronLeft" size={28}/></button>
            <div className="relative flex-1">
              <Icon name="Search" size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-[#1a4314]" />
              <input autoFocus type="text" placeholder="메모, 커뮤니티, 숏메모 통합 검색" className="w-full pl-11 pr-10 py-3 bg-white border border-[#d1c9b8] rounded-full text-[16px] font-bold outline-none focus:ring-2 focus:ring-[#1a4314]/20 focus:border-[#1a4314] transition-all shadow-sm" value={query} onChange={(e) => setQuery(e.target.value)} />
              {query && <button onClick={() => setQuery('')} className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"><Icon name="X" size={16}/></button>}
            </div>
          </div>
          
          <div className="flex-1 overflow-y-auto pb-24 scrollbar-hide px-1">
            {!query ? (
              <div className="text-center text-gray-400 mt-24 flex flex-col items-center">
                <Icon name="Search" size={48} className="mb-4 opacity-20" />
                <p className="font-bold text-gray-400">찾고 싶은 내용을 검색해보세요.</p>
              </div>
            ) : (
              <div className="flex flex-col gap-6">
                {myMemos.length === 0 && feedMemos.length === 0 && filteredShotMemos.length === 0 ? (
                  <div className="text-center text-gray-500 mt-10 font-bold">검색 결과가 없습니다.</div>
                ) : (
                  <>
                    {myMemos.length > 0 && (
                      <div>
                        <h3 className="font-black text-[14px] mb-3 text-[#1a4314] flex items-center gap-1.5"><Icon name="PenTool" size={16}/> 내 메모 ({myMemos.length})</h3>
                        {myMemos.map(renderMemo)}
                      </div>
                    )}
                    {feedMemos.length > 0 && (
                      <div>
                        <h3 className="font-black text-[14px] mb-3 text-blue-600 flex items-center gap-1.5"><Icon name="Users" size={16}/> 커뮤니티 ({feedMemos.length})</h3>
                        {feedMemos.map(renderMemo)}
                      </div>
                    )}
                    {filteredShotMemos.length > 0 && (
                      <div>
                        <h3 className="font-black text-[14px] mb-3 text-orange-600 flex items-center gap-1.5"><Icon name="MessageSquare" size={16}/> 숏메모 ({filteredShotMemos.length})</h3>
                        {filteredShotMemos.map(renderShotMemo)}
                      </div>
                    )}
                  </>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    function ShotMemoInputBar({ onSaveShotMemo }) {
      const [text, setText] = useState('');
      const textareaRef = useRef(null);

      const handleInput = (e) => {
        setText(e.target.value);
        if (textareaRef.current) {
          textareaRef.current.style.height = 'auto';
          textareaRef.current.style.height = (textareaRef.current.scrollHeight) + 'px';
        }
      };

      const handleSave = () => {
        if(!text.trim())return; 
        const d = new Date();
        const dateStr = `${d.getMonth()+1}월 ${d.getDate()}일 ${d.getHours() < 12 ? '오전' : '오후'} ${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}`;
        onSaveShotMemo({ id: Date.now().toString(), content: text, date: dateStr });
        setText('');
        if(textareaRef.current) textareaRef.current.style.height = 'auto';
      };

      return (
        <div className="shrink-0 w-full bg-[#E8E2D2]/80 backdrop-blur-md border-t border-[#d1c9b8] p-3 px-4 flex gap-2 items-end z-[40]">
          <textarea 
            ref={textareaRef}
            value={text} 
            onChange={handleInput} 
            onKeyDown={e => {
              if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSave();
              }
            }}
            placeholder="순간의 깨달음을 기록하세요..." 
            className="flex-1 bg-white border border-[#d1c9b8] rounded-2xl px-4 py-3 outline-none resize-none font-medium shadow-sm min-h-[48px] max-h-[120px] overflow-y-auto scrollbar-hide text-[15px]" 
            rows="1"
          />
          <button onClick={handleSave} disabled={!text.trim()} className="w-[48px] h-[48px] rounded-2xl bg-[#1a4314] text-white flex items-center justify-center shrink-0 disabled:opacity-50 shadow-sm transition-colors mb-[1px]">
            <Icon name="Send" size={20} className="ml-1" />
          </button>
        </div>
      );
    }

    function ShotMemoMain({ shotMemos, onSaveShotMemo, onDeleteShotMemos, isSelectionMode, setIsSelectionMode, selectedIds, setSelectedIds, baseFontSize, noticeOpen, onCloseNotice }) {
      const [editingId, setEditingId] = useState(null);
      const [editingText, setEditingText] = useState('');
      const [confirmDelId, setConfirmDelId] = useState(null);
      const [copiedId, setCopiedId] = useState(null);
      
      const timerRef = useRef(null);
      const isLongPressTriggered = useRef(false);

      const handlePointerDown = (memo) => {
        if (editingId === memo.id || isSelectionMode) return;
        isLongPressTriggered.current = false;
        timerRef.current = setTimeout(() => {
          isLongPressTriggered.current = true;
          if ('vibrate' in navigator) navigator.vibrate(50);
          setEditingId(memo.id);
          setEditingText(memo.content);
          setConfirmDelId(null);
        }, 500);
      };

      const handlePointerMove = () => {
        if (timerRef.current) clearTimeout(timerRef.current);
      };

      const handlePointerUp = (memo) => {
        if (timerRef.current) clearTimeout(timerRef.current);
        if (!isLongPressTriggered.current && !editingId) {
          if (isSelectionMode) {
            setSelectedIds(prev => prev.includes(memo.id) ? prev.filter(s=>s!==memo.id) : [...prev, memo.id]);
          }
        }
      };

      const saveEdit = (id) => {
        if (!editingText.trim()) return;
        const memoToUpdate = shotMemos.find(m => m.id === id);
        if (memoToUpdate) onSaveShotMemo({ ...memoToUpdate, content: editingText });
        setEditingId(null);
      };

      const handleCopy = (memo, e) => {
        e.stopPropagation();
        const textArea = document.createElement("textarea");
        textArea.value = memo.content;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        setCopiedId(memo.id);
        setTimeout(() => setCopiedId(null), 2000);
      };

      return (
        <div className="flex flex-col gap-4 h-full relative">
          <div className="sticky top-0 z-30 bg-[#E2D9C8]/95 backdrop-blur-md pt-3 pb-3 px-4 shadow-sm border-b border-[#d1c9b8]/50 flex justify-between items-center -mx-2">
            <p className="text-[12px] text-gray-700 font-extrabold flex items-center gap-1.5"><Icon name="Edit3" size={14}/> 메모를 길게 누르면 수정할 수 있어요!</p>
            {!isSelectionMode && shotMemos.length > 0 && (
              <button onClick={() => setIsSelectionMode(true)} className="text-[11px] font-extrabold px-3 py-1.5 rounded-lg bg-white border border-[#d1c9b8] text-gray-800 shadow-sm active:scale-95 transition-transform">
                선택
              </button>
            )}
          </div>

          <div className="flex flex-col gap-3 pb-6 px-3">
            {shotMemos.length === 0 ? (
              <div className="text-center text-gray-500 mt-6 py-12 bg-white/90 rounded-[24px] border border-dashed border-[#d1c9b8]"><p className="font-bold text-[#1a4314]">기록된 숏메모가 없습니다.</p></div>
            ) : (
              [...shotMemos].reverse().map(memo => (
                <div 
                  key={memo.id} 
                  {...(editingId !== memo.id ? { 
                    onPointerDown: () => handlePointerDown(memo),
                    onPointerMove: handlePointerMove,
                    onPointerUp: () => handlePointerUp(memo),
                    onPointerCancel: handlePointerMove,
                    onContextMenu: e => e.preventDefault()
                  } : {})}
                  style={{ WebkitTouchCallout: editingId === memo.id ? 'default' : 'none', userSelect: editingId === memo.id ? 'auto' : 'none' }}
                  className={`bg-[#fdfcf9] rounded-2xl p-4 shadow-sm border ${isSelectionMode && selectedIds.includes(memo.id) ? 'border-[#1a4314] ring-2 ring-[#1a4314]' : 'border-[#d1c9b8]'} ${editingId !== memo.id ? 'cursor-pointer' : ''} flex justify-between items-start`}
                >
                  {editingId === memo.id ? (
                    <div className="w-full flex flex-col gap-2 relative z-50">
                      <textarea
                        value={editingText}
                        onChange={e => setEditingText(e.target.value)}
                        onFocus={(e) => e.target.setSelectionRange(e.target.value.length, e.target.value.length)}
                        className="w-full bg-white border border-[#1a4314] rounded-xl p-2 outline-none resize-none font-medium min-h-[60px]"
                        style={{ fontSize: `${baseFontSize}px` }}
                        autoFocus
                      />
                      <div className="flex justify-between items-center mt-1">
                        {/* 삭제 버튼 인라인 확인창 기능 적용 (이벤트 씹힘 완벽 해결) */}
                        <div className="flex gap-1">
                          <button 
                              onPointerDown={(e) => {
                                  e.stopPropagation(); 
                                  if (confirmDelId === memo.id) {
                                      onDeleteShotMemos([memo.id]); 
                                      setEditingId(null);
                                      setConfirmDelId(null);
                                  } else {
                                      setConfirmDelId(memo.id);
                                      setTimeout(() => setConfirmDelId(null), 3000);
                                  }
                              }} 
                              className="text-red-500 text-[13px] font-bold p-2 flex items-center gap-1.5 hover:bg-red-50 rounded-lg active:scale-95 transition-transform"
                          >
                              <Icon name="Trash2" size={14}/>
                              {confirmDelId === memo.id ? "정말 삭제?" : "삭제"}
                          </button>
                          <button 
                              onPointerDown={(e) => handleCopy(memo, e)} 
                              className="text-blue-600 text-[13px] font-bold p-2 flex items-center gap-1.5 hover:bg-blue-50 rounded-lg active:scale-95 transition-transform"
                          >
                              <Icon name="Copy" size={14}/>
                              {copiedId === memo.id ? "복사완료!" : "복사"}
                          </button>
                        </div>
                        <div className="flex gap-2">
                          <button onPointerDown={(e)=>{e.stopPropagation(); setEditingId(null);}} className="px-4 py-2 bg-[#E2D9C8] text-[#1a4314] rounded-lg text-[13px] font-bold hover:bg-[#d5ccba] active:scale-95 transition-transform">취소</button>
                          <button onPointerDown={(e)=>{e.stopPropagation(); saveEdit(memo.id);}} className="px-4 py-2 bg-[#1a4314] text-white rounded-lg text-[13px] font-bold hover:bg-[#2d6a4f] active:scale-95 transition-transform">저장</button>
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="flex gap-3 items-start flex-1">
                      {isSelectionMode && <div className={`mt-0.5 w-5 h-5 rounded-md border-2 flex items-center justify-center shrink-0 ${selectedIds.includes(memo.id)?'bg-[#1a4314] border-[#1a4314]':'border-gray-300'}`}>{selectedIds.includes(memo.id) && <Icon name="Check" size={12} className="text-white font-black"/>}</div>}
                      <div className="flex flex-col gap-1 flex-1">
                        <p className="text-gray-800 font-medium whitespace-pre-wrap leading-snug" style={{ fontSize: `${baseFontSize}px` }}>{memo.content}</p>
                        <span className="text-[11px] font-bold text-gray-400">{memo.date}</span>
                      </div>
                    </div>
                  )}
                </div>
              ))
            )}
            {noticeOpen && <GuideNotice onClose={onCloseNotice} />}
          </div>
        </div>
      );
    }

    function FeedList({ memos, onOpenDetail, onToggleLike, onOpenBlockModal, baseFontSize, followingUsers }) {
      const [openMenuId, setOpenMenuId] = useState(null);
      return (
        <div className="flex flex-col pb-4 gap-4 p-4" onClick={() => setOpenMenuId(null)}>
          {memos.length === 0 ? (
            <div className="p-8 text-center text-gray-500">

    function ScoreMain({ scores, onAddScore, onOpenScoreDetail }) {
      const [period, setPeriod] = useState('전체');
      const filtered = scores.filter(s => period === '전체' || s.date.startsWith(period.replace('년', '')));
      const PAR = 72;
      const roundPutts = (s) => {
        if (typeof s.putts === 'number') return s.putts;
        const arr = s.players && s.players[0] && s.players[0].putts;
        return Array.isArray(arr) && arr.length ? arr.reduce((a,b)=>a+(b||0),0) : null;
      };
      const validScores = filtered.map(s=>s.score).filter(n=>typeof n==='number');
      const avg = validScores.length ? Math.round(validScores.reduce((a,b)=>a+b,0)/validScores.length) : 0;
      const best = validScores.length ? Math.min(...validScores) : null;
      const worst = validScores.length ? Math.max(...validScores) : null;
      const handicap = avg ? avg - PAR : null;
      const puttVals = filtered.map(roundPutts).filter(n=>typeof n==='number');
      const avgPutts = puttVals.length ? Math.round(puttVals.reduce((a,b)=>a+b,0)/puttVals.length*10)/10 : null;
      // 추세: 날짜 오름차순 정렬해 마지막(최신) vs 직전 비교
      const byDate = [...filtered].filter(s=>typeof s.score==='number').sort((a,b)=>a.date.localeCompare(b.date));
      const trend = byDate.length>=2 ? byDate[byDate.length-1].score - byDate[byDate.length-2].score : null;
      const fmtPar = (sc) => sc===PAR?'E':(sc>PAR?`+${sc-PAR}`:`${sc-PAR}`);
      return (
        <div className="p-5 flex flex-col gap-5">
          <div className="flex justify-between items-end"><h3 className="font-black text-[18px]">요약 리포트</h3><select value={period} onChange={e=>setPeriod(e.target.value)} className="bg-white border rounded-xl px-3 py-1.5 font-bold text-[13px]"><option>전체</option><option>2026년</option><option>2025년</option><option>2024년</option></select></div>
          <div className="bg-[#1a4314] text-white p-7 rounded-[28px] shadow-lg flex justify-between items-center relative overflow-hidden"><Icon name="Trophy" size={110} className="absolute -right-4 -top-4 opacity-10" /><div className="z-10"><p className="text-[#a5d6a7] text-[13px] font-bold">평균 타수</p><p className="text-[44px] font-black">{avg || '-'}</p>{handicap!==null && <p className="text-[#a5d6a7] text-[12px] font-bold mt-0.5">예상 핸디 {handicap>=0?`+${handicap}`:handicap}</p>}</div><div className="text-right z-10"><p className="text-[#a5d6a7] text-[13px] font-bold">총 라운드</p><p className="text-[32px] font-black">{filtered.length}</p></div></div>
          {validScores.length>0 && (
            <div className="grid grid-cols-3 gap-3">
              <div className="bg-white rounded-[20px] border border-[#d1c9b8] p-4 flex flex-col items-center shadow-sm"><span className="text-[11px] font-bold text-gray-400 mb-1">베스트</span><span className="text-[24px] font-black text-blue-600">{best}</span><span className="text-[11px] font-bold text-gray-400">{fmtPar(best)}</span></div>
              <div className="bg-white rounded-[20px] border border-[#d1c9b8] p-4 flex flex-col items-center shadow-sm"><span className="text-[11px] font-bold text-gray-400 mb-1">평균 퍼팅</span><span className="text-[24px] font-black text-[#1a4314]">{avgPutts!==null?avgPutts:'-'}</span><span className="text-[11px] font-bold text-gray-400">{avgPutts!==null?'개/라운드':'기록 없음'}</span></div>
              <div className="bg-white rounded-[20px] border border-[#d1c9b8] p-4 flex flex-col items-center shadow-sm"><span className="text-[11px] font-bold text-gray-400 mb-1">최근 추세</span>{trend===null?<span className="text-[24px] font-black text-gray-300">-</span>:<span className={`text-[24px] font-black ${trend<0?'text-blue-600':trend>0?'text-red-500':'text-gray-500'}`}>{trend<0?`▼${-trend}`:trend>0?`▲${trend}`:'='}</span>}<span className="text-[11px] font-bold text-gray-400">{trend===null?'데이터 부족':trend<0?'좋아짐':trend>0?'나빠짐':'동일'}</span></div>
            </div>
          )}
          <div className="flex flex-col gap-3">
            {filtered.map(s => (
              <div key={s.id} onClick={()=>onOpenScoreDetail(s)} className="bg-white p-5 rounded-[24px] border border-[#d1c9b8] flex justify-between items-center hover:shadow-md cursor-pointer">
                <div className="flex flex-col">
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-[12px] text-gray-400 font-bold">{s.date}</span>
                    {s.game && <span className="text-[10px] font-extrabold bg-orange-50 text-orange-600 px-2 py-0.5 rounded-md border border-orange-200">{s.game.name}</span>}
                  </div>
                  <h4 className="font-black text-[17px]">{s.course}</h4>
                </div>
                <div className="text-right"><span className="text-[30px] font-black">{s.score}</span></div>
              </div>
            ))}
            <button onClick={onAddScore} className="py-4 bg-gray-900 text-white font-black rounded-2xl flex items-center justify-center gap-2 mt-2"><Icon name="Plus" size={22}/> 새 라운드 기록</button>
          </div>
        </div>
      );
    }

          <div className="bg-gray-900 text-white p-7 rounded-[28px] shadow-lg flex flex-col items-center relative"><Icon name="Trophy" size={130} className="absolute opacity-10 -right-4" /><span className="bg-white/20 px-3 py-1 rounded-full text-[11px] mb-4">{scoreData.type}</span><h2 className="text-[24px] font-black mb-1">{scoreData.course}</h2><p className="text-gray-400 font-bold mb-7">{scoreData.date}</p><div className="flex gap-8 items-baseline"><div className="text-center"><p className="text-[13px] text-gray-400">타수</p><p className="text-[48px] font-black">{scoreData.score}</p></div><div className="w-px h-12 bg-gray-700"></div><div><p className="text-[36px] font-black text-red-400">{scoreData.par}</p></div></div></div>
          {scoreData.imageUrl && <div className="mb-4"><h3 className="font-black text-[16px] mb-3 flex items-center gap-2"><Icon name="Camera" size={20} className="text-[#10b981]" /> 스코어카드 원본</h3><img src={scoreData.imageUrl} className="w-full rounded-2xl border object-cover h-[200px]" /></div>}
          {scoreData.game && (
            <div className="bg-orange-50 border border-orange-200 p-5 rounded-[24px] mb-4">
              <div className="flex justify-between items-center mb-3">
                <h4 className="font-black text-orange-800 flex items-center gap-2"><Icon name="Gamepad2" size={20}/> {scoreData.game.name} 결과</h4>
                <button onClick={() => setShowGameDetails(!showGameDetails)} className="text-[11px] font-bold bg-white text-orange-600 px-3 py-1.5 rounded-full border border-orange-200 shadow-sm hover:bg-orange-100 transition-colors">
                  {showGameDetails ? '간략히 보기' : '자세히 보기'}
                </button>
              </div>
              <div className="grid grid-cols-2 gap-2">
                {scoreData.game.results.map((r,i)=><div key={`r-${i}`} className="bg-white p-2.5 rounded-xl flex justify-between font-bold text-[13px]"><span>{r.name}</span><span className={r.point.includes('+')?'text-blue-600':'text-red-600'}>{r.point}</span></div>)}
              </div>
              {showGameDetails && scoreData.game.details && (
                <div className="mt-4 pt-4 border-t border-orange-200/50 flex flex-col gap-2 animate-in slide-in-from-top-2">
                  <span className="text-[12px] font-extrabold text-orange-800 mb-1">홀별 상세 획득 내역</span>
                  {scoreData.game.details.map((d, i) => (
                    <div key={`d-${i}`} className="bg-white/60 p-2.5 rounded-xl flex justify-between items-center text-[12px]">
                      <span className="font-bold text-gray-600">{d.hole} <span className="font-medium text-gray-400">({d.desc})</span></span>
                      <span className="font-extrabold text-gray-900">{d.winner} <span className="text-blue-600">{d.amount} P</span></span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
          {typeof scoreData.putts === 'number' && !hasHoleData && (
            <div className="bg-white rounded-[20px] border border-[#d1c9b8] p-5 flex justify-between items-center shadow-sm"><span className="font-black text-[15px] flex items-center gap-2"><Icon name="Target" size={18} className="text-[#10b981]"/> 총 퍼팅 수</span><span className="text-[24px] font-black text-[#1a4314]">{scoreData.putts}<span className="text-[14px] text-gray-400 ml-1">개</span></span></div>
          )}
          {hasHoleData && <>
          <h3 className="font-black text-[16px] mb-1 flex items-center gap-2"><Icon name="BarChart3" size={20} className="text-[#10b981]" /> 나의 스코어카드</h3>

    function ScoreEditor({ onSave, onCancel }) {
      const today = (() => { const d = new Date(); const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`; })();
      const [course, setCourse] = useState('');
      const [date, setDate] = useState(today);
      const [type, setType] = useState('필드');
      const [score, setScore] = useState('');
      const [putts, setPutts] = useState('');
      const [imageUrl, setImageUrl] = useState(null);
      const fileInputRef = useRef(null);
      const PAR = 72;
      const scoreNum = parseInt(score, 10);
      const parDisp = !isNaN(scoreNum) ? (scoreNum === PAR ? 'E' : (scoreNum > PAR ? `+${scoreNum-PAR}` : `${scoreNum-PAR}`)) : '-';
      const canSave = course.trim() && !isNaN(scoreNum);
      const handleSave = () => {
        if (!canSave) { alert('골프장 이름과 타수를 입력해주세요.'); return; }
        const payload = { date, course: course.trim(), score: scoreNum, type, par: parDisp, imageUrl, players: [] };
        const pn = parseInt(putts, 10);
        if (!isNaN(pn)) payload.putts = pn;
        onSave(payload);
      };
      return (
        <div className="p-6 bg-[#fdfcf9] min-h-full flex flex-col gap-5">
          <h2 className="text-[26px] font-black mt-4">새 스코어 기록</h2>
          <div className="flex flex-col gap-4">
            <input type="text" value={course} onChange={e=>setCourse(e.target.value)} placeholder="골프장 이름..." className="w-full bg-white border border-[#d1c9b8] rounded-2xl px-5 py-4 text-[16px] font-bold outline-none focus:border-[#1a4314]" />
            <div className="flex gap-3">
              <input type="text" value={date} onChange={e=>setDate(e.target.value)} placeholder="2025.10.20" className="flex-1 bg-white border border-[#d1c9b8] rounded-2xl px-5 py-4 text-[15px] font-bold outline-none focus:border-[#1a4314]" />
              <div className="flex bg-[#E2D9C8] rounded-2xl p-1 gap-1 shrink-0">
                {['필드','스크린'].map(t => <button key={t} onClick={()=>setType(t)} className={`px-4 rounded-xl font-black text-[14px] transition-colors ${type===t ? 'bg-[#1a4314] text-white' : 'text-[#1a4314]'}`}>{t}</button>)}

            </div>
            <div className="flex gap-3">
              <div className="flex-1 relative">
                <label className="block text-[12px] font-black text-gray-500 mb-1.5 px-1">총 타수</label>
                <input inputMode="numeric" value={score} onChange={e=>setScore(e.target.value.replace(/[^0-9]/g,''))} placeholder="예: 82" className="w-full bg-white border border-[#d1c9b8] rounded-2xl px-5 py-4 text-[18px] font-black outline-none focus:border-[#1a4314]" />
                {parDisp !== '-' && <span className={`absolute right-4 bottom-4 font-black text-[15px] ${scoreNum>PAR?'text-red-500':scoreNum<PAR?'text-blue-600':'text-gray-500'}`}>{parDisp}</span>}
              </div>
              <div className="flex-1">
                <label className="block text-[12px] font-black text-gray-500 mb-1.5 px-1">총 퍼팅 <span className="text-gray-400 font-bold">(선택)</span></label>
                <input inputMode="numeric" value={putts} onChange={e=>setPutts(e.target.value.replace(/[^0-9]/g,''))} placeholder="예: 32" className="w-full bg-white border border-[#d1c9b8] rounded-2xl px-5 py-4 text-[18px] font-black outline-none focus:border-[#1a4314]" />
              </div>
            </div>
            <div>
              <label className="block text-[14px] font-black text-gray-700 mb-2 px-1">스코어카드 스캔 (선택)</label>

              <input type="file" ref={fileInputRef} onChange={e=>{const f=e.target.files[0]; if(f){const r=new FileReader(); r.onload=()=>setImageUrl(r.result); r.readAsDataURL(f);}}} className="hidden" accept="image/*" />
            </div>
          </div>
          <div className="mt-auto flex gap-3 pt-6 border-t pb-6"><button onClick={onCancel} className="flex-1 py-4 bg-white border rounded-2xl font-black">취소</button><button onClick={handleSave} disabled={!canSave} className="flex-[2] py-4 bg-[#1a4314] text-white rounded-2xl font-black shadow-lg disabled:opacity-50 disabled:bg-gray-400">저장하기</button></div>

                    {(memo.author || '나').substring(0, 1)}
                  </div>
                  <div className="flex flex-col">
                    <div className="flex items-center gap-2">
                      <span className="font-black text-[16px] text-gray-900">{memo.author || '나'}</span>
                      {memo.author !== '나' && (

    function MemoEditor({ memo, categories, onSave, onCancel, baseFontSize }) {

        else if (type === 'url' && newUrl.trim()) { setUrls([...urls, newUrl]); setNewUrl(''); }
      };

      const toggleCheckItem = (id) => { setChecklist(checklist.map(item => item.id === id ? { ...item, completed: !item.completed } : item)); };

      const handleOrganizeContent = async () => {
        const currentHtml = editorRef.current ? editorRef.current.innerHTML : content;
        const rawText = currentHtml.replace(/<[^>]*>?/gm, '').trim();
        if (!rawText) return alert("정리할 내용을 먼저 작성해주세요!");
        setIsOrganizingContent(true);

        const apiKey = "";

        - 적절하고 센스 있는 이모지를 섞어줄 것
        - 결과를 <b>, <br/>, <ul>, <li> 등의 HTML 태그가 적용된 형태로 바로 출력할 것 (마크다운 제외).
        원본 내용: ${rawText}`;

        const payload = { contents: [{ parts: [{ text: promptText }] }] };

        const fetchWithBackoff = async (retries = 3, delay = 1000) => {
          try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            });
            if (!response.ok) throw new Error(`HTTP error!`);
            return JSON.parse(await response.text());
          } catch (error) {
            if (retries > 0) {
              await new Promise(resolve => setTimeout(resolve, delay));
              return fetchWithBackoff(retries - 1, delay * 2);
            } else throw error;
          }
        };

        try {
          const result = await fetchWithBackoff();
          let text = result.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) {
            const cleanHtml = text.replace(/```html/gi, '').replace(/```/g, '').trim();
            let finalHtml = cleanHtml;
            if (keepOriginal) {
              const separatorTop = '<br/><br/><div style="color:#9ca3af; font-size:13px; font-weight:900; margin-bottom:8px;">--- AI 정리 ---</div>';
              const separatorBottom = '<br/><br/><div style="color:#9ca3af; font-size:13px; font-weight:900; margin-bottom:8px;">--- 원본 내용 ---</div>';
              finalHtml = originalPosition === 'top' ? currentHtml + separatorTop + cleanHtml : cleanHtml + separatorBottom + currentHtml;
            }
            setContent(finalHtml);
            if (editorRef.current) editorRef.current.innerHTML = finalHtml;
          }
        } catch (error) {
          alert("글 정리 중 오류가 발생했습니다.");

          setIsOrganizingContent(false);
        }

      const handleGenerateTags = async () => {

        const rawText = currentHtml.replace(/<[^>]*>?/gm, '').trim();
        if (!rawText) return alert("메모 내용을 먼저 작성해주세요!");
        setIsGeneratingTags(true);

        const apiKey = ""; 
        const promptText = `다음 골프 메모를 읽고 인스타그램 해시태그 3~5개를 한 줄로 띄어쓰기해서 출력해.\n내용: ${rawText}`; 
        const payload = { contents: [{ parts: [{ text: promptText }] }] };

        const fetchWithBackoff = async (retries = 3, delay = 1000) => {
          try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {

    // === [뽑기 게임] 카드로 팀/조커 배정 (설정→섞기→뽑기→[조커추첨]→결과) · 단일 기기 ===
    const DRAW_PRO = ['타이거 우즈', '로리 맥일로이', '스코티 셔플러', '필 미켈슨'];
    const DRAW_JOKERS = ['사용안함', '랜덤', '이글', '버디', '파', '보기', '더블', '트리플'];
    const DRAW_JOKER_POOL = ['이글', '버디', '파', '보기', '더블', '트리플'];
    function DrawGame({ onExit, backRef }) {
      const [phase, setPhase] = useState('settings'); // settings | shuffle | draw | randomJoker | result
      const [players, setPlayers] = useState(['', '', '', '']);
      const [joker, setJoker] = useState('보기');
      const [roles, setRoles] = useState([]);
      const [sel, setSel] = useState({}); // { cardIndex: {player, role} }
      const [shufPos, setShufPos] = useState(Array.from({ length: 5 }, () => ({ x: 0, y: 0, r: 0 })));
      const [shuffling, setShuffling] = useState(false);
      const [finalJoker, setFinalJoker] = useState(''); // 조커가 받은 타수
      const [spinLabel, setSpinLabel] = useState('...');
      const [spinDone, setSpinDone] = useState(false); // 추첨 멈춰서 타수 확정된 상태
      const [reveal, setReveal] = useState('all'); // all | order | random (결과 공개 방식)
      const [jokerReveal, setJokerReveal] = useState('inline'); // inline | last (조커 공개 시점)
      const [revealOrder, setRevealOrder] = useState([]); // 공개 순서(카드 인덱스)
      const [revealedCount, setRevealedCount] = useState(0); // 지금까지 공개된 수
      const shufRef = useRef(null);

      const computeRoles = () => {
        if (joker === '사용안함') return ['R', 'R', 'B', 'B'].sort(() => Math.random() - 0.5);
        const s = Math.random() > 0.5 ? 'R' : 'B'; const f = s === 'R' ? 'B' : 'R';
        return [f, f, s, 'J'].sort(() => Math.random() - 0.5);
      };
      const resetRound = () => {
        setRoles(computeRoles()); setSel({});
        setFinalJoker(joker === '랜덤' || joker === '사용안함' ? '' : joker);
        setShufPos(Array.from({ length: 5 }, () => ({ x: 0, y: 0, r: 0 })));
      };
      const startGame = () => {
        setPlayers(prev => prev.map((p, i) => p.trim() || DRAW_PRO[i]));
        resetRound(); setPhase('shuffle');
      };
      const nextHole = () => { resetRound(); setPhase('shuffle'); };

      // 단계별 뒤로: 설정에서는 게임 메뉴로 나가고, 그 외엔 이전 단계로 (상단 헤더 뒤로 버튼이 호출)
      const PHASE_PREV = { shuffle: 'settings', draw: 'shuffle', randomJoker: 'result', result: 'draw' };
      const goBack = () => { if (phase === 'settings') onExit(); else setPhase(PHASE_PREV[phase] || 'settings'); };
      useEffect(() => { if (backRef) backRef.current = goBack; return () => { if (backRef) backRef.current = null; }; });

      const doShuffle = (dir) => {
        if (shuffling) return;
        setShuffling(true);
        let c = 0;
        shufRef.current = setInterval(() => {
          c++;
          if (c > 8) {
            clearInterval(shufRef.current);
            setShufPos(Array.from({ length: 5 }, () => ({ x: 0, y: 0, r: 0 })));
            setShuffling(false);
          } else {
            setShufPos(Array.from({ length: 5 }, () => ({ x: (Math.random() - 0.5) * 60 + (dir === 'l' ? -80 : 80), y: (Math.random() - 0.5) * 60, r: (Math.random() - 0.5) * 180 + (dir === 'l' ? -90 : 90) })));
          }
        }, 100);
      };
      useEffect(() => () => { if (shufRef.current) clearInterval(shufRef.current); }, []);

      // 랜덤 조커 타수 추첨 애니메이션: 돌리다 → 타수에서 멈춤 → 잠깐 보여주고 → 결과로
      useEffect(() => {
        if (phase !== 'randomJoker') return;
        setSpinDone(false);
        let n = 0;
        const final = DRAW_JOKER_POOL[Math.floor(Math.random() * DRAW_JOKER_POOL.length)];
        const spin = setInterval(() => { setSpinLabel(DRAW_JOKER_POOL[n % DRAW_JOKER_POOL.length]); n++; }, 100);
        const stop = setTimeout(() => { clearInterval(spin); setSpinLabel(final); setSpinDone(true); }, 1700); // 멈추고 타수 표시
        const done = setTimeout(() => { setFinalJoker(final); setPhase('result'); }, 2900); // 잠깐 멈췄다가 결과로
        return () => { clearInterval(spin); clearTimeout(stop); clearTimeout(done); };
      }, [phase]);

      const cnt = Object.keys(sel).length;
      const pickCard = (i) => {
        if (sel[i] || cnt >= 4) return;
        if ('vibrate' in navigator) navigator.vibrate(30);
        setSel(prev => ({ ...prev, [i]: { player: players[cnt], role: roles[cnt], pick: cnt } }));
      };
      const autoFill = () => {
        const picked = Object.keys(sel).map(Number);
        const open = [0, 1, 2, 3, 4].filter(i => !picked.includes(i)).sort(() => Math.random() - 0.5);
        const next = { ...sel };
        for (let order = cnt; order < 4; order++) next[open.pop()] = { player: players[order], role: roles[order], pick: order };
        setSel(next); startReveal(next);
      };

      // 결과 공개 순서 계산 후 결과 화면으로
      const startReveal = (s) => {
        const idxs = Object.keys(s).map(Number);
        const jIdx = idxs.find(ci => s[ci].role === 'J');
        let ord = reveal === 'random'
          ? [...idxs].sort(() => Math.random() - 0.5)
          : [...idxs].sort((a, b) => s[a].pick - s[b].pick);
        if (joker !== '사용안함' && jokerReveal === 'last' && jIdx != null) {
          ord = ord.filter(ci => ci !== jIdx).concat(jIdx); // 조커를 맨 마지막으로
        }
        setRevealOrder(ord);
        const initial = reveal === 'all'
          ? (joker !== '사용안함' && jokerReveal === 'last' ? ord.length - 1 : ord.length)
          : 0;
        setRevealedCount(initial);
        setPhase('result');
      };

      // ─ 설정 ─
      if (phase === 'settings') {
