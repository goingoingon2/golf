<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>골프탑 AI 조건 부킹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* layout: 왼쪽 골퍼 앱(폰 프레임 · 조건 부킹 / AI 매니저 / 내 예약 3탭), 오른쪽 골프탑 매니저 콘솔. 920px 아래에선 상단 세그먼트로 전환 */
:root{
  --bg:#E9EEEA; --surface:#FFFFFF; --sunk:#F3F6F4; --ink:#14211A; --muted:#5B6A61; --line:#D5DDD7;
  --green:#1D6A44; --green-ink:#FFFFFF; --green-soft:#E1EFE6;
  --amber:#D98A12; --amber-ink:#8F5600; --amber-soft:#FFF2DA; --danger:#B23A3A; --danger-soft:#F8E3E1;
  --ai:#3456A0; --ai-ink:#FFFFFF; --ai-soft:#E4EAF6; --chat:#EDF1EE;
  --c-date:#2763A8; --c-time:#7246AE; --c-region:#1D6A44; --c-people:#B0521A; --c-price:#8C6A00; --c-opts:#4B5B52;
  --t-date:#E3ECF7; --t-time:#EEE7F7; --t-region:#E1EFE6; --t-people:#F8E9DE; --t-price:#F5EDD3; --t-opts:#E8ECEA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1612; --surface:#18221C; --sunk:#121A15; --ink:#E6EEE9; --muted:#9AA9A0; --line:#2B3831;
    --green:#3FA872; --green-ink:#08130D; --green-soft:#1C3227;
    --amber:#F0A93A; --amber-ink:#F0A93A; --amber-soft:#33281A; --danger:#E07070; --danger-soft:#3A1F1F;
    --ai:#8DA9EA; --ai-ink:#0B1426; --ai-soft:#1C2740; --chat:#111813;
    --c-date:#7FB0EA; --c-time:#B79BE6; --c-region:#6DCB98; --c-people:#EFA071; --c-price:#E3C35C; --c-opts:#A9B8B0;
    --t-date:#1B2A3B; --t-time:#272038; --t-region:#1C3227; --t-people:#36261C; --t-price:#332C17; --t-opts:#222C27;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#18221C; --sunk:#121A15; --ink:#E6EEE9; --muted:#9AA9A0; --line:#2B3831;
  --green:#3FA872; --green-ink:#08130D; --green-soft:#1C3227;
  --amber:#F0A93A; --amber-ink:#F0A93A; --amber-soft:#33281A; --danger:#E07070; --danger-soft:#3A1F1F;
  --ai:#8DA9EA; --ai-ink:#0B1426; --ai-soft:#1C2740; --chat:#111813;
  --c-date:#7FB0EA; --c-time:#B79BE6; --c-region:#6DCB98; --c-people:#EFA071; --c-price:#E3C35C; --c-opts:#A9B8B0;
  --t-date:#1B2A3B; --t-time:#272038; --t-region:#1C3227; --t-people:#36261C; --t-price:#332C17; --t-opts:#222C27;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

.app{max-width:1240px;margin:0 auto;padding:22px 20px 40px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.seg{display:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--green);color:var(--green-ink)}
.seg .dot{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:#fff;font-size:11px;line-height:18px;margin-left:6px;padding:0 5px}

.stage{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:24px;align-items:start}
.pane-label{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px 4px}
@media (max-width:920px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .seg{display:flex}
  .pane{display:none}
  .pane.on{display:block}
}

/* ---------- golfer phone shell ---------- */
.phone{background:var(--surface);border:1px solid var(--line);border-radius:28px;height:clamp(620px,calc(100vh - 150px),880px);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:920px){.phone{height:clamp(540px,calc(100vh - 160px),880px);height:clamp(540px,calc(100dvh - 160px),880px)}}
.g-bar{flex:none;display:flex;align-items:center;gap:10px;padding:14px 18px 12px;border-bottom:1px solid var(--line);min-height:62px}
.g-bar .who{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.g-bar .who b{font-size:15.5px;letter-spacing:-.01em}
.g-bar .who small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;animation:pl 1.6s infinite}
.logo{width:34px;height:34px;border-radius:11px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
.ai-av{width:34px;height:34px;border-radius:11px;background:var(--ai);color:var(--ai-ink);display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.03em;flex:none}
.ai-av.sm{width:24px;height:24px;border-radius:8px;font-size:10px}
.g-view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:22px 20px 26px}
.g-tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface)}
.g-tabs button{border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);font-weight:600;position:relative}
.g-tabs svg{width:21px;height:21px}
.g-tabs button.on{color:var(--green)}
.g-tabs button.on[data-gtab="chat"]{color:var(--ai)}
.g-tabs .badge{position:absolute;top:5px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;background:var(--amber);color:#fff;font-size:10.5px;line-height:17px;padding:0 4px;text-align:center}

/* ---------- golfer: compose ---------- */
.g-title{margin:0 0 6px;font-size:27px;line-height:1.25;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.g-sub{margin:0 0 18px;color:var(--muted);font-size:14px}
.inbox{position:relative;border:2px solid var(--line);border-radius:18px;background:var(--sunk);transition:border-color .15s}
.inbox:focus-within{border-color:var(--green);background:var(--surface)}
.inbox textarea{display:block;width:100%;border:0;background:transparent;resize:none;padding:16px 44px 16px 16px;font-size:18px;line-height:1.45;min-height:88px;outline:none}
.inbox textarea::placeholder{color:var(--muted);opacity:.8}
.clear{position:absolute;right:10px;top:12px;width:28px;height:28px;border-radius:14px;border:0;background:var(--line);color:var(--muted);font-size:15px;line-height:28px;display:none}
.clear.show{display:block}

.mirror{min-height:26px;margin:10px 4px 0;font-size:14px;color:var(--muted);line-height:1.9}
.mirror .hl{border-radius:5px;padding:1px 3px;color:var(--ink);font-weight:600}
.hl.date{background:var(--t-date);box-shadow:inset 0 -2px 0 var(--c-date)}
.hl.time{background:var(--t-time);box-shadow:inset 0 -2px 0 var(--c-time)}
.hl.region{background:var(--t-region);box-shadow:inset 0 -2px 0 var(--c-region)}
.hl.people{background:var(--t-people);box-shadow:inset 0 -2px 0 var(--c-people)}
.hl.price{background:var(--t-price);box-shadow:inset 0 -2px 0 var(--c-price)}
.hl.opts{background:var(--t-opts);box-shadow:inset 0 -2px 0 var(--c-opts)}

.quick{display:flex;gap:8px;overflow-x:auto;margin:12px -20px 0;padding:2px 20px 4px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 13px;font-size:13.5px;color:var(--ink);white-space:nowrap}
.quick button:hover{border-color:var(--green);color:var(--green)}

.sec-h{font-size:13px;font-weight:600;color:var(--muted);margin:20px 2px 8px}
.sec-h:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:7px 11px;font-size:14px;border:1.5px solid transparent;background:var(--sunk);text-align:left}
.chip .k{font-size:12px;font-weight:600;opacity:.85}
.chip .v{font-weight:600}
.chip.date{background:var(--t-date)} .chip.date .k{color:var(--c-date)}
.chip.time{background:var(--t-time)} .chip.time .k{color:var(--c-time)}
.chip.region{background:var(--t-region)} .chip.region .k{color:var(--c-region)}
.chip.people{background:var(--t-people)} .chip.people .k{color:var(--c-people)}
.chip.price{background:var(--t-price)} .chip.price .k{color:var(--c-price)}
.chip.opts{background:var(--t-opts)} .chip.opts .k{color:var(--c-opts)}
.chip.miss{background:var(--amber-soft);border:1.5px dashed var(--amber);color:var(--ink)}
.chip.miss .k{color:var(--amber-ink)}
.chip.miss.req{animation:nudge 2.2s ease-in-out infinite}
.chip.opt-miss{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.chip.active{border-style:solid;border-color:var(--ink)}
.chip.def{background:transparent;border:1.5px dashed var(--line)}
.chip.def .v::after{content:" 기본";font-weight:500;font-size:11px;color:var(--muted)}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(217,138,18,0)}50%{box-shadow:0 0 0 4px rgba(217,138,18,.22)}}

.editor{margin-top:10px;border-radius:16px;background:var(--sunk);padding:14px;display:none}
.editor.show{display:block}
.editor h4{margin:0 0 10px;font-size:14px}
.opts-row{display:flex;flex-wrap:wrap;gap:6px}
.opts-row button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px}
.opts-row button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.opts-row input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px}
.editor .done{margin-top:12px;display:flex;justify-content:space-between;align-items:center}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px}

.send{display:block;width:100%;margin-top:22px;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:700;background:var(--green);color:var(--green-ink)}
.send:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.send-note{text-align:center;font-size:12.5px;color:var(--muted);margin-top:8px}
.ai-entry{display:flex;align-items:center;gap:12px;width:100%;margin-top:22px;border:1px solid var(--line);background:var(--sunk);border-radius:16px;padding:12px 14px;text-align:left}
.ai-entry span.t{flex:1;min-width:0;display:flex;flex-direction:column}
.ai-entry b{font-size:14.5px}
.ai-entry small{font-size:12.5px;color:var(--muted)}
.ai-entry .arr{color:var(--muted);font-size:18px}
.ai-entry:hover{border-color:var(--ai)}

/* status view */
.back{border:0;background:none;color:var(--muted);padding:0;font-size:14px;margin-bottom:14px}
.status-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.status-head h2{margin:0;font-size:22px;letter-spacing:-.02em}
.cd{font-variant-numeric:tabular-nums;font-weight:600;color:var(--amber-ink);font-size:14px;white-space:nowrap}
.seen{font-size:13.5px;color:var(--muted);margin:4px 0 12px}
.waiting{margin-top:16px;border:1.5px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.waiting .pulse{width:10px;height:10px;border-radius:5px;background:var(--green);display:inline-block;margin-right:8px;animation:pl 1.4s infinite}
@keyframes pl{0%,100%{opacity:.25}50%{opacity:1}}

.prop{border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;background:var(--surface)}
.prop.new{animation:arrive .5s ease-out}
@keyframes arrive{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.prop.dim{opacity:.45}
.prop.won{border:2px solid var(--green)}
.prop.rec{border:2px solid var(--ai)}
.p-top{display:flex;justify-content:space-between;gap:10px}
.p-course{font-size:17px;font-weight:700;margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.p-area{font-size:13px;color:var(--muted)}
.p-when{font-size:14px;margin-top:2px}
.p-price{text-align:right;white-space:nowrap}
.p-price b{font-size:21px;letter-spacing:-.02em}
.p-price small{display:block;font-size:12px;color:var(--muted)}
.p-price s{color:var(--muted);font-size:12.5px}
.perks{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 0}
.perks span{font-size:12px;background:var(--sunk);border-radius:6px;padding:3px 8px;color:var(--muted)}
.p-memo{margin:10px 0 0;font-size:14px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.p-mgr{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--muted)}
.avatar{width:28px;height:28px;border-radius:14px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.p-act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{border-radius:12px;padding:11px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);line-height:1.3}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.btn.dan{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.booked{margin-top:14px;background:var(--green-soft);border-radius:16px;padding:14px 16px;font-size:14px}
.booked b{display:block;font-size:15px;margin-bottom:2px}

/* AI in status view */
.ai-tag{flex:none;display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;background:var(--ai-soft);color:var(--ai);border-radius:5px;padding:1px 6px;line-height:1.6}
.ai-box{margin-top:16px;border:1.5px solid var(--ai-soft);border-radius:18px;background:var(--surface);overflow:hidden}
.ai-h{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--ai-soft);font-size:13.5px;font-weight:700;color:var(--ai)}
.ai-h .pill{margin-left:auto}
.ai-b{padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.ai-b p{margin:0;color:var(--muted);font-size:13.5px}
.ai-b .linkbtn{align-self:flex-start;color:var(--ai);padding:0}
.ai-note{display:flex;gap:6px;align-items:flex-start;margin-top:10px;font-size:13px;color:var(--muted)}
.ai-sum{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--ai-soft);font-size:13.5px;color:var(--ink)}
.ai-sum p{margin:0}

/* slot rows (AI 잔여타임) */
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.slot.go{grid-template-columns:auto minmax(0,1fr) auto auto}
.slot.over{opacity:.55}
.slot.rec{border-color:var(--ai)}
.slot .t{font-weight:700;font-size:15px;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--ink)}
.slot .t small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-top:2px}
.slot .n{min-width:0}
.slot .n b{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:13.5px;color:var(--ink)}
.slot .n span{display:block;font-size:11.5px;color:var(--muted);line-height:1.4}
.slot .pp{text-align:right;font-weight:700;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14px}
.slot .pp s{display:block;font-size:11px;color:var(--muted);font-weight:400}
.slot .pp small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.5}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-wait{background:var(--amber-soft);color:var(--amber-ink)}
.p-ok{background:var(--green-soft);color:var(--green)}
.p-hot{background:var(--danger-soft);color:var(--danger)}
.p-neu{background:var(--sunk);color:var(--muted)}
.p-ai{background:var(--ai-soft);color:var(--ai)}

/* ---------- golfer: AI chat ---------- */
.g-view.chat{padding:0;display:flex;flex-direction:column;background:var(--chat);overflow:hidden}
.clog{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 12px 10px;display:flex;flex-direction:column;gap:10px}
.dd{align-self:center;font-size:11.5px;color:var(--muted);background:var(--surface);padding:2px 10px;border-radius:10px}
.m{display:flex;gap:7px;align-items:flex-end;max-width:95%}
.m.ai{align-self:flex-start}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m .av{width:30px;height:30px;border-radius:10px;background:var(--ai);color:var(--ai-ink);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none;align-self:flex-start}
.m .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.m.me .body{align-items:flex-end}
.m .name{font-size:11.5px;color:var(--muted);padding-left:2px}
.m .bub{padding:9px 12px;border-radius:15px;background:var(--surface);border:1px solid var(--line);font-size:14px;line-height:1.55;white-space:pre-wrap;color:var(--ink)}
.m.ai .bub{border-top-left-radius:4px}
.m.me .bub{background:var(--green);border-color:var(--green);color:var(--green-ink);border-bottom-right-radius:4px}
.m .bub .voice{font-size:11px;opacity:.75;margin-right:4px}
.m .tm{font-size:10.5px;color:var(--muted);flex:none;padding-bottom:3px;font-variant-numeric:tabular-nums}
.typing{color:var(--muted);font-size:13px}
.rc{border:1px solid var(--line);border-radius:15px;background:var(--surface);overflow:hidden;width:min(326px,100%)}
.rc.hot{border-color:var(--amber)}
.rc.done{opacity:.82}
.rc .rh{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk);font-size:12.5px;font-weight:600;color:var(--ink)}
.rc .rh .pill{margin-left:auto}
.rc .rb{padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--muted)}
.rc .rb strong{color:var(--ink)}
.rc .ra{display:flex;gap:6px;padding:0 12px 12px;flex-wrap:wrap}
.rc .ra .btn{flex:1 1 auto}
.big{font-size:21px;font-weight:700;color:var(--ink);letter-spacing:-.01em;line-height:1.2;font-variant-numeric:tabular-nums}
.big small{font-size:12px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.big.nm{font-size:18px}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.pr s{color:var(--muted);font-size:12px}
.pr b{font-size:17px;color:var(--ink)}
.pr small{font-size:11.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:78px minmax(0,1fr);font-size:12.5px;gap:3px 8px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--ink)}
.wx{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--amber-soft);color:var(--ink);font-size:12.5px;line-height:1.5}
.wx b{font-size:18px;color:var(--amber-ink);flex:none;font-variant-numeric:tabular-nums}
.verdict{margin:0;font-size:13px;color:var(--ink);line-height:1.55}
.says{display:flex;flex-wrap:wrap;gap:6px}
.say{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:5px 11px;font-size:13px;color:var(--ink);text-align:left;line-height:1.35}
.say:hover{border-color:var(--ai);color:var(--ai)}
.qr{flex:none;display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:none;background:var(--surface);border-top:1px solid var(--line)}
.qr::-webkit-scrollbar{display:none}
.qr .say{flex:none;white-space:nowrap}
.composer{flex:none;background:var(--surface);padding:8px 12px 10px;display:flex;flex-direction:column;gap:5px}
.c-row{display:flex;gap:8px;align-items:center}
.c-row input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:21px;padding:0 14px;background:var(--sunk);font-size:14.5px}
.c-row input:focus{outline:none;border-color:var(--ai);background:var(--surface)}
.c-row .btn{padding:0 14px;height:42px;border-radius:21px}
.mic{width:42px;height:42px;border-radius:50%;border:1px solid var(--ai);background:var(--ai);color:var(--ai-ink);display:grid;place-items:center;flex:none;position:relative;padding:0}
.mic svg{width:19px;height:19px}
.mic.rec{background:var(--danger);border-color:var(--danger);color:#fff}
.mic.rec::after{content:"";position:absolute;inset:-5px;border:2px solid var(--danger);border-radius:50%;opacity:.5;animation:ring 1.2s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.2);opacity:0}}
.interim{font-size:12px;color:var(--muted);font-style:italic;padding-left:4px}
.interim:empty{display:none}
.c-opts{display:flex;gap:14px;font-size:12px;color:var(--muted);padding-left:4px}
.c-opts label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.c-opts input{accent-color:var(--ai);margin:0}

/* ---------- golfer: 내 예약 ---------- */
.trip{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;margin-bottom:10px}
.trip .tt{display:flex;gap:12px;align-items:center;padding:12px 14px}
.trip .d{text-align:center;line-height:1.15;padding:6px 10px;border-radius:10px;background:var(--green-soft);color:var(--green);flex:none;min-width:48px}
.trip .d b{display:block;font-size:20px}
.trip .d small{font-size:11px}
.trip.past .d{background:var(--sunk);color:var(--muted)}
.trip .info{min-width:0;flex:1}
.trip .info b{display:block;font-size:15px}
.trip .info span{font-size:12.5px;color:var(--muted)}
.trip .tb{border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;flex-direction:column;gap:9px;font-size:13px;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.mini{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--surface);display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.mini .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mini .row .sp{flex:1}
.mini .id{font-weight:700;font-variant-numeric:tabular-nums}
.note-s{font-size:13px;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px;padding:14px;margin-bottom:10px}

/* ---------- manager ---------- */
.console{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.c-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.c-head h2{margin:0;font-size:18px}
.c-head .me{font-size:13px;color:var(--muted)}
.c-tabs{display:flex;gap:4px}
.c-tabs button{border:0;background:none;padding:7px 12px;border-radius:9px;font-size:14px;color:var(--muted);font-weight:600}
.c-tabs button.on{background:var(--sunk);color:var(--ink)}
.c-list{padding:6px 20px 20px}
.req{border-bottom:1px solid var(--line);padding:16px 0}
.req:last-child{border-bottom:0}
.req.fresh{background:linear-gradient(90deg,var(--amber-soft),transparent 70%);margin:0 -20px;padding:16px 20px}
.r-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.r-who{font-weight:700;font-size:15px}
.r-who .tag{font-size:11.5px;font-weight:600;color:var(--amber-ink);margin-left:6px}
.r-meta{font-size:13px;color:var(--muted)}
.r-text{margin:6px 0 10px;font-size:14px;color:var(--muted)}
.r-text q{color:var(--ink)}
.r-ai{display:flex;gap:7px;align-items:flex-start;margin-top:10px;font-size:13px;color:var(--muted)}
.r-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.r-count{font-size:13px;color:var(--muted)}
.r-state{font-size:13.5px;font-weight:600;color:var(--green)}
.r-state.ai{color:var(--ai)}
.chips.static .chip{padding:5px 9px;font-size:13px}

.form{margin-top:12px;border-radius:16px;background:var(--sunk);padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.form select,.form input,.form textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface)}
.form textarea{resize:vertical;min-height:60px}
.form .full{grid-column:1/-1}
.form .ai-hint{display:flex;gap:7px;align-items:flex-start;font-size:13px;color:var(--ink);background:var(--ai-soft);border-radius:12px;padding:10px 12px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;margin:0;font-weight:500;color:var(--ink);font-size:13.5px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;cursor:pointer}
.checks input{width:auto;margin:0}
.form-act{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.form-act .btn.ai-ghost{margin-right:auto;color:var(--ai);border-color:var(--ai);background:var(--surface)}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot-note{margin-top:22px;font-size:12.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){
  .chip.miss.req,.waiting .pulse,.prop.new,.live,.mic.rec::after{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>골프탑 조건 부킹 · AI 매니저</h1>
      <p>골퍼가 조건을 한 줄로 올리면 AI 매니저가 연동 골프장 잔여타임을 바로 잡아드리고, 골프탑 매니저들은 비공개 특가·조인·1박2일을 제안합니다.</p>
    </div>
    <div class="seg" id="seg">
      <button data-tab="golfer" class="on">골퍼 화면</button>
      <button data-tab="manager">매니저 콘솔<span class="dot" id="segDot" hidden>0</span></button>
    </div>
  </header>

  <div class="stage">
    <section class="pane on" id="paneGolfer">
      <div class="pane-label">골퍼 앱</div>
      <div class="phone" id="phone">
        <div class="g-bar" id="gBar"></div>
        <div class="g-view" id="vBook"></div>
        <div class="g-view chat" id="vChat" hidden>
          <div class="clog" id="clog" aria-live="polite"></div>
          <div class="qr" id="qr">
            <button class="say" data-say="이번 주말 오전 수도권 4명">이번 주말 잔여타임</button>
            <button class="say" data-say="받은 제안 비교해줘">제안 비교</button>
            <button class="say" data-say="내 예약 보여줘">내 예약</button>
            <button class="say" data-say="대기 목록 보여줘">대기 목록</button>
            <button class="say" data-say="취소 규정 알려줘">취소 규정</button>
            <button class="say" data-say="도움말">도움말</button>
          </div>
          <div class="composer">
            <div class="interim" id="interim"></div>
            <div class="c-row">
              <button class="mic" id="mic" type="button" aria-label="음성으로 말하기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></button>
              <input id="cin" autocomplete="off" aria-label="AI 매니저에게 말하기" placeholder="예) 토요일 아침 양평 쪽 4명">
              <button class="btn ai" id="csend" type="button">전송</button>
            </div>
            <div class="c-opts"><label><input type="checkbox" id="auto" checked> 말 끝나면 전송</label><label><input type="checkbox" id="tts" checked> 읽어주기</label></div>
          </div>
        </div>
        <div class="g-view" id="vTrips" hidden></div>
        <nav class="g-tabs" id="gTabs">
          <button data-gtab="book" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 4h11l-3 3.5 3 3.5H6z"/></svg>조건 부킹</button>
          <button data-gtab="chat"><span class="badge" id="aiBadge" hidden>0</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/><path d="M9 10.5h.01M12 10.5h.01M15 10.5h.01"/></svg>AI 매니저</button>
          <button data-gtab="trips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>내 예약</button>
        </nav>
      </div>
    </section>
    <section class="pane" id="paneManager">
      <div class="pane-label">골프탑 매니저 콘솔</div>
      <div class="console">
        <div class="c-head">
          <div><h2>조건 요청함</h2><div class="me">김태오 매니저 · AI가 연동 골프장 즉시 제안을 함께 보여줘요</div></div>
          <div class="c-tabs" id="cTabs">
            <button data-f="all" class="on">전체 요청</button>
            <button data-f="mine">내가 제안한 요청</button>

  </div>
  <p class="foot-note">프로토타입입니다. 골프장 이름, 가격, 매니저, 잔여타임은 모두 가상의 예시입니다. 조건 인식과 AI 매니저 응답은 서버 없이 브라우저 안에서 규칙 기반으로 동작하며, 로그인은 생략했습니다.</p>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const W = ['일','월','화','수','목','금','토'];
const DOW = {'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};
const today0 = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmt = d => `${d.getMonth()+1}월 ${d.getDate()}일 (${W[d.getDay()]})`;
const md = d => `${d.getMonth()+1}/${d.getDate()} (${W[d.getDay()]})`;
const monday = addD(today0, -((today0.getDay() + 6) % 7));
const weekDay = (dow, off) => addD(monday, off * 7 + ((dow + 6) % 7));
const rnd = a => a[Math.floor(Math.random() * a.length)];
const won = n => (Math.round(n * 10) / 10).toString().replace(/\.0$/, '') + '만원';
const wonGap = n => n < 1 ? `${Math.round(n * 10)}천원` : won(n);
const pad = n => String(n).padStart(2, '0');
const hhmm = (d = new Date()) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const sameDay = (a, b) => a.toDateString() === b.toDateString();
const uid = p => p + Math.random().toString(36).slice(2, 8);
const teeMinus = (tee, min) => { const [h, m] = tee.split(':').map(Number), t = h * 60 + m - min; return `${pad(Math.floor(t / 60))}:${pad(t % 60)}`; };
function rng(str){
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  let a = h >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

function dayVal(d){ return { label: fmt(d), dates: [d] }; }
function weekendVal(off){
  let sat = addD(monday, 5 + 7 * off), sun = addD(sat, 1);
  let ds = [sat, sun].filter(d => d >= today0);
  if (!ds.length){ sat = addD(sat, 7); sun = addD(sun, 7); ds = [sat, sun]; }
  if (ds.length === 1) return { label: fmt(ds[0]), dates: ds, weekend: true };
  const label = sat.getMonth() === sun.getMonth()
    ? `${sat.getMonth()+1}월 ${sat.getDate()}~${sun.getDate()}일 주말`
    : `${sat.getMonth()+1}월 ${sat.getDate()}일~${sun.getMonth()+1}월 ${sun.getDate()}일 주말`;
  return { label, dates: ds, weekend: true };
}
function weekdaysAhead(){
  const out = []; for (let i = 1; out.length < 5; i++){ const d = addD(today0, i); if (d.getDay() % 6) out.push(d); }
  return out;
}

/* ================= field meta ================= */
const FIELDS = [
  { f:'date',   name:'날짜',   ask:'날짜 정하기',   req:true },
  { f:'time',   name:'시간대', ask:'시간대 정하기', req:true },
  { f:'region', name:'지역',   ask:'지역 정하기',   req:true },
  { f:'people', name:'인원',   ask:'인원 정하기',   req:true },
  { f:'price',  name:'그린피', ask:'그린피 (선택)', req:false },
  { f:'opts',   name:'옵션',   ask:'옵션 (선택)',   req:false },
];
const FNAME = Object.fromEntries(FIELDS.map(x => [x.f, x.name]));

/* ================= parser ================= */
const DATE_RULES = [
  [/다음\s*주\s*말|담주\s*주말|차주\s*주말/, () => weekendVal(1)],
  [/(이번\s*)?주말/, () => weekendVal(0)],
  [/(다음\s*주|담주|차주)\s*([월화수목금토일])요일?/, m => dayVal(weekDay(DOW[m[2]], 1))],
  [/(이번\s*주|금주)\s*([월화수목금토일])요일?/, m => { let d = weekDay(DOW[m[2]], 0); if (d < today0) d = addD(d, 7); return dayVal(d); }],
  [/(\d{1,2})\s*월\s*(\d{1,2})\s*일/, m => monthDay(+m[1], +m[2])],
  [/(\d{1,2})\s*\/\s*(\d{1,2})/, m => monthDay(+m[1], +m[2])],
  [/오늘|당일/, () => dayVal(today0)],
  [/내일/, () => dayVal(addD(today0, 1))],
  [/모레/, () => dayVal(addD(today0, 2))],
  [/글피/, () => dayVal(addD(today0, 3))],
  [/평일/, () => ({ label:'평일 중 아무 날', dates: weekdaysAhead(), flex:true })],
  [/([월화수목금토일])요일/, m => { let d = weekDay(DOW[m[1]], 0); if (d < today0) d = addD(d, 7); return dayVal(d); }],
];
function monthDay(mo, da){
  if (mo < 1 || mo > 12 || da < 1 || da > 31) return null;
  let d = new Date(today0.getFullYear(), mo - 1, da);
  if (d < today0) d = new Date(today0.getFullYear() + 1, mo - 1, da);
  return dayVal(d);
}
const TIME_RULES = [
  [/새벽|첫\s*티|첫\s*팀/, '새벽'],
  [/오전|아침|1\s*부/, '오전'],
  [/오후|점심|낮\s|2\s*부/, '오후'],
  [/야간|저녁|나이트|3\s*부/, '야간'],
  [/아무\s*때|시간\s*(무관|상관\s*없)/, '무관'],
];
const REGION_RULES = [
  ['제주',   /제주도?|서귀포/],
  ['수도권', /수도권|서울|경기\s*(남부|북부)?|인천|용인|이천|여주|가평|포천|파주|양평|안성|화성|남양주|광주시/],
  ['강원',   /강원도?|춘천|홍천|원주|평창|강릉|횡성|정선/],
  ['충청',   /충청도?|충북|충남|대전|세종|천안|청주|충주|음성|진천/],
  ['영남',   /영남|경상도?|경북|경남|부산|대구|울산|경주|김해|창원|양산/],
  ['호남',   /호남|전라도?|전북|전남|무안|순천|여수|해남|담양/],
];
const NUMK = { '한':1, '두':2, '세':3, '네':4 };
const PEOPLE_RULES = [
  [/(\d)\s*(인|명|분)/, m => +m[1]],
  [/(한|두|세|네)\s*(명|분|사람)/, m => NUMK[m[1]]],
  [/(\d)\s*팀/, m => +m[1] * 4],
  [/혼자|솔로/, () => 1],
  [/둘이|부부|커플/, () => 2],
  [/셋이/, () => 3],
  [/넷이|풀\s*팀/, () => 4],
];
const PRICE_RULES = [
  [/(\d{1,2}(?:\.\d)?)\s*~\s*(\d{1,2}(?:\.\d)?)\s*만\s*원?/, m => ({ min:+m[1], max:+m[2], label:`${m[1]}~${m[2]}만원` })],
  [/(\d{1,2})\s*만\s*원?\s*대/, m => ({ min:+m[1], max:+m[1] + 9.5, label:`${m[1]}만원대` })],
  [/(\d{1,2}(?:\.\d)?)\s*만\s*원?\s*(이하|이내|까지|아래|미만|안쪽|밑)/, m => ({ max:+m[1], label:`${m[1]}만원 이하` })],
  [/(\d{1,2}(?:\.\d)?)\s*만\s*원?\s*(이상|넘게|부터)/, m => ({ min:+m[1], label:`${m[1]}만원 이상` })],
  [/(\d{1,2}(?:\.\d)?)\s*만\s*원?/, m => ({ min:+m[1] - 2, max:+m[1] + 2, label:`${m[1]}만원 안팎` })],
  [/저렴|싼\s|싸게|가성비|특가|최저가/, () => ({ label:'특가 위주', max:null, cheap:true })],
];
const OPT_RULES = [
  [/조인/, '조인'],
  [/1\s*박\s*2\s*일|숙박/, '1박2일'],
  [/노\s*캐디/, '노캐디'],
  [/식사|조식|중식/, '식사 포함'],
  [/당장|급구|바로/, '급구'],
];
const BAND_OF_HOUR = h => h <= 6 ? '새벽' : h <= 11 ? '오전' : h <= 16 ? '오후' : '야간';

function parse(text){
  const t = text || '', out = {}, marks = [];
  const mark = (m, f) => marks.push({ s:m.index, e:m.index + m[0].length, f });

  for (const [re, fn] of DATE_RULES){ const m = re.exec(t); if (m){ const v = fn(m); if (v){ out.date = v; mark(m, 'date'); break; } } }

  let band = null;
  for (const [re, b] of TIME_RULES){ const m = re.exec(t); if (m){ band = b; mark(m, 'time'); break; } }
  const hm = /(\d{1,2})\s*시(?!간)/.exec(t);
  if (hm && +hm[1] <= 23){
    let h = +hm[1];
    if (band === '오후' && h < 12) h += 12;
    if (!band) band = (h >= 1 && h <= 4) ? '오후' : BAND_OF_HOUR(h);
    if (band === '오후' && h < 12) h += 12;
    out.time = { band, hour:h, label:`${band} ${h > 12 ? h - 12 : h}시경` };
    mark(hm, 'time');
  } else if (band){ out.time = { band, label: band === '무관' ? '시간 무관' : band }; }

  for (const [key, re] of REGION_RULES){
    const m = re.exec(t);
    if (m){ const w = m[0].replace(/\s+/g,' ').trim(); out.region = { key, label: (w === key || w === key + '도') ? key : `${key} (${w})` }; mark(m, 'region'); break; }
  }
  for (const [re, fn] of PEOPLE_RULES){
    const m = re.exec(t);
    if (m){ const n = fn(m); if (n){ out.people = { n, label: n >= 8 && n % 4 === 0 ? `${n/4}팀 (${n}명)` : `${n}명` }; mark(m, 'people'); break; } }
  }
  for (const [re, fn] of PRICE_RULES){ const m = re.exec(t); if (m){ out.price = fn(m); mark(m, 'price'); break; } }
  const opts = [];
  for (const [re, name] of OPT_RULES){ const m = re.exec(t); if (m){ opts.push(name); mark(m, 'opts'); } }
  if (opts.length) out.opts = opts;

  marks.sort((a, b) => a.s - b.s);
  const clean = []; let last = -1;
  for (const mk of marks){ if (mk.s >= last){ clean.push(mk); last = mk.e; } }
  return { fields: out, marks: clean };
}

function suggestPrice(cond, c, d){
  const wk = d.getDay() === 0 || d.getDay() === 6;

  let normal = c.b + (wk ? 6 : 0) + (band === '야간' ? -4 : band === '새벽' ? -2 : 0);
  let price = Math.round(normal * (0.74 + Math.random() * 0.14) * 2) / 2;

  if (p.max != null && price > p.max) price = Math.max(8, Math.floor((p.max - Math.random() * 2) * 2) / 2);
  if (p.min != null && price < p.min) price = p.min + Math.round(Math.random() * 6) / 2;

  return { price, normal };

}

const SLOTS = {};            // id → 잔여타임
const TAKEN = new Set();     // 이미 예약된 타임
const takenKey = (n, d, tee) => `${n}|${d.toDateString()}|${tee}`;

function aiBlock(c){

  if (c.course && !courseOf(c.course).linked) return '미연동';
  if (o.includes('조인') || n < 3) return '조인';

  }[b];

function aiSearch(c){
  const block = aiBlock(c);
  const key = c.region ? c.region.key : '수도권';
  const pool = c.course ? LINKED.filter(x => x.n === c.course) : LINKED.filter(x => x.key === key);
  if (block) return { block, ok:[], over:[], linked: pool.length };
  const band = c.time ? c.time.band : '무관', n = c.people ? c.people.n : 4, o = c.opts || [];
  const tees = teeOptions(c), soon = Date.now() + 2 * 3600e3, all = [];
  for (const x of pool){
    if (o.includes('노캐디') && !/노캐디/.test(x.caddie)) continue;
    for (const d of c.date.dates.slice(0, 3)){
      const r = rng(x.n + d.toDateString() + band + (c.time && c.time.hour != null ? c.time.hour : ''));
      if (r() < 0.3) continue;
      const tee = tees[Math.floor(r() * tees.length)];
      const [hh, mm] = tee.split(':').map(Number), at = new Date(d); at.setHours(hh, mm, 0, 0);
      if (at < soon || TAKEN.has(takenKey(x.n, d, tee))) continue;
      const wk = d.getDay() === 0 || d.getDay() === 6;
      const normal = x.b + (wk ? 6 : 0) + (band === '야간' ? -4 : band === '새벽' ? -2 : 0);
      const price = Math.round(normal * (0.7 + r() * 0.22) * 2) / 2;
      const perks = [];
      if (r() < 0.5) perks.push('카트비 포함');
      if (o.includes('식사 포함') || r() < 0.2) perks.push('식사 포함');
      const id = `s${x.code}${d.getMonth()+1}${pad(d.getDate())}${tee.replace(':', '')}${n}`;
      all.push(SLOTS[id] = { id, course:x.n, area:x.a, date:d, tee, price, normal: Math.max(normal, price + 1.5), caddie:x.caddie, perks, cancel: cancelLabel(x, d), people:n });

  all.sort((a, b) => a.price - b.price);
  return { block:null, ok: all.filter(fits).slice(0, 3), over: all.filter(s => !fits(s)).slice(0, 1), linked: pool.length };
}
/* 매니저 제안 비교: 예산, 할인율, 요청 옵션 충족, AI 즉시 예약가 대비 */
function aiAssess(r){
  const c = r.cond, p = c.price || {}, o = c.opts || [];
  const aiBest = aiSearch(c).ok[0] || null;
  const notes = {}; let best = null, bestScore = -Infinity;
  for (const x of r.proposals){
    const bits = []; let score = -x.price;
    if (p.max != null){
      if (x.price <= p.max){ if (p.max - x.price >= 0.5) bits.push(`예산보다 ${wonGap(p.max - x.price)} 낮아요`); else bits.push('예산 안'); }
      else { bits.push(`예산 ${wonGap(x.price - p.max)} 초과`); score -= 50; }
    }
    const off = Math.round((1 - x.price / x.normal) * 100);
    if (off >= 10) bits.push(`정상가 대비 -${off}%`);
    if (o.includes('조인') && x.perks.some(k => /조인/.test(k))){ bits.push('조인 자리 확정'); score += 5; }
    if (o.includes('1박2일') && x.perks.some(k => /1박/.test(k))){ bits.push('숙박 포함'); score += 5; }
    if (x.perks.includes('카트비 포함')){ bits.push('카트비 포함'); score += 2; }
    if (aiBest){ const d = aiBest.price - x.price; if (d >= 0.5) bits.push(`AI 즉시 예약가보다 ${wonGap(d)} 싸요`); else if (d <= -0.5) bits.push(`AI 즉시 예약가보다 ${wonGap(-d)} 비싸요`); }
    notes[x.id] = bits.slice(0, 3).join(' · ');
    if (score > bestScore){ bestScore = score; best = x; }

function intake(t, pr, cs){
  const f = Object.assign({}, pr.fields);

  if (f.date && AI.draft.date){ AI.draft = {}; AI.draftText = ''; }
  if (f.region && !f.course) delete AI.draft.course;
  const opts = [...new Set([...(AI.draft.opts || []), ...(f.opts || [])])];
  Object.assign(AI.draft, f); if (opts.length) AI.draft.opts = opts;
  AI.draftText = AI.draftText ? `${AI.draftText} / ${t}` : t;
  if (!AI.draft.date) return say('ai', bubble('접수할게요. 날짜만 알려주시면 연동 골프장 잔여타임을 바로 찾아볼게요.') + saysRow(['오늘', '내일', '이번 주말', '다음 주말']));

  const c = Object.assign({}, AI.draft), def = [];
  if (!c.region){ c.region = { key:'수도권', label:'수도권' }; def.push('region'); }
  if (!c.people){ c.people = { n:4, label:'4명' }; def.push('people'); }
  if (!c.time){ c.time = { band:'무관', label:'시간 무관' }; def.push('time'); }
  const cid = uid('c'); CONDS[cid] = { c, text: AI.draftText }; AI.last = cid;
  const a = aiSearch(c), d0 = c.date.dates[0];
  const no = `R-${pad(d0.getMonth()+1)}${pad(d0.getDate())}-${100 + Math.floor(Math.random() * 900)}`;
  const head = bubble('조건을 접수했어요.' + (def.length ? ' 점선 칩은 기본값으로 채운 거예요. 다르면 말씀해 주세요.' : '')) + card('', '접수 카드', ['p-neu', no], `<div class="chips static">${condChips(c, def)}</div>`);
  const mgrBtn = label => `<button class="btn sm" data-act="to-mgr" data-cid="${cid}">${label}</button>`;
  if (a.block) return say('ai', head + bubble(blockMsg(a.block, c) + ' 조건을 매니저들에게 올려서 30분 동안 제안을 받아볼까요?') + card('', '매니저 제안 받기', ['p-neu', '30분'], '<span>골프탑 매니저들이 비공개 특가, 조인 자리, 패키지를 찾아 제안해요. 제안이 모이면 제가 비교해 드릴게요.</span>', `<button class="btn pri sm" data-act="to-mgr" data-cid="${cid}">매니저들에게 조건 보내기</button>`));

function pickBooking(t, act){

  if (/내일/.test(t)){ const m = act.find(b => sameDay(b.date, TMR)); if (m) return m; }
  if (/주말|토요일|일요일/.test(t)){ const m = act.find(b => b.date.getDay() % 6 === 0); if (m) return m; }
  return act.length === 1 ? act[0] : 'multi';
}

  if (/추천|어디가 ?좋|갈 ?만한|좋은 ?(데|곳|골프장)|골라 ?줘/.test(t) && !pr.fields.date) return recommend(t, pr);
  if (/매니저.{0,6}(보내|올려|요청|맡겨|넘겨)|조건.{0,3}(올려|보내)/.test(t)){
    if (!AI.last) return say('ai', bubble('먼저 조건을 말씀해 주세요. 날짜와 인원만 있으면 접수돼요.'));

  const hasIntake = !!(pr.fields.date || pr.fields.region || pr.fields.time || pr.fields.people || cs), fq = matchFAQ(t);
  if (fq && (isQuestion(t) || !hasIntake)) return say('ai', faqCard(fq));
  if (hasIntake) return intake(t, pr, cs);
  say('ai', bubble('그 부분은 제가 바로 답하기 어려워요. 골프탑 매니저에게 전달해서 30분 안에 채팅으로 답드릴게요. 라운드를 잡으시려면 날짜와 인원을 말씀해 주세요.') + saysRow(['이번 주말 오전 수도권 4명', '도움말']));
}
let busy = false;
function send(voice){

/* ================= AI 매니저: 카드 버튼 ================= */
function onAct(act, el, fromText){
  const d = el.dataset, rc = el.closest ? el.closest('.rc') : null;
  switch (act){
    case 'pick': {
      const s = SLOTS[d.slot]; if (!s) return;
      if (!fromText) say('me', bubble(d.n ? `${d.n}번` : el.textContent.trim()));
      if (TAKEN.has(takenKey(s.course, s.date, s.tee))) return say('ai', bubble('그 타임은 이미 예약됐어요. 다른 타임을 골라 주세요.'));
      return say('ai', bubble(`${s.course} ${md(s.date)} ${s.tee} 타임이에요. 내용을 확인하고 확정을 눌러주세요.`) + confirmCard(s));
    }
    case 'book': say('me', bubble(el.textContent.trim())); return bookSlot(SLOTS[d.slot], { cardEl: rc, wait: d.wait });
    case 'drop': done(rc, 'p-neu', '접음'); return say('ai', bubble('예약을 접었어요. 다른 타임을 찾거나 대기를 걸어둘 수 있어요.') + saysRow(['대기 걸어줘', '매니저들한테 조건 올려줘']));
    case 'wait': {
      const k = CONDS[d.cid]; if (!k) return;
      if (!fromText) say('me', bubble('대기 걸기'));
      if (k.wait && WAITS.some(w => w.id === k.wait)) return say('ai', bubble(`이 조건은 이미 대기 ${k.wait}로 지켜보고 있어요.`));
      const w = addWait(k.c, summary(k.c)); k.wait = w.id;
      return say('ai', waitCard(w));
    }
    case 'to-mgr': if (!fromText) say('me', bubble(el.textContent.trim())); return toManagers(d.cid);
    case 'acc-prop': say('me', bubble('추천 제안으로 예약')); return acceptProposal(S.requests.find(r => r.id === d.rid), d.pid);
    case 'hold-pass': {
      done(rc, 'p-neu', '패스'); say('me', bubble('패스'));
      const w = WAITS.find(x => x.id === d.wait); if (w){ w.st = '감시 중'; renderTrips(); }
      return say('ai', bubble(`패스 처리했어요. 홀드를 풀고 ${d.wait} 대기는 그대로 유지할게요. 더 맞는 타임이 뜨면 다시 알려드릴게요.`));
    }
    case 'wait-cancel': {
      const i = WAITS.findIndex(w => w.id === d.id); if (i < 0) return;
      WAITS.splice(i, 1); renderTrips(); renderBar(); if (S.view === 'status') renderGolfer();
      if (rc) done(rc, 'p-neu', '대기 취소');
      return toast(`${d.id} 대기를 취소했어요.`);
    }
    case 'keep': done(rc, 'p-ok', '유지'); return say('ai', bubble('그대로 둘게요. 취소 시한 30분 전에 한 번 더 알려드릴게요.'));
    case 'cx-yes': {
      const b = bookingById(d.id); if (!b || b.status === '취소') return;
      const free = /무료/.test(b.cancel);
      b.status = '취소'; TAKEN.delete(takenKey(b.course, b.date, b.tee)); renderTrips(); renderBar();
      done(rc, 'p-hot', '취소 완료');
      return say('ai', bubble(`${b.course} ${md(b.date)} ${b.tee} 예약을 취소했어요. ${free ? '시한 전이라 위약은 없어요.' : '시한이 지나 그린피 50% 위약이 골프장 규정대로 청구돼요.'} 골프장에서 취소 확인 문자가 갈 거예요. 다른 타임을 찾아드릴까요?`) + saysRow(['이번 주말 오전 수도권 4명', '다음 주말 오전 수도권 4명']));
    }
    case 'chg': {
      const b = bookingById(d.id); if (!b) return;
      const old = b.tee; TAKEN.delete(takenKey(b.course, b.date, old)); b.tee = d.t; b.price = +d.pr; TAKEN.add(takenKey(b.course, b.date, b.tee)); renderTrips();
      done(rc, 'p-ok', `${old} → ${b.tee}`);
      return say('ai', bubble(`${b.course} ${md(b.date)} 예약을 ${b.tee}로 바꿨어요. 골프장 시스템에 반영됐고 확인 문자가 갈 거예요. 예약번호는 그대로 ${b.id}예요.`) + bookingCard(b));
    }
    case 'ppl': {
      const b = bookingById(d.id); if (!b) return;
      b.people = +d.to; renderTrips(); done(rc, 'p-ok', `${b.people}명으로 변경`);
      return say('ai', bubble(`${b.course} ${md(b.date)} 예약을 ${b.people}명으로 바꿨어요. 골프장에 전달했고 확인 문자가 갈 거예요.`));
    }
    case 'late': {
      const b = bookingById(d.id); done(rc, 'p-wait', `${d.min}분 지연 통보`);
      return say('ai', bubble(`${b ? b.course : '골프장'}에 ${d.min === '30' ? '30분 이상' : d.min + '분'} 지연을 전달했어요. ${d.min === '30' ? '골프장이 티오프를 뒤로 옮길 수 있는지 확인 중이에요. 결과가 오면 바로 알려드릴게요.' : '뒤 팀과 순서를 조정해 둘게요.'}${b ? ` 도착하시면 프론트에 ${b.id}를 말씀해 주세요.` : ''}`));
    }
    case 'attend': case 'weather': case 'd1-cancel': {
      const b = bookingById(d.id); if (!b) return;
      if (act === 'attend'){ b.attend = '참석'; done(rc, 'p-ok', `참석 확인 · ${hhmm()}`); say('me', bubble('참석')); say('ai', bubble(`참석 확인했어요. 골프장에도 전달했어요. 내일 04:00에 출발 확인, 04:30에 날씨 최종 판단 알림을 드릴게요. 도착은 ${teeMinus(b.tee, 40)} 권장이에요.`)); }
      if (act === 'weather'){ b.attend = '날씨'; done(rc, 'p-wait', '날씨 보고 결정 · 04:30 알림'); say('me', bubble('날씨 보고 결정할게요')); say('ai', bubble('알겠어요. 04:30 최종 판단 알림 때 다시 여쭤볼게요. 05:00 전까지는 위약 없이 취소할 수 있어요.')); }
      if (act === 'd1-cancel'){ b.status = '취소'; TAKEN.delete(takenKey(b.course, b.date, b.tee)); done(rc, 'p-hot', '취소 완료'); say('me', bubble('취소')); say('ai', bubble('연장된 시한 전이라 위약 없이 취소했어요. 골프장 시스템에서 예약을 뺐고, 골프장에서 취소 확인 문자가 갈 거예요.')); }
      renderTrips(); renderBar(); return;
    }
  }
}

function perkList(c){

function initDraft(r){

/* AI 초안: 연동 안 된 골프장(매니저만 잡을 수 있는 곳) 우선, AI 즉시 예약가보다 낮게 */
function aiDraft(r){
  const c = r.cond, key = c.region ? c.region.key : '수도권', a = aiSearch(c), p = c.price || {}, o = c.opts || [], n = c.people ? c.people.n : 4;
  const used = r.proposals.map(x => x.course);
  const pool = COURSES[key].filter(x => !INFO[x.n].linked && !used.includes(x.n));
  const course = (c.course && COURSES[key].find(x => x.n === c.course)) || pool[0] || COURSES[key][0];
  let price = suggestPrice(c, course, c.date.dates[0]).price;
  if (a.ok[0]) price = Math.min(price, a.ok[0].price - 1);
  if (p.max != null) price = Math.min(price, p.max - 0.5);
  price = Math.max(8, Math.round(price * 2) / 2);
  const perks = ['카트비 포함'];
  if (o.includes('조인')) perks.push('조인 자리 확정');
  if (o.includes('1박2일')) perks.push('리조트 1박 포함');
  if (o.includes('식사 포함')) perks.push('식사 포함');
  const memo = o.includes('조인') ? `조인 ${Math.max(1, 4 - n)}자리 맞춰둔 팀이에요. 동반자 구력도 비슷하게 확인해 두었습니다.`
    : o.includes('1박2일') ? '리조트 1박과 둘째 날 오전 티타임까지 묶은 패키지예요. 오늘 안에 확정하시면 이 가격 그대로예요.'
    : a.ok[0] ? `AI 즉시 예약가(${won(a.ok[0].price)})보다 낮은 비공개 특가예요. 오늘 안에 확정하시면 이 가격 그대로 잡아드릴게요.`
    : '연동 골프장엔 없는 자리를 골프장과 직접 확인해 잡아둔 타임이에요.';
  S.drafts[r.id] = { course: course.n, di: 0, tee: teeOptions(c)[0], price, perks, memo };
}
$('#cList').addEventListener('input', e => {
  const form = e.target.closest('[data-form]'); if (!form) return;
  const d = S.drafts[form.dataset.form];
  if (e.target.dataset.perk){ const p = e.target.dataset.perk; e.target.checked ? d.perks.push(p) : d.perks.splice(d.perks.indexOf(p), 1); }
  else d[e.target.dataset.k] = e.target.value;
});
$('#cList').addEventListener('click', e => {
  const o = e.target.closest('[data-open]'), x = e.target.closest('[data-cancel]'), s = e.target.closest('[data-submit]'), ad = e.target.closest('[data-aidraft]');
  if (o){ S.open = S.open === o.dataset.open ? null : o.dataset.open; renderManager(); }
  if (x){ S.open = null; renderManager(); }
  if (ad){ aiDraft(S.requests.find(q => q.id === ad.dataset.aidraft)); renderManager(); toast('AI가 초안을 채웠어요. 확인하고 보내세요.'); }
  if (s){
    const r = S.requests.find(q => q.id === s.dataset.submit), d = S.drafts[r.id];
    if (r.status !== 'open'){ toast('이미 마감된 요청이에요.'); S.open = null; renderManager(); return; }
    const price = parseFloat(d.price);
    if (!(price > 0)){ toast('그린피를 입력해 주세요.'); return; }
    const key = r.cond.region ? r.cond.region.key : '수도권', c = COURSES[key].find(q => q.n === d.course);
    const date = r.cond.date.dates[+d.di];
    const normal = Math.max(suggestPrice(r.cond, c, date).normal, price + 2);
    r.proposals.push({ id: uid('p'), mine:true, mgr:{ name:'김태오 매니저', sub:'평균 응답 3분' }, course:c.n, area:c.a, date, tee:d.tee, price, normal, perks: d.perks.length ? d.perks.slice() : ['카트비 별도'], memo:d.memo.trim(), at:Date.now() });
    S.open = null; renderManager();
    if (r.mine){ renderGolfer(); aiOnProposal(r); }
    toast(r.mine ? '제안을 보냈어요. 골퍼 화면에서 확인해 보세요.' : '제안을 보냈어요.');
  }
});
$('#cTabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  S.filter = b.dataset.f; $$('#cTabs button').forEach(x => x.classList.toggle('on', x === b)); renderManager();
};

/* ================= shell ================= */
$('#seg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  S.tab = b.dataset.tab;
  $$('#seg button').forEach(x => x.classList.toggle('on', x === b));
  $('#paneGolfer').classList.toggle('on', S.tab === 'golfer');
  $('#paneManager').classList.toggle('on', S.tab === 'manager');
  if (S.tab === 'manager'){ S.unseen = 0; updateDot(); }
};
function updateDot(){ const d = $('#segDot'); d.hidden = !S.unseen; d.textContent = S.unseen; }
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
function tick(){
  const cd = $('#cd');
  if (cd && S.myReq){ const left = Math.max(0, 30 * 60 - Math.floor((Date.now() - S.myReq.created) / 1000)); cd.textContent = `마감까지 ${pad(Math.floor(left / 60))}:${pad(left % 60)}`; }
  $$('[data-ago]').forEach(el => el.textContent = ago(+el.dataset.ago));
  $$('[data-until]').forEach(el => { const left = Math.max(0, +el.dataset.until - Date.now()), s = Math.floor(left / 1000); el.textContent = left ? `${Math.floor(s / 60)}:${pad(s % 60)}` : '만료'; });
}
setInterval(tick, 1000);

/* ================= boot ================= */
function seedChat(){
  $('#clog').innerHTML = '<div class="dd">오늘</div>';
  say('ai', bubble(`안녕하세요 김지현님, 골프탑 AI 매니저예요. 연동 골프장 ${LINKED.length}곳의 실시간 잔여타임을 보고 있어요. 날짜와 인원을 말씀하시면 바로 잡아드리고, 조인·1박2일·단체처럼 사람 손이 필요한 건 골프탑 매니저들에게 조건을 올려 제안을 받아드려요.`) + tutorialCard(), { tm: hhmm(new Date(Date.now() - 50 * 60000)), silent:true, read:true });
  say('ai', bubble('내일 새벽 라운드 참석 확인 부탁드려요. 비 예보가 있어서 골프장이 무료 취소 시한을 내일 05:00까지 늘려줬어요.') + d1Card(BOOKINGS[0]), { tm: hhmm(new Date(Date.now() - 6 * 60000)), silent:true });
}
S.parsed = parse('');
seedChat();
renderGolfer();
renderTrips();
renderBar();
renderManager();
updateBadges();
</script>
