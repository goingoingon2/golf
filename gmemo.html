      ];

      const handleNext = () => {
        if (currentSlide < slides.length - 1) {
          setCurrentSlide(prev => prev + 1);
        } else {
          onComplete();
        }
      };

      const handleTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
      const handleTouchEnd = (e) => {
        if (!touchStartX.current) return;
        const touchEndX = e.changedTouches[0].clientX;
        const diff = touchStartX.current - touchEndX;
        if (diff > 50 && currentSlide < slides.length - 1) setCurrentSlide(prev => prev + 1);
        else if (diff < -50 && currentSlide > 0) setCurrentSlide(prev => prev - 1);
        touchStartX.current = null;
      };

      return (
        <div className="absolute inset-0 bg-[#fdfcf9] z-[100] flex flex-col justify-between items-center p-8 animate-in fade-in duration-300" onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>

            if (!accountId && !password) {
              window.showToast("비회원(익명)으로 로그인합니다...");
              if (!auth.currentUser) await signInAnonymously(auth);
              onLogin();
            } else {
              if (!accountId || !password) {
                window.showToast("아이디와 비밀번호를 모두 입력하거나, 빈 칸으로 로그인(비회원)해주세요.");
                setIsLoading(false);
                return;
              }
              await signInWithEmailAndPassword(auth, getEmail(accountId), password);
              window.showToast("로그인 성공!");
              onLogin();
            }
          } else {
            if (!accountId || !password || !nickname) {
              window.showToast("모든 항목을 입력해주세요.");
              setIsLoading(false);
              return;
            }
            if (password !== passwordConfirm) {
              window.showToast("비밀번호가 일치하지 않습니다.");
              setIsLoading(false);
              return;
            }
            const userCredential = await createUserWithEmailAndPassword(auth, getEmail(accountId), password);
            await updateProfile(userCredential.user, { displayName: nickname });
            window.showToast("회원가입이 완료되었습니다! 로그인되었습니다.");
            onLogin();
          }
        } catch (error) {
          console.error(error);
          let msg = "오류가 발생했습니다.";
          if (error.code === "auth/invalid-credential" || error.code === "auth/wrong-password" || error.code === "auth/user-not-found") {
            msg = "아이디 또는 비밀번호가 일치하지 않습니다.";
          } else if (error.code === "auth/email-already-in-use") {
            msg = "이미 사용 중인 아이디입니다.";
          } else if (error.code === "auth/weak-password") {
            msg = "비밀번호는 최소 6자리 이상이어야 합니다.";
          } else if (error.code === "auth/invalid-email") {
            msg = "올바른 아이디/이메일 형식이 아닙니다.";
          } else if (error.code === "auth/network-request-failed") {
            msg = "네트워크 오류: 파이어베이스 설정을 확인해주세요.";
          }
          window.showToast(msg);
        } finally {
          setIsLoading(false);
        }
      };

      const handleSocialLogin = (provider) => {
        window.showToast(`${provider} 계정으로 시작합니다.`);
        onLogin();
      };

      const handleGoogleLogin = async () => {
        setIsLoading(true);
        const isCanvas = typeof __firebase_config !== 'undefined';
        if (isCanvas && auth.currentUser) {
            window.showToast("구글 연동 완료! (미리보기 환경)");
            onLogin();
            setIsLoading(false);
            return;
        }

        const provider = new GoogleAuthProvider();
        try {
          await signInWithPopup(auth, provider);
          window.showToast("구글 계정으로 연결되었습니다!");
          onLogin();
        } catch (error) {
          console.error(error);
          if (error.code === "auth/popup-blocked" || error.code === "auth/popup-closed-by-user") {
            window.showToast("로그인 팝업이 차단되었거나 닫혔습니다.");
          } else {
            window.showToast("구글 연동 모드입니다. (임시 통과)");
            onLogin(); // 현재 프리뷰 환경에서 팝업 제약이 있을 수 있어 테스트를 위해 진입을 허용
          }
        } finally {
          setIsLoading(false);

      return (

            <form onSubmit={handleSubmit} className="flex flex-col gap-3">

                  <input type="text" placeholder="사용할 닉네임" value={nickname} onChange={e=>setNickname(e.target.value)} className="w-full pl-12 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl font-bold text-[15px] outline-none focus:ring-2 focus:ring-[#1a4314]/20 focus:border-[#1a4314] transition-all" />
                </div>
              )}
              <div className="relative">
                <Icon name="User" size={20} className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" />
                <input type="text" placeholder="아이디 또는 이메일" value={accountId} onChange={e=>setAccountId(e.target.value)} className="w-full pl-12 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl font-bold text-[15px] outline-none focus:ring-2 focus:ring-[#1a4314]/20 focus:border-[#1a4314] transition-all" />
              </div>
              <div className="relative">
                <Icon name="Lock" size={20} className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" />
                <input type="password" placeholder="비밀번호" value={password} onChange={e=>setPassword(e.target.value)} className="w-full pl-12 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl font-bold text-[15px] outline-none focus:ring-2 focus:ring-[#1a4314]/20 focus:border-[#1a4314] transition-all" />
              </div>
              {!isLoginMode && (
                <div className="relative">
                  <Icon name="Lock" size={20} className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" />
                  <input type="password" placeholder="비밀번호 확인" value={passwordConfirm} onChange={e=>setPasswordConfirm(e.target.value)} className="w-full pl-12 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl font-bold text-[15px] outline-none focus:ring-2 focus:ring-[#1a4314]/20 focus:border-[#1a4314] transition-all" />
                </div>
              )}

              <div className="flex items-center px-1 mt-1 mb-1">
                <label className="flex items-center gap-2 cursor-pointer group select-none">
                  <div className={`w-5 h-5 rounded-md border-2 flex items-center justify-center transition-colors ${keepLoggedIn ? 'bg-[#1a4314] border-[#1a4314]' : 'bg-white border-gray-300 group-hover:border-[#1a4314]'}`}>
                    {keepLoggedIn && <Icon name="Check" size={12} className="text-white font-black" />}

                  <input type="checkbox" checked={keepLoggedIn} onChange={(e)=>setKeepLoggedIn(e.target.checked)} className="hidden" />

                </label>
              </div>

              <button type="submit" disabled={isLoading} className="w-full py-4 bg-[#1a4314] text-white rounded-2xl font-black text-[16px] shadow-lg hover:bg-[#2d6a4f] active:scale-95 transition-all mt-1 flex items-center justify-center gap-2 disabled:opacity-50">
                {isLoading && <Icon name="Loader2" size={16} className="animate-spin" />}
                {isLoginMode ? "로그인 (비회원 가능)" : "회원가입 완료"}
              </button>
            </form>

            <div className="mt-6 mb-6 flex items-center gap-3">
              <div className="flex-1 h-px bg-gray-200"></div>
              <span className="text-[11px] font-extrabold text-gray-400">SNS 계정으로 3초만에 {isLoginMode ? '시작하기' : '가입하기'}</span>
              <div className="flex-1 h-px bg-gray-200"></div>
            </div>

            <div className="flex flex-col gap-2.5">
              <button onClick={() => handleSocialLogin('카카오')} disabled={isLoading} className="w-full flex items-center justify-center gap-2 py-3.5 bg-[#FEE500] text-[#000000] rounded-2xl font-black text-[15px] hover:bg-[#FDD800] active:scale-95 transition-all shadow-sm relative disabled:opacity-50">
                <i className="fa-solid fa-comment absolute left-5 text-xl"></i>
                카카오로 {isLoginMode ? '로그인' : '가입'}
              </button>
              <button onClick={() => handleSocialLogin('네이버')} disabled={isLoading} className="w-full flex items-center justify-center gap-2 py-3.5 bg-[#03C75A] text-white rounded-2xl font-black text-[15px] hover:bg-[#02b351] active:scale-95 transition-all shadow-sm relative disabled:opacity-50">
                <span className="absolute left-5 font-[900] text-xl leading-none font-sans italic">N</span>

              <button onClick={handleGoogleLogin} disabled={isLoading} className="w-full flex items-center justify-center gap-2 py-3.5 bg-white text-gray-700 border border-gray-200 rounded-2xl font-black text-[15px] hover:bg-gray-50 active:scale-95 transition-all shadow-sm relative disabled:opacity-50">
                <i className="fa-brands fa-google absolute left-5 text-xl text-blue-500"></i>

            <div className="mt-8 text-center">

                {isLoginMode ? "아직 계정이 없으신가요? 회원가입" : "이미 계정이 있으신가요? 로그인"}

            </div>
          </div>
          <div className="mt-auto flex justify-center pb-8"><button onClick={onCancel} className="px-6 py-4 w-full bg-[#E2D9C8] text-[#1a4314] font-extrabold rounded-2xl hover:bg-[#d5ccba] shadow-sm">목록으로 돌아가기</button></div>

    function MemoList({ memos, categories, activeCategory, setActiveCategory, isSelectionMode, setIsSelectionMode, selectedMemoIds, setSelectedMemoIds, onOpenDetail, baseFontSize }) {
      const timerRef = useRef(null);
      const isLongPressTriggered = useRef(false);

      const handlePointerDown = (memo) => {
        isLongPressTriggered.current = false;
        if (isSelectionMode) return;
        
        timerRef.current = setTimeout(() => {
          isLongPressTriggered.current = true;
          if ('vibrate' in navigator) navigator.vibrate(50);
          setIsSelectionMode(true);
          setSelectedMemoIds([memo.id]);
        }, 500);
      };

      const handlePointerMove = () => {
        if (timerRef.current) clearTimeout(timerRef.current);
      };

      const handlePointerUp = () => {
        if (timerRef.current) clearTimeout(timerRef.current);
      };

      const handleClick = (memo) => {
        if (isLongPressTriggered.current) return;
        
        if (isSelectionMode) {
          setSelectedMemoIds(prev => prev.includes(memo.id) ? prev.filter(id=>id!==memo.id) : [...prev, memo.id]);
        } else {
          onOpenDetail(memo);
        }
      };

      // 카테고리 배지 클릭 시 필터링 처리
      const handleCategoryClick = (e, category) => {
        e.stopPropagation(); // 카드 클릭(상세보기) 이벤트 방지
        if (activeCategory === category) {
          setActiveCategory("전체"); // 이미 활성화된 상태면 필터 해제
        } else {
          setActiveCategory(category);
        }
      };

      return (
        <div className="flex flex-col gap-4">
          <div className="sticky top-0 z-30 bg-[#E2D9C8]/95 backdrop-blur-md pt-3 pb-3 px-3 -mx-2 mb-2 shadow-sm border-b border-[#d1c9b8]/50 flex flex-col gap-3">
             <div className="flex justify-between items-center px-1">
               <div className="flex items-center gap-2">
                 <p className="text-[11px] text-gray-700 font-extrabold flex items-center gap-1"><Icon name="Edit3" size={12} className="mr-1"/> 길게 누르면 편집!</p>
                 {activeCategory !== "전체" && (
                   <button 
                     onClick={() => setActiveCategory("전체")}
                     className="flex items-center gap-1 text-[11px] font-bold text-white bg-[#1a4314] px-2 py-0.5 rounded-md shadow-sm animate-in zoom-in"
                   >
                     {activeCategory} <Icon name="X" size={10} />
                   </button>
                 )}
               </div>
               {!isSelectionMode && memos.length > 0 && (
                 <button onClick={() => setIsSelectionMode(true)} className="text-[11px] font-extrabold px-3 py-1.5 rounded-lg bg-white border border-[#d1c9b8] text-gray-800 shadow-sm active:scale-95 transition-transform">
                   목록 합치기
                 </button>
               )}
             </div>
          </div>

          <div className="flex flex-col gap-4 pb-24 px-1">
            {memos.length === 0 ? (
              <div className="text-center text-gray-500 mt-10 py-12 bg-white/90 rounded-[24px] border border-dashed border-[#d1c9b8]"><div className="bg-[#E2D9C8] w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3"><Icon name="PenTool" size={24} className="text-[#1a4314]" /></div><p className="font-bold text-[#1a4314]">기록된 메모가 없습니다.</p></div>
            ) : (
              memos.map(memo => (
                <div 
                  key={memo.id} 
                  onPointerDown={() => handlePointerDown(memo)}
                  onPointerMove={handlePointerMove}
                  onPointerUp={handlePointerUp}
                  onPointerCancel={handlePointerMove}
                  onClick={() => handleClick(memo)}
                  onContextMenu={e => e.preventDefault()}
                  style={{ WebkitTouchCallout: 'none', userSelect: 'none' }}
                  className={`bg-[#fdfcf9] rounded-[24px] p-5 shadow-sm border ${isSelectionMode && selectedMemoIds.includes(memo.id) ? 'border-[#1a4314] ring-2 ring-[#1a4314]' : 'border-[#d1c9b8]'} cursor-pointer`}
                >
                  <div className="flex justify-between items-center mb-1">
                    <div className="flex gap-2 items-center">
                       {isSelectionMode && <div className={`w-5 h-5 rounded-md border-2 flex items-center justify-center shrink-0 ${selectedMemoIds.includes(memo.id)?'bg-[#1a4314] border-[#1a4314]':'border-gray-300'}`}>{selectedMemoIds.includes(memo.id) && <Icon name="Check" size={12} className="text-white font-black"/>}</div>}
                       <button 
                         onClick={(e) => handleCategoryClick(e, memo.category)}
                         className={`text-[12px] font-bold px-3 py-1 rounded-full border transition-colors active:scale-95 ${activeCategory === memo.category ? 'bg-[#1a4314] text-white border-[#1a4314]' : 'text-[#1a4314] bg-[#e8f5e9] border-[#a5d6a7] hover:bg-[#c8e6c9]'}`}
                       >
                         {memo.category}
                       </button>
                       {memo.isPinned && <Icon name="Pin" size={14} className="text-amber-600" />}
                    </div>
                    <span className="text-[12px] font-bold text-gray-400">{memo.date}</span>
                  </div>
                  <div className="flex gap-4 items-start mt-2">
                    <div className="flex-1 min-w-0">
                      <p className="text-gray-800 font-medium leading-[1.6] line-clamp-3" style={{ fontSize: `${baseFontSize}px` }} dangerouslySetInnerHTML={{ __html: memo.content.replace(/<[^>]*>?/gm, '').replace(/&nbsp;/g, ' ') }}></p>
                    </div>
                    {(memo.imageUrl || (memo.urls && memo.urls.length > 0)) && (
                      <div className="flex flex-col gap-2 shrink-0">
                        {memo.imageUrl && <img src={memo.imageUrl} className="w-[80px] h-[80px] object-cover rounded-2xl border" />}
                        {memo.urls && memo.urls.map((url, idx) => {
                          const ytId = getYoutubeId(url);
                          const igId = getInstagramId(url);
                          if (igId) {
                            return (
                              <div key={idx} className="relative w-[80px] h-[60px] rounded-[12px] overflow-hidden border border-gray-200 shadow-sm flex flex-col items-center justify-center bg-white">
                                <Icon name="Instagram" size={18} className="text-pink-600 mb-0.5" />
                                <span className="text-[9px] font-extrabold text-gray-700">Instagram</span>
                              </div>
                            );
                          }
                          if (!ytId) return null;
                          return (
                            <div key={idx} className="relative w-[80px] h-[60px] rounded-[12px] overflow-hidden border border-gray-200 shadow-sm bg-black">
                              <img src={`https://img.youtube.com/vi/${ytId}/mqdefault.jpg`} alt="yt-thumb" className="w-full h-full object-cover opacity-80" />
                              <div className="absolute inset-0 flex items-center justify-center">
                                <Icon name="PlayCircle" size={18} className="text-white drop-shadow-md" />
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    function GlobalSearch({ memos, shotMemos, onOpenDetail, onCancel, baseFontSize }) {
      const [query, setQuery] = useState("");

      const myMemos = memos.filter(m => query && m.content.toLowerCase().includes(query.toLowerCase()));

          <div className="flex gap-3 items-start">

              <p className="text-gray-800 font-medium leading-[1.6] line-clamp-2" style={{ fontSize: `${baseFontSize}px` }} dangerouslySetInnerHTML={{ __html: memo.content.replace(/<[^>]*>?/gm, '').replace(/&nbsp;/g, ' ') }}></p>

      const renderShotMemo = (memo) => (

           <div className="flex justify-between items-center mb-1">
             <span className="text-[11px] font-bold text-gray-500">Shot메모</span>
             <span className="text-[11px] text-gray-400 font-bold">{memo.date}</span>
           </div>
           <p className="text-gray-800 font-medium" style={{ fontSize: `${baseFontSize}px` }}>{memo.content}</p>

      return (
        <div className="p-4 flex flex-col h-full bg-[#fdfcf9]">
          <div className="flex items-center gap-3 mb-4 pt-2">
            <button onClick={onCancel} className="text-[#1a4314] p-1"><Icon name="ChevronLeft" size={28}/></button>
            <div className="relative flex-1">

    function TeamDrawGame({ fbUser }) {
      const PHASES = { SETTINGS: 'SETTINGS', WAITING: 'WAITING', SHUFFLE: 'SHUFFLE', DRAW: 'DRAW', RANDOM_JOKER: 'RANDOM_JOKER', RESULT: 'RESULT' };
      const JOKER_OPTIONS = ['사용안함', '랜덤', '이글', '버디', '파', '보기', '더블', '트리플'];
      const RANDOM_JOKER_POOL = ['이글', '버디', '파', '보기', '더블', '트리플'];
      const DEFAULT_PLAYERS = ['타이거 우즈', '로리 맥일로이', '스코티 셔플러', '필 미켈슨'];

      const [phase, setPhase] = useState(PHASES.SETTINGS);
      const localPhaseRef = useRef(phase); 
      
      const [roomDataFound, setRoomDataFound] = useState(null); 
      const [roomId, setRoomId] = useState('');
      const [hostUid, setHostUid] = useState(null);
      const [guestSlots, setGuestSlots] = useState({});
      
      const [players, setPlayers] = useState(['', '', '', '']);
      const [jokerType, setJokerType] = useState('보기');
      
      const [activeSettingMenu, setActiveSettingMenu] = useState(null);
      const [isJokerModalOpen, setIsJokerModalOpen] = useState(false);
      const [isInviteOpen, setIsInviteOpen] = useState(false); 
      const [localJokerSpin, setLocalJokerSpin] = useState('...');

      const [joinedStatus, setJoinedStatus] = useState([false, false, false, false]);
      const [actualRoles, setActualRoles] = useState([]);
      const [selectedCards, setSelectedCards] = useState({});
      const [isShuffling, setIsShuffling] = useState(false);
      const [shufflePositions, setShufflePositions] = useState(Array(5).fill({ x: 0, y: 0, r: 0 }));
      const lastShuffleRef = useRef(0);
      const [finalJokerStroke, setFinalJokerStroke] = useState('');
      const [isSpinningJoker, setIsSpinningJoker] = useState(false);
      const [pickLog, setPickLog] = useState('카드를 선택하세요!');

      const [guestPermissions, setGuestPermissions] = useState({ finishShuffle: true, autoPick: true, nextHole: true });

      const isHostView = Boolean(fbUser && hostUid === fbUser.uid);
      const MY_PLAYER_INDEX = isHostView ? 0 : (guestSlots[fbUser?.uid] !== undefined ? guestSlots[fbUser?.uid] : -1);

      useEffect(() => { localPhaseRef.current = phase; }, [phase]);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const room = params.get('room');
        if (room) setRoomId(room);
        else setRoomDataFound(true);
      }, []);

      useEffect(() => {
        if (!fbUser || !roomId || typeof db === 'undefined') return;
        const roomDoc = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
        
        const unsubscribe = onSnapshot(roomDoc, (snapshot) => {
          if (snapshot.exists()) {
            setRoomDataFound(true);
            const data = snapshot.data();
            const amIHost = fbUser && data.hostUid === fbUser.uid;

            if (localPhaseRef.current !== PHASES.SETTINGS || !amIHost) {
              setPhase(data.phase);
              setPlayers(data.players || ['', '', '', '']); 
              setJokerType(data.jokerType || '보기');
              setGuestPermissions(data.guestPermissions || { finishShuffle: true, autoPick: true, nextHole: true });
            }

            setJoinedStatus(data.joinedStatus || [false,false,false,false]);
            setActualRoles(data.actualRoles || []);
            setSelectedCards(data.selectedCards || {});
            setFinalJokerStroke(data.finalJokerStroke || '');
            setHostUid(data.hostUid);
            setGuestSlots(data.guestSlots || {});
            setIsSpinningJoker(data.isSpinningJoker || false);
            
            if (data.shuffleTrigger && data.shuffleTrigger > lastShuffleRef.current) {
              lastShuffleRef.current = data.shuffleTrigger;
              triggerLocalShuffle(data.shuffleDirection);
            }
          } else {
            setRoomDataFound(false);
          }
        }, (err) => {
          console.error("동기화 에러:", err);
          setRoomDataFound(false);
        });

        return () => unsubscribe();
      }, [fbUser, roomId]);

      useEffect(() => {
        const count = Object.keys(selectedCards).length;
        if (count === 0) setPickLog('가장 먼저 카드를 선점하세요!');
        else if (count === 4) setPickLog('✅ 모든 선택이 완료되었습니다!');
        else setPickLog(`💬 ${count}/4 명 선택 완료 (남은 카드를 고르세요)`);
      }, [selectedCards]);

      useEffect(() => {
        let interval;
        if (phase === PHASES.RANDOM_JOKER && isSpinningJoker) {
          let spinCount = 0;
          interval = setInterval(() => {
            setLocalJokerSpin(RANDOM_JOKER_POOL[spinCount % RANDOM_JOKER_POOL.length]);
            spinCount++;
          }, 100);
        }
        return () => clearInterval(interval);
      }, [phase, isSpinningJoker]);

      const updateRoomState = async (updates) => {
        if (!roomId || typeof db === 'undefined') return;
        try {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId), updates);
        } catch (err) {
            console.error("Room Sync Error:", err);
            window.showToast("오류: Firestore Database 권한이 거부되었습니다.");
        }
      };

      const goToSettings = () => setPhase(PHASES.SETTINGS);

      const goHome = () => {
        try { window.history.pushState({}, '', window.location.pathname); } catch(e) {}
        setRoomId('');
        setRoomDataFound(true);
        setPhase(PHASES.SETTINGS);
        setHostUid(null);
        setGuestSlots({});
        setSelectedCards({});
        setJoinedStatus([false, false, false, false]);
        setIsInviteOpen(false);
        setGuestPermissions({ finishShuffle: true, autoPick: true, nextHole: true });
        setActiveSettingMenu(null);
        setPlayers(['', '', '', '']); 
      };

      const resumeGame = () => {
        const finalPlayers = players.map((p, idx) => p.trim() !== '' ? p.trim() : DEFAULT_PLAYERS[idx]);
        let roles = jokerType === '사용안함' ? ['R', 'R', 'B', 'B'] : (() => {
          const s = Math.random() > 0.5 ? 'R' : 'B';
          const f = s === 'R' ? 'B' : 'R';
          return [f, f, s, 'J'];
        })();

        updateRoomState({
          players: finalPlayers, jokerType, guestPermissions, phase: PHASES.SHUFFLE,
          actualRoles: roles.sort(() => Math.random() - 0.5), selectedCards: {},
          finalJokerStroke: jokerType === '랜덤' ? '' : jokerType, isSpinningJoker: false, shuffleTrigger: 0
        });
        
        setPlayers(finalPlayers);
        setPhase(PHASES.SHUFFLE);
      };

      const createRoom = async () => {
        if (!fbUser) return window.showToast('⚠️ 서버 접속 중입니다. 잠시 후 다시 시도해주세요.');

        const newRoomId = Math.random().toString(36).substring(2, 8).toUpperCase();
        const finalPlayers = players.map((p, idx) => p.trim() !== '' ? p.trim() : DEFAULT_PLAYERS[idx]);
        
        try {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', newRoomId), {
              hostUid: fbUser.uid, phase: PHASES.WAITING, players: finalPlayers, jokerType, joinedStatus: [true, false, false, false],
              guestSlots: {}, actualRoles: [], selectedCards: {}, finalJokerStroke: '', isSpinningJoker: false, shuffleTrigger: 0,
              guestPermissions
            });
            setPlayers(finalPlayers);
            try { window.history.pushState({}, '', `?room=${newRoomId}`); } catch(e) {}
            setRoomId(newRoomId);
            setPhase(PHASES.WAITING); 
            setIsInviteOpen(true);
        } catch (err) {
            console.error("방 생성 실패:", err);
            window.showToast("오류: Firestore 권한 부족. 파이어베이스 규칙을 확인하세요.");
        }
      };

      const toggleJoin = (index) => {
        if (!fbUser) return;
        const slots = { ...guestSlots };
        const newStatus = [...joinedStatus];
        if (isHostView) {
          if (index === 0) return;
          newStatus[index] = !newStatus[index];
          updateRoomState({ joinedStatus: newStatus });
        } else {
          if (slots[fbUser.uid] === index) { newStatus[index] = false; delete slots[fbUser.uid]; }
          else { if (newStatus[index]) return; if (slots[fbUser.uid] !== undefined) newStatus[slots[fbUser.uid]] = false; newStatus[index] = true; slots[fbUser.uid] = index; }
          updateRoomState({ joinedStatus: newStatus, guestSlots: slots });
        }
      };

      const startGame = async () => {
        if (!isHostView && !guestPermissions.nextHole) return;
        let roles = jokerType === '사용안함' ? ['R', 'R', 'B', 'B'] : (() => {
          const s = Math.random() > 0.5 ? 'R' : 'B';
          const f = s === 'R' ? 'B' : 'R';
          return [f, f, s, 'J'];
        })();
        await updateRoomState({ phase: PHASES.SHUFFLE, actualRoles: roles.sort(() => Math.random() - 0.5), selectedCards: {}, finalJokerStroke: jokerType === '랜덤' ? '' : jokerType, isSpinningJoker: false, shuffleTrigger: 0 });
      };

      const shuffleDeck = (dir) => updateRoomState({ shuffleTrigger: Date.now(), shuffleDirection: dir });

      const triggerLocalShuffle = (direction) => {
        setIsShuffling(direction);
        let count = 0;
        const interval = setInterval(() => {
          setShufflePositions(Array.from({length:5}).map(() => ({ x: (Math.random()-0.5)*60+(direction==='left'?-80:80), y:(Math.random()-0.5)*60, r:(Math.random()-0.5)*180+(direction==='left'?-90:90) })));
          if (++count > 8) { clearInterval(interval); setShufflePositions(Array(5).fill({x:0,y:0,r:0})); setIsShuffling(false); }
        }, 100);
      };

      const selectCard = (cardIndex) => {
        if (selectedCards[cardIndex] !== undefined || Object.keys(selectedCards).length >= 4) return;
        if (MY_PLAYER_INDEX === -1) return; 

        const pickedIdxs = Object.values(selectedCards).map(c => c.playerIndex);
        if (pickedIdxs.includes(MY_PLAYER_INDEX)) return; 

        const pickOrder = Object.keys(selectedCards).length;
        const newSelected = { ...selectedCards, [cardIndex]: { playerIndex: MY_PLAYER_INDEX, player: players[MY_PLAYER_INDEX], role: actualRoles[pickOrder] } };
        updateRoomState({ selectedCards: newSelected });
      };

      const autoPickRemaining = () => {
        if (!isHostView && !guestPermissions.autoPick) return;
        const pickedPlayers = Object.values(selectedCards).map(c => c.playerIndex);
        const unpickedPlayers = [0, 1, 2, 3].filter(idx => !pickedPlayers.includes(idx));
        
        const pickedCards = Object.keys(selectedCards).map(Number);
        const unpickedCards = [0, 1, 2, 3, 4].filter(idx => !pickedCards.includes(idx));
        
        const newSelected = { ...selectedCards };
        let currentPickOrder = Object.keys(selectedCards).length;
        
        const shuffledUnpickedCards = [...unpickedCards].sort(() => Math.random() - 0.5);

        unpickedPlayers.forEach(playerIdx => {
          const cardIndex = shuffledUnpickedCards.pop();
          newSelected[cardIndex] = {
            playerIndex: playerIdx,
            player: players[playerIdx],
            role: actualRoles[currentPickOrder]
          };
          currentPickOrder++;
        });

        updateRoomState({ selectedCards: newSelected, phase: PHASES.RESULT });
      };

      const finishShuffle = () => (isHostView || guestPermissions.finishShuffle) && updateRoomState({ phase: PHASES.DRAW });
      const revealTeams = () => (isHostView || guestPermissions.autoPick) && updateRoomState({ phase: PHASES.RESULT });
      
      const executeRandomJoker = () => {
        const jokerCard = Object.values(selectedCards).find(c => c.role === 'J');
        const canExecute = isHostView || (jokerCard && jokerCard.playerIndex === MY_PLAYER_INDEX);
        if (!canExecute) return;
        
        updateRoomState({ isSpinningJoker: true, phase: PHASES.RANDOM_JOKER });
        setTimeout(() => {
          const final = RANDOM_JOKER_POOL[Math.floor(Math.random() * RANDOM_JOKER_POOL.length)];
          updateRoomState({ finalJokerStroke: final, isSpinningJoker: false, phase: PHASES.RESULT });
        }, 2000);
      };

      const nextHole = () => startGame();

      const handleCopyUrl = () => {
        const url = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
        const el = document.createElement('textarea'); el.value = url; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
        window.showToast('초대 URL이 복사되었습니다!'); setIsInviteOpen(false);
      };

      const getCardStyle = (role, jokerTeam = null) => {
        if (role === 'R') return 'bg-red-500 text-white shadow-lg border-2 border-red-600';
        if (role === 'B') return 'bg-blue-500 text-white shadow-lg border-2 border-blue-600';
        if (role === 'J') {
          if (jokerTeam === 'R') return 'bg-red-500 text-white border-4 border-yellow-400';
          if (jokerTeam === 'B') return 'bg-blue-500 text-white border-4 border-yellow-400';
          return 'bg-purple-600 text-white border-2 border-purple-700';
        }
        return 'bg-[#E2D9C8] text-[#1a4314]';
      };

      if (roomId && roomDataFound === null) return <div className="min-h-full bg-[#fdfcf9] flex items-center justify-center text-[#1a4314]"><Icon name="Loader2" className="w-10 h-10 animate-spin" /></div>;
      if (roomId && roomDataFound === false) return <div className="min-h-full bg-[#fdfcf9] flex flex-col items-center justify-center text-gray-800 p-6 text-center"><Icon name="X" className="w-16 h-16 text-red-500 mb-4" /><h2 className="text-2xl font-black mb-2 text-[#1a4314]">방을 찾을 수 없습니다.</h2><button onClick={goHome} className="bg-[#1a4314] text-white px-6 py-3 rounded-xl font-bold mt-4 shadow-sm hover:bg-[#2d6a4f]">새 방 만들기</button></div>;

      return (
        <div className="w-full h-full mx-auto min-h-full pb-[env(safe-area-inset-bottom)] bg-[#fdfcf9] overflow-x-hidden relative flex flex-col">
          {phase !== PHASES.SETTINGS && roomId && (
            <div className="absolute top-4 left-4 z-40 pointer-events-none">
              {isHostView ? (
                <span className="bg-yellow-400 text-yellow-900 text-[10px] font-black px-3 py-1.5 rounded-full shadow-md border border-yellow-300">👑 방장 모드</span>
              ) : (
                <span className="bg-white text-gray-700 text-[10px] font-black px-3 py-1.5 rounded-full shadow-md border border-gray-200">👤 참여자 모드</span>
              )}
            </div>
          )}

          {phase !== PHASES.SETTINGS && roomId && isHostView && (
            <div className="absolute top-4 right-4 z-40">
              <button onClick={goToSettings} className="p-2 bg-white text-gray-700 hover:bg-gray-100 rounded-full shadow-md border border-[#d1c9b8] transition-all active:scale-95" title="설정으로 가기">
                <Icon name="Settings" size={18} />
              </button>
            </div>
          )}

          {/* 1. SETTINGS 화면 (방 만들기) */}
          {phase === PHASES.SETTINGS && (
            <div className="p-5 pt-10 animate-in fade-in flex-1 overflow-y-auto">
              <div className="text-center mb-10">
                <h1 className="text-[32px] font-black text-[#1a4314] tracking-tighter mb-2">⛳ 골프 팀 뽑기</h1>
                <p className="text-[13px] font-bold text-gray-500 break-keep">실시간 온라인 멀티플레이 팀 정하기</p>
              </div>
              <div className="bg-white rounded-[24px] p-5 shadow-sm mb-6 border border-[#d1c9b8]">
                <h2 className="text-[14px] font-black text-gray-800 mb-2 flex items-center gap-2"><Icon name="Users" size={16} /> 플레이어 (4명)</h2>
                <p className="text-[11px] font-bold text-gray-400 mb-4 tracking-tight break-keep">
                  * 선수 이름을 눌러 실제 플레이어들의 이름으로 변경해주세요.
                </p>
                <div className="space-y-3">
                  {players.map((player, idx) => (
                    <div key={idx} className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-full bg-[#e8f5e9] text-[#1a4314] border border-[#a5d6a7] flex items-center justify-center font-black text-sm shrink-0">{idx + 1}</div>
                      <div className="relative flex-1">
                        <input 
                          type="text" 
                          value={player} 
                          onChange={(e) => { const n = [...players]; n[idx] = e.target.value; setPlayers(n); }} 
                          className={`w-full p-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#1a4314]/20 focus:border-[#1a4314] outline-none transition font-bold text-gray-800 placeholder-gray-400 text-[15px] ${idx === 0 ? 'pr-10 border-yellow-400 bg-yellow-50 focus:border-yellow-500' : ''}`} 
                          placeholder={DEFAULT_PLAYERS[idx]} 
                        />
                        {idx === 0 && <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"><Icon name="Crown" size={20} className="text-yellow-500" /></div>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="flex gap-3 mb-6">
                <button 
                  onClick={() => setActiveSettingMenu(prev => prev === 'JOKER' ? null : 'JOKER')}
                  className={`flex-1 p-4 rounded-[20px] shadow-sm border transition-all flex flex-col items-center gap-2.5 active:scale-[0.98] ${activeSettingMenu === 'JOKER' ? 'bg-[#f3e8ff] border-[#d8b4fe] ring-2 ring-purple-200' : 'bg-white border-[#d1c9b8] hover:bg-gray-50'}`}
                >
                  <span className="text-[14px] font-black text-gray-800 flex items-center gap-1.5">🃏 조커 설정</span>
                  <span className="text-[12px] font-black text-purple-600 bg-white border border-purple-200 px-3 py-1 rounded-full shadow-sm">{jokerType}</span>
                </button>
                
                <button 
                  onClick={() => setActiveSettingMenu(prev => prev === 'PERMISSIONS' ? null : 'PERMISSIONS')}
                  className={`flex-1 p-4 rounded-[20px] shadow-sm border transition-all flex flex-col items-center gap-2.5 active:scale-[0.98] ${activeSettingMenu === 'PERMISSIONS' ? 'bg-[#e8f5e9] border-[#a5d6a7] ring-2 ring-[#1a4314]/20' : 'bg-white border-[#d1c9b8] hover:bg-gray-50'}`}
                >
                  <span className="text-[14px] font-black text-gray-800 flex items-center gap-1.5"><Icon name="Check" size={16} className="text-[#1a4314]"/> 동반자 권한</span>
                  <span className="text-[12px] font-black text-[#1a4314] bg-white border border-[#a5d6a7] px-3 py-1 rounded-full shadow-sm">
                    {Object.values(guestPermissions).filter(Boolean).length}개 허용
                  </span>
                </button>
              </div>

              {activeSettingMenu && (
                <div className="bg-white rounded-[24px] p-5 shadow-sm mb-8 border border-[#d1c9b8] animate-in fade-in slide-in-from-top-2">
                  {activeSettingMenu === 'JOKER' && (
                    <div>
                      <div className="grid grid-cols-4 gap-2 mb-4">
                        {JOKER_OPTIONS.map((opt) => (
                          <button key={opt} onClick={() => setJokerType(opt)} className={`py-2.5 text-[13px] rounded-xl border transition-all font-bold active:scale-[0.98] ${jokerType === opt ? 'bg-purple-600 text-white border-purple-600 shadow-md' : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100'}`}>{opt}</button>
                        ))}
                      </div>
                      <div className="p-3.5 bg-gray-50 rounded-xl text-[12px] font-medium text-gray-500 leading-relaxed break-keep border border-gray-200">
                        <span className="font-bold text-gray-700">💡 조커 활용법</span><br/>
                        * 조커로 뽑힌 플레이어는 인원이 부족한 팀에 자동 배치됩니다.<br/>
                        * 적용 타수: 팀 승패 계산 시 실제 타수와 무관하게 선택한 타수가 적용됩니다.
                      </div>
                    </div>
                  )}

                  {activeSettingMenu === 'PERMISSIONS' && (
                    <div>
                      <p className="text-[12px] font-medium text-gray-500 mb-4 tracking-tight break-keep">
                        * 체크 시 동반자(참여자) 화면에서도 버튼이 활성화되어 게임을 진행할 수 있습니다.
                      </p>
                      <div className="space-y-4">
                        <label className="flex items-center gap-3 cursor-pointer p-2 hover:bg-gray-50 rounded-xl transition">
                          <input type="checkbox" checked={guestPermissions.finishShuffle} onChange={(e) => setGuestPermissions(p => ({...p, finishShuffle: e.target.checked}))} className="w-5 h-5 accent-[#1a4314] cursor-pointer" />
                          <span className="text-[14px] text-gray-800 font-bold">패 섞기 완료 권한</span>
                        </label>
                        <label className="flex items-center gap-3 cursor-pointer p-2 hover:bg-gray-50 rounded-xl transition">
                          <input type="checkbox" checked={guestPermissions.autoPick} onChange={(e) => setGuestPermissions(p => ({...p, autoPick: e.target.checked}))} className="w-5 h-5 accent-[#1a4314] cursor-pointer" />
                          <span className="text-[14px] text-gray-800 font-bold">남은 동반자 카드 선택 (결과 확인) 권한</span>
                        </label>
                        <label className="flex items-center gap-3 cursor-pointer p-2 hover:bg-gray-50 rounded-xl transition">
                          <input type="checkbox" checked={guestPermissions.nextHole} onChange={(e) => setGuestPermissions(p => ({...p, nextHole: e.target.checked}))} className="w-5 h-5 accent-[#1a4314] cursor-pointer" />
                          <span className="text-[14px] text-gray-800 font-bold">다음 홀 이동 권한</span>
                        </label>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {roomId ? (
                <div className="flex gap-3 mt-auto pt-4">
                  <button onClick={goHome} className="flex-1 bg-[#E2D9C8] text-[#1a4314] font-black py-4 rounded-2xl shadow-sm hover:bg-[#d5ccba] transition active:scale-[0.98] text-[15px] border border-[#d1c9b8]">새 방 만들기</button>
                  <button onClick={resumeGame} className="flex-1 bg-[#1a4314] text-white font-black py-4 rounded-2xl shadow-lg hover:bg-[#2d6a4f] transition active:scale-[0.98] text-[15px]">게임 계속하기</button>
                </div>
              ) : (
                <button onClick={createRoom} className="w-full bg-[#1a4314] text-white font-black py-4 rounded-2xl shadow-lg hover:bg-[#2d6a4f] transition active:scale-[0.98] text-[16px] mt-auto mb-4">방 만들기</button>
              )}
            </div>
          )}

          {/* 2. WAITING 화면 (대기실) */}
          {phase === PHASES.WAITING && (
            <div className="min-h-full flex flex-col p-5 animate-in fade-in flex-1">
              <div className="bg-[#1a4314] text-white p-6 rounded-[24px] shadow-lg text-center mb-8 relative mt-8">
                {roomId && <span className="absolute top-3 right-5 text-[11px] font-bold opacity-80">Room: {roomId}</span>}
                <h1 className="text-[26px] font-black mb-1">라운드 대기실</h1>
                <p className="text-[12px] font-medium opacity-90">{isHostView ? '인원이 다 모이지 않아도 방장은 바로 시작할 수 있습니다.' : '본인 자리를 선택하세요.'}</p>
              </div>
              
              {isHostView && (
                <button onClick={() => setIsInviteOpen(true)} className="w-full bg-white border-2 border-[#1a4314] text-[#1a4314] font-black py-3.5 rounded-2xl mb-8 flex items-center justify-center gap-2 shadow-sm active:scale-[0.98] transition-transform">
                  <Icon name="QrCode" size={20} /> 방 초대하기
                </button>
              )}
              
              <div className="grid grid-cols-2 gap-4 flex-1 content-start">
                {players.map((p, i) => {
                  const joined = joinedStatus[i];
                  const mine = i === MY_PLAYER_INDEX;
                  
                  let cardStyle = "border-dashed border-[#d1c9b8] bg-[#fdfcf9] opacity-70";
                  let iconBg = "bg-[#E2D9C8] text-gray-400";
                  let badgeStyle = "bg-gray-200 text-gray-500";
                  let statusText = "대기 중";

                  if (joined) {
                    if (mine) {
                      cardStyle = "border-2 border-[#1a4314] bg-[#e8f5e9] shadow-md ring-2 ring-[#1a4314]/20";
                      iconBg = "bg-[#1a4314] text-white";
                      badgeStyle = "bg-[#1a4314] text-white";
                      statusText = "내 자리";
                    } else {
                      cardStyle = "border border-gray-300 bg-white opacity-100 shadow-sm border-dashed";
                      iconBg = "bg-gray-100 text-gray-300";
                      badgeStyle = "bg-gray-100 text-gray-500";
                      statusText = i === 0 ? "방장" : "대기 중";
                    }
                  }

                  return (
                    <div key={i} onClick={() => toggleJoin(i)} className={`relative p-5 rounded-3xl flex flex-col items-center justify-center gap-3 transition-all cursor-pointer active:scale-95 ${cardStyle}`}>
                      <div className={`w-14 h-14 rounded-full flex items-center justify-center shadow-sm transition-colors ${iconBg}`}><Icon name="Check" size={26} /></div>
                      <span className="font-black text-[15px] text-gray-800">{p}</span>
                      <span className={`text-[11px] font-bold px-3 py-1.5 rounded-full transition-colors ${badgeStyle}`}>{statusText}</span>
                    </div>
                  );
                })}
              </div>
              
              <div className="mt-8 flex gap-3 mb-4">
                {isHostView ? (
                  <button onClick={startGame} className="w-full font-black text-[16px] py-4 rounded-2xl shadow-lg transition-all bg-[#1a4314] text-white hover:bg-[#2d6a4f] active:scale-[0.98]">게임 시작하기</button>
                ) : (
                  <div className="w-full bg-[#E2D9C8] text-[#1a4314] text-center py-4 rounded-2xl font-black text-[15px] border border-[#d1c9b8]">방장이 시작하기를 기다리는 중...</div>
                )}
              </div>
            </div>
          )}

          {/* 3. SHUFFLE 화면 (패 섞기) */}
          {phase === PHASES.SHUFFLE && (
            <div className="min-h-full bg-[#fdfcf9] text-gray-900 flex flex-col p-6 animate-in fade-in relative overflow-hidden flex-1">
              <h2 className="text-center text-[24px] font-black mb-1 mt-8 text-[#1a4314]">패 섞기 (기리)</h2>
              <p className="text-center text-gray-500 font-bold text-[12px] mb-6">방장이 아니더라도 누구나 섞을 수 있습니다.</p>
              
              {isHostView ? (
                <button 
                  onClick={() => setIsJokerModalOpen(true)}

    // === [Metronome Component & Helpers] ===
    const MetroActivity = ({ size, className }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>;
    const MetroBell = ({ size, className }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>;
    const MetroMessageSquare = ({ size, className }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
    const MetroClock = ({ size, className }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>;
    const MetroSave = ({ size, className }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
    const MetroBookmark = ({ size, className }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>;
    const MetroPlus = ({ size, className }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const MetroX = ({ size, className }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const MetroPlay = ({ size, fill, className }) => <svg width={size} height={size} viewBox="0 0 24 24" fill={fill || "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"/></svg>;
    const MetroSquare = ({ size, fill, className }) => <svg width={size} height={size} viewBox="0 0 24 24" fill={fill || "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>;

    const polarToCartesian = (centerX, centerY, radius, angleInDegrees) => {
      const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
      return { x: centerX + (radius * Math.cos(angleInRadians)), y: centerY + (radius * Math.sin(angleInRadians)) };
    };

    const describeArc = (x, y, radius, startAngle, endAngle) => {
      const start = polarToCartesian(x, y, radius, endAngle);
      const end = polarToCartesian(x, y, radius, startAngle);
      const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
      return [ "M", start.x, start.y, "A", radius, radius, 0, largeArcFlag, 0, end.x, end.y ].join(" ");
    };

    const DEFAULT_METRO_PHRASES = [
      { id: 'd1', name: '짬-뽕', beats: 2, labels: ['짬', '뽕'], isDefault: true, lastUsed: 99 },
      { id: 'd2', name: '똑-딱', beats: 2, labels: ['똑', '딱'], isDefault: true }, 
      { id: 'd3', name: '하-나', beats: 2, labels: ['하', '나'], isDefault: true },
      { id: 'd4', name: '백-스윙', beats: 2, labels: ['백', '스윙'], isDefault: true },
      { id: 'd9', name: '머리-고정', beats: 2, labels: ['머리', '고정'], isDefault: true, lastUsed: 95 },
      { id: 'd10', name: '체중-이동', beats: 2, labels: ['체중', '이동'], isDefault: true },
      { id: 'd11', name: '힘을-빼자', beats: 2, labels: ['힘을', '빼자'], isDefault: true },
      { id: 'd16', name: '손목-유지', beats: 2, labels: ['손목', '유지'], isDefault: true },
      
      { id: 'd0', name: '골프-메트로-놈', beats: 3, labels: ['골프', '메트로', '놈'], isDefault: true, lastUsed: 105 },
      { id: 'd5', name: '짜-장-면', beats: 3, labels: ['짜', '장', '면'], isDefault: true, lastUsed: 100 },
      { id: 'd6', name: '에-델-바이스', beats: 3, labels: ['에', '델', '바이스'], isDefault: true },
      { id: 'd7', name: '백-스-윙', beats: 3, labels: ['백', '스', '윙'], isDefault: true },
      { id: 'd8', name: '원-투-쓰리', beats: 3, labels: ['원', '투', '쓰리'], isDefault: true },
      { id: 'd12', name: '머-리-고정', beats: 3, labels: ['머', '리', '고정'], isDefault: true },
      { id: 'd13', name: '체-중-이동', beats: 3, labels: ['체', '중', '이동'], isDefault: true },
      { id: 'd14', name: '부-드-럽게', beats: 3, labels: ['부', '드', '럽게'], isDefault: true },
      { id: 'd15', name: '끝-까-지', beats: 3, labels: ['끝', '까', '지'], isDefault: true },
      { id: 'd17', name: '몸으로-팔을-던져', beats: 3, labels: ['몸으로', '팔을', '던져'], isDefault: true },
      { id: 'd18', name: '하체-리드-스윙', beats: 3, labels: ['하체', '리드', '스윙'], isDefault: true },
      { id: 'd19', name: '헤드를-똑바로-보내', beats: 3, labels: ['헤드를', '똑바로', '보내'], isDefault: true, lastUsed: 96 },
      { id: 'd20', name: '팔-은-아래로만', beats: 3, labels: ['팔', '은', '아래로만'], isDefault: true, lastUsed: 98 },
    ];

    const BASE_METRO_RHYTHMS = {
      TWO_FOUR: { id: 'base-2', name: '2박자 (기본)', beats: 2, labels: ['시작', '2'] },
      THREE_FOUR: { id: 'base-3', name: '3박자 (기본)', beats: 3, labels: ['시작', '2', '3'] },
    };

    function MetronomeMain() {
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentRhythm, setCurrentRhythm] = useState({ ...DEFAULT_METRO_PHRASES.find(p => p.name === '골프-메트로-놈') }); 
      const [activeBeat, setActiveBeat] = useState(-1);
      const [soundMode, setSoundMode] = useState('metronome'); 
      
      const [isModalOpen, setIsModalOpen] = useState(false); 
      const [alertMessage, setAlertMessage] = useState(''); 
      const [deletingId, setDeletingId] = useState(null); 
      const [confirmDialog, setConfirmDialog] = useState(null); 

      const [bpmPresets, setBpmPresets] = useState(() => {
        const saved = localStorage.getItem('golfMetronomeBpmPresets');
        return saved ? JSON.parse(saved) : [40, 50, 60, 70, 80];
      });
      
      const [activePresetIndex, setActivePresetIndex] = useState(2);
      const [bpm, setBpm] = useState(bpmPresets[2] || 60); 

      const [editingPresetIndex, setEditingPresetIndex] = useState(null);
      const presetPressTimer = useRef(null);
      const isPresetLongPressed = useRef(false);
      const longPressTimer = useRef(null);
      const isLongPressed = useRef(false);
      const knobSvgRef = useRef(null);

      const [savedPhrases, setSavedPhrases] = useState(() => {
        const saved = localStorage.getItem('golfMetronomePhrases');
        if (saved) {
          try { 
            const parsed = JSON.parse(saved); 
            const customPhrases = parsed.filter(p => !p.isDefault);
            const mergedDefaults = DEFAULT_METRO_PHRASES.map(dp => {
              const savedDp = parsed.find(p => p.id === dp.id);
              return savedDp ? { ...dp, lastUsed: savedDp.lastUsed || dp.lastUsed, isDeleted: savedDp.isDeleted } : dp;
            });
            return [...mergedDefaults, ...customPhrases];
          } catch (e) { 
            return DEFAULT_METRO_PHRASES; 
          }
        }
        return DEFAULT_METRO_PHRASES;
      });

      const soundModeRef = useRef(soundMode);
      const bpmRef = useRef(bpm);
      const rhythmRef = useRef(currentRhythm);

      useEffect(() => { soundModeRef.current = soundMode; }, [soundMode]);
      useEffect(() => { bpmRef.current = bpm; }, [bpm]);
      useEffect(() => { rhythmRef.current = currentRhythm; }, [currentRhythm]);

      useEffect(() => { localStorage.setItem('golfMetronomePhrases', JSON.stringify(savedPhrases)); }, [savedPhrases]);
      useEffect(() => { localStorage.setItem('golfMetronomeBpmPresets', JSON.stringify(bpmPresets)); }, [bpmPresets]);

      const audioCtxRef = useRef(null);
      const nextNoteTimeRef = useRef(0);
      const currentBeatRef = useRef(0);
      const timerIdRef = useRef(null);
      const isPlayingRef = useRef(false);

      const lookahead = 25.0; 
      const scheduleAheadTime = 0.1; 

      const initAudioAndVoice = () => {
        if (!audioCtxRef.current) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtxRef.current = new AudioContext();
        }
        if (audioCtxRef.current.state === 'suspended') {
          audioCtxRef.current.resume();
        }
        if ('speechSynthesis' in window) {
          const dummyUtterance = new SpeechSynthesisUtterance('');
          window.speechSynthesis.speak(dummyUtterance);
        }
      };

      const speakText = (text, currentBpm) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        
        let textToSpeak = text;
        if (text === '2') textToSpeak = '둘';
        if (text === '3') textToSpeak = '셋';

        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'ko-KR'; 
        utterance.rate = Math.min(2.5, Math.max(1.0, currentBpm / 60)); 
        utterance.pitch = 1.1;

        window.speechSynthesis.speak(utterance);
      };

      const playClick = (time, isAccent, mode) => {
        if (!audioCtxRef.current) return;
        const osc = audioCtxRef.current.createOscillator();
        const gainNode = audioCtxRef.current.createGain();

        if (mode === 'metronome') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(isAccent ? 1200 : 800, time);
          osc.frequency.exponentialRampToValueAtTime(isAccent ? 600 : 400, time + 0.02);
          
          osc.connect(gainNode);
          gainNode.connect(audioCtxRef.current.destination);

          const currentVol = isAccent ? 0.7 : 0.4;
          gainNode.gain.setValueAtTime(currentVol, time);
          gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.03); 

          osc.start(time);
          osc.stop(time + 0.04);
        } else {
          osc.type = 'sine';
          osc.frequency.value = isAccent ? 1000 : 800;
          osc.connect(gainNode);
          gainNode.connect(audioCtxRef.current.destination);

          const currentVol = isAccent ? 0.8 : 0.4;
          gainNode.gain.setValueAtTime(currentVol, time);
          gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.1);

          osc.start(time);
          osc.stop(time + 0.1);
        }
      };

      const nextNote = useCallback(() => {
        const secondsPerBeat = 60.0 / bpmRef.current;
        nextNoteTimeRef.current += secondsPerBeat;
        
        currentBeatRef.current++;
        if (currentBeatRef.current >= rhythmRef.current.beats) {
          currentBeatRef.current = 0;
        }
      }, []);

      const scheduleNote = useCallback((beatNumber, time) => {
        const isAccent = beatNumber === 0;
        const currentMode = soundModeRef.current;

        if (currentMode === 'beep' || currentMode === 'metronome') {
          playClick(time, isAccent, currentMode);
        }

        const timeToNote = (time - audioCtxRef.current.currentTime) * 1000;
        setTimeout(() => {
          if (isPlayingRef.current) {
            setActiveBeat(beatNumber);
            if (soundModeRef.current === 'voice') {
              speakText(rhythmRef.current.labels[beatNumber], bpmRef.current);
            }
          }
        }, Math.max(0, timeToNote)); 
      }, []);

      const scheduler = useCallback(() => {
        while (nextNoteTimeRef.current < audioCtxRef.current.currentTime + scheduleAheadTime) {
          scheduleNote(currentBeatRef.current, nextNoteTimeRef.current);
          nextNote();
        }
        timerIdRef.current = setTimeout(scheduler, lookahead);
      }, [nextNote, scheduleNote]);

      const togglePlay = () => {
        if (!isPlaying) {
          initAudioAndVoice();
          isPlayingRef.current = true;
          setIsPlaying(true);
          currentBeatRef.current = 0;
          nextNoteTimeRef.current = audioCtxRef.current.currentTime + 0.05;
          scheduler();
        } else {
          isPlayingRef.current = false;
          setIsPlaying(false);
          clearTimeout(timerIdRef.current);
          setActiveBeat(-1);
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }
      };

      useEffect(() => {
        return () => {
          clearTimeout(timerIdRef.current);
          if (audioCtxRef.current && audioCtxRef.current.state !== 'closed') audioCtxRef.current.close();
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
          if (presetPressTimer.current) clearTimeout(presetPressTimer.current);
        };
      }, []);

      const handleKnobMove = useCallback((e) => {
        if (e.cancelable) e.preventDefault(); 
        if (!knobSvgRef.current) return;
        
        const rect = knobSvgRef.current.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        let angle = Math.atan2(clientY - cy, clientX - cx) * (180 / Math.PI) + 90;
        if (angle > 180) angle -= 360;
        
        if (angle > 135) angle = 135;
        if (angle < -135) angle = -135;
        
        const newBpm = Math.round(30 + ((angle - (-135)) / 270) * 170);
        
        setBpm(prevBpm => {
            if (prevBpm !== newBpm) {
                setBpmPresets(prevPresets => {
                    const updated = [...prevPresets];
                    updated[activePresetIndex] = newBpm;
                    return updated;
                });
                return newBpm;
            }
            return prevBpm;
        });
      }, [activePresetIndex]);

      const handleKnobUp = useCallback(() => {
        document.removeEventListener('mousemove', handleKnobMove);
        document.removeEventListener('mouseup', handleKnobUp);
        document.removeEventListener('touchmove', handleKnobMove);
        document.removeEventListener('touchend', handleKnobUp);
      }, [handleKnobMove]);

      const handleKnobDown = (e) => {
        document.addEventListener('mousemove', handleKnobMove);
        document.addEventListener('mouseup', handleKnobUp);
        document.addEventListener('touchmove', handleKnobMove, { passive: false });
        document.addEventListener('touchend', handleKnobUp);
      };

      const handlePressStart = (id) => {
        isLongPressed.current = false;
        longPressTimer.current = setTimeout(() => {
          isLongPressed.current = true;
          setDeletingId(id);
          if (navigator.vibrate) navigator.vibrate(50); 
        }, 500); 
      };

      const handlePressEnd = () => {
        if (longPressTimer.current) clearTimeout(longPressTimer.current);
      };

      const handlePhraseClick = (phrase) => {
        if (isLongPressed.current) return; 
        if (deletingId) {
          setDeletingId(null);
          return; 
        }
        applyPhrase(phrase);
      };
      
      const handlePresetPressStart = (index) => {
        isPresetLongPressed.current = false;
        presetPressTimer.current = setTimeout(() => {
          isPresetLongPressed.current = true;
          setEditingPresetIndex(index);
          if (navigator.vibrate) navigator.vibrate(50); 
        }, 500); 
      };

      const handlePresetPressEnd = () => {
        if (presetPressTimer.current) clearTimeout(presetPressTimer.current);
      };

      const handlePresetClick = (index, val) => {
        if (isPresetLongPressed.current) return;
        setActivePresetIndex(index);
        setBpm(val);
      };

      const handlePresetChange = (index, newValue) => {
        const val = parseInt(newValue, 10);
        if (!isNaN(val) && val >= 30 && val <= 200) {
          setBpmPresets(prev => {
            const updated = [...prev];
            updated[index] = val;
            return updated;
          });
          if (activePresetIndex === index) {
              setBpm(val);
          }
        }
        setEditingPresetIndex(null);
      };

      const handleLabelChange = (index, value) => {
        if (value.length > 4) {
          setAlertMessage("메시지는 박자당 최대 4자까지만 입력할 수 있습니다.");
          return;
        }
        
        const newLabels = [...currentRhythm.labels];
        newLabels[index] = value;
        
        const totalLength = newLabels.join('').length;
        if (totalLength > 8) {
          setAlertMessage("메시지는 전체 합쳐서 최대 8자까지만 입력 가능합니다.");
          return;
        }
        
        setCurrentRhythm(prev => {
          return { ...prev, labels: newLabels };
        });
      };

      const saveCurrentPhrase = () => {
        const name = currentRhythm.labels.join('-');
        if (savedPhrases.some(p => p.labels.join('-') === name && !p.isDeleted)) return;

        const currentBeatPhrases = savedPhrases.filter(p => !p.isDeleted && p.beats === currentRhythm.beats);
        if (currentBeatPhrases.length >= 15) {
          setAlertMessage(`메시지는 샘플을 포함하여 최대 15줄까지만 유지할 수 있습니다.\n\n불필요한 메시지를 꾹~ 길게 눌러 삭제한 뒤 새로운 메시지를 추가해주세요.`);
          return;
        }

        const newPhrase = {
          id: `custom-${Date.now()}`,
          name: name,
          beats: currentRhythm.beats,
          labels: [...currentRhythm.labels],
          isDefault: false,
          lastUsed: Date.now() 
        };
        setSavedPhrases(prev => [...prev, newPhrase]);
        setIsModalOpen(true); 
      };

      const deletePhrase = (id, e) => {
        e.stopPropagation(); 
        setSavedPhrases(prev => {
          const target = prev.find(p => p.id === id);
          if (target?.isDefault) {
            return prev.map(p => p.id === id ? { ...p, isDeleted: true } : p);
          }
          return prev.filter(p => p.id !== id);
        });
        setDeletingId(null); 
      };

      const restoreDefaults = () => {
        setConfirmDialog({
          message: "삭제된 기본 메시지들을 모두 복구하시겠습니까?\n(박자당 15개 메시지가 넘어가면 추가가 제한될 수 있습니다)",
          onConfirm: () => {
            setSavedPhrases(prev => prev.map(p => p.isDefault ? { ...p, isDeleted: false } : p));
            setConfirmDialog(null);
          }
        });
      };

      const applyPhrase = (phrase) => {
        setCurrentRhythm({ ...phrase, labels: [...phrase.labels] });
        setSoundMode('voice'); 
        setIsModalOpen(false); 
        setSavedPhrases(prev => 
          prev.map(p => p.id === phrase.id ? { ...p, lastUsed: Date.now() } : p)
        );
      };

      const applyBaseRhythm = (rhythm) => {
        setCurrentRhythm({ ...rhythm, labels: [...rhythm.labels] });
        setIsModalOpen(false);
      };

      const visiblePhrases = savedPhrases.filter(p => !p.isDeleted);
      const previewPhrases = [...visiblePhrases]
        .filter(p => p.name !== '똑-딱')
        .sort((a, b) => (b.lastUsed || 0) - (a.lastUsed || 0))
        .slice(0, 4);

      const renderPhraseItem = (phrase) => {
        const isSelected = currentRhythm.labels.join('-') === phrase.labels.join('-');
        const isDeleting = deletingId === phrase.id;
        
        return (
          <div
            key={phrase.id}
            onMouseDown={() => handlePressStart(phrase.id)}
            onMouseUp={handlePressEnd}
            onMouseLeave={handlePressEnd}
            onTouchStart={() => handlePressStart(phrase.id)}
            onTouchEnd={handlePressEnd}
            onContextMenu={(e) => { e.preventDefault(); return false; }} 
            onClick={(e) => { e.stopPropagation(); handlePhraseClick(phrase); }}
            className={`relative group flex items-center justify-center px-3 py-1.5 rounded-lg text-[12px] tracking-tight font-medium transition-all duration-200 cursor-pointer select-none border shadow-sm ${
              isSelected
                ? 'bg-emerald-500/10 border-emerald-500 text-emerald-400'
                : 'bg-slate-800 border-slate-700 text-slate-300 hover:border-slate-500 hover:text-slate-100'
            } ${isDeleting ? 'ring-2 ring-red-500 scale-105 shadow-xl' : ''}`}
          >
            <span>{phrase.name}</span>
            
            {isDeleting && (
              <button 
                onClick={(e) => deletePhrase(phrase.id, e)}
                className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-0.5 shadow-md z-10 hover:bg-red-600 transition-colors animate-pulse"
              >
                <MetroX size={12} />
              </button>
            )}
          </div>
        );
      };

      const knobCx = 80;
      const knobCy = 80;
      const knobRadius = 65;
      const currentKnobAngle = -135 + ((bpm - 30) / 170) * 270;
      const thumbPos = polarToCartesian(knobCx, knobCy, knobRadius, currentKnobAngle);

      return (
        <div className="w-full min-h-[100%] bg-[#0f172a] flex flex-col relative font-sans tracking-tight select-none overflow-hidden" onClick={() => setDeletingId(null)}>
          <div className="bg-emerald-500 rounded-b-[20px] pt-6 pb-3 px-4 text-center shadow-md relative z-10 shrink-0">
            <div className="flex justify-center items-center gap-1.5">
              <MetroActivity size={18} className="text-white" />
              <h1 className="text-lg font-extrabold text-white tracking-wide">GOLF METRONOME</h1>
            </div>
            <p className="text-emerald-50 text-[11px] mt-0.5 opacity-90 font-medium">나만의 스윙 메시지를 만들어보세요</p>
          </div>

          <div className="flex-1 flex flex-col px-4 pt-3 pb-3 overflow-y-auto">
            
            {/* Sound Mode Toggle */}
            <div className="flex flex-col items-center mb-3 w-full shrink-0">
              <div className="bg-slate-800 p-1 rounded-full flex gap-1 shadow-[inset_0_2px_4px_rgba(0,0,0,0.4)] border border-slate-700/50 w-full">
                <button
                  onClick={() => setSoundMode('beep')}
                  className={`flex-1 flex items-center justify-center gap-1 py-1.5 rounded-full text-[12px] font-bold transition-all ${
                    soundMode === 'beep' ? 'bg-emerald-500 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <MetroBell size={14} /> 비프음
                </button>
                <button
                  onClick={() => setSoundMode('voice')}
                  className={`flex-1 flex items-center justify-center gap-1 py-1.5 rounded-full text-[12px] font-bold transition-all ${
                    soundMode === 'voice' ? 'bg-emerald-500 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <MetroMessageSquare size={14} /> 음성
                </button>
                <button
                  onClick={() => setSoundMode('metronome')}
                  className={`flex-1 flex items-center justify-center gap-1 py-1.5 rounded-full text-[12px] font-bold transition-all ${
                    soundMode === 'metronome' ? 'bg-emerald-500 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <MetroClock size={14} /> 메트로놈
                </button>
              </div>
            </div>

            {/* Visualizer (Dots & Text) */}
            <div className="flex justify-center gap-3 mb-3 h-16 items-start shrink-0">
              {Array.from({ length: currentRhythm.beats }).map((_, i) => {
                const isActive = activeBeat === i;
                const isAccent = i === 0;
                
                let circleClass = "bg-slate-800 shadow-[inset_0_4px_6px_rgba(0,0,0,0.6)]";
                if (isActive) {
                  circleClass = isAccent ? "bg-emerald-500 shadow-[0_0_20px_rgba(16,185,129,0.5)]" : "bg-slate-400 shadow-[0_0_15px_rgba(148,163,184,0.4)]";
                }

                return (
                  <div key={i} className="flex flex-col items-center gap-1.5 relative">
                    <div className={`w-10 h-10 rounded-full transition-all duration-200 flex items-center justify-center border border-slate-700/30 ${circleClass} ${isActive ? 'scale-110' : 'scale-100'}`} />
                    
                    <input
                      type="text"
                      maxLength={4} 
                      value={currentRhythm.labels[i]}
                      onChange={(e) => handleLabelChange(i, e.target.value)}
                      className={`text-[12px] font-bold text-center bg-transparent w-[60px] outline-none border-b-2 border-transparent focus:border-emerald-500 transition-all focus:bg-slate-800 rounded py-0.5 ${isActive ? 'text-slate-100' : 'text-slate-400 hover:text-slate-300'} ${soundMode === 'voice' ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}
                    />
                  </div>
                );
              })}
            </div>

            {/* Add Message / Select Beat Container */}
            <div className="flex justify-center mb-3 min-h-[30px] shrink-0">
              {soundMode === 'voice' ? (
                <button 
                  onClick={(e) => { e.stopPropagation(); saveCurrentPhrase(); }}
                  className="flex items-center gap-1.5 px-5 py-1.5 border border-emerald-500 text-emerald-500 rounded-full text-[12px] font-bold transition hover:bg-emerald-500/10 active:scale-95 shadow-sm"
                >
                  <MetroSave size={14} /> 현재 메시지 추가하기
                </button>
              ) : (
                <div className="flex gap-3">
                  <button 
                    onClick={() => applyBaseRhythm(BASE_METRO_RHYTHMS.TWO_FOUR)}
                    className={`flex items-center justify-center w-20 py-1.5 rounded-full text-[12px] font-bold transition border shadow-sm ${currentRhythm.beats === 2 ? 'border-emerald-500 bg-emerald-500/10 text-emerald-400' : 'border-slate-600 bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                  >
                    2박자
                  </button>
                  <button

              {/* Quick Presets */}

                  <div className="flex justify-between w-full gap-1.5">
                    {bpmPresets.map((val, index) => {

                        <input
                          key={`preset-input-${index}`}

                        <button

                          onTouchStart={() => handlePresetPressStart(index)}
                          onTouchEnd={handlePresetPressEnd}
                          onContextMenu={(e) => { e.preventDefault(); return false; }}

                <button 
                  onClick={(e) => { e.stopPropagation(); setIsModalOpen(true); }}
                  className="flex items-center gap-0.5 text-[11px] font-bold transition text-emerald-500 hover:opacity-80"

          {/* Message Library Modal */}
          {isModalOpen && (
            <div className="absolute inset-0 bg-neutral-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50" onClick={() => setDeletingId(null)}>
              <div className="bg-slate-900 rounded-[2rem] border border-slate-700 shadow-2xl w-full max-w-md max-h-[85%] flex flex-col overflow-hidden transform transition-all" onClick={(e) => e.stopPropagation()}>
                
                <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-800/50 z-10">

                    <h2 className="text-[17px] font-bold text-emerald-400 flex items-center gap-2">
