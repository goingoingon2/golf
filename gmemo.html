                      <span className="text-[15px] font-bold text-slate-200">2박자 <span className="text-slate-500 text-[13px] ml-1 font-medium">(퍼팅, 어프로치)</span></span>
                      <div className="flex items-center gap-2">
                        <span className="text-[11px] font-bold text-emerald-500 bg-emerald-500/10 px-2 py-0.5 rounded-md">{visiblePhrases.filter(p => p.beats === 2).length} / 15</span>
                        <button onClick={() => applyBaseRhythm(BASE_METRO_RHYTHMS.TWO_FOUR)} className="text-[11px] font-bold px-2.5 py-1 bg-slate-800 border border-slate-700 rounded text-slate-300 hover:bg-slate-700">기본 셋팅</button>
                      </div>
                    </div>
                    <div className="flex flex-wrap gap-2.5">
                      {visiblePhrases.filter(p => p.beats === 2).map((phrase) => renderPhraseItem(phrase))}
                    </div>
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-4 border-b border-slate-800 pb-2">
                      <span className="text-[15px] font-bold text-slate-200">3박자 <span className="text-slate-500 text-[13px] ml-1 font-medium">(풀스윙)</span></span>
                      <div className="flex items-center gap-2">
                        <span className="text-[11px] font-bold text-emerald-500 bg-emerald-500/10 px-2 py-0.5 rounded-md">{visiblePhrases.filter(p => p.beats === 3).length} / 15</span>
                        <button onClick={() => applyBaseRhythm(BASE_METRO_RHYTHMS.THREE_FOUR)} className="text-[11px] font-bold px-2.5 py-1 bg-slate-800 border border-slate-700 rounded text-slate-300 hover:bg-slate-700">기본 셋팅</button>
                      </div>
                    </div>
                    <div className="flex flex-wrap gap-2.5">
                      {visiblePhrases.filter(p => p.beats === 3).map((phrase) => renderPhraseItem(phrase))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Custom Alert Modal */}
          {alertMessage && (
            <div className="absolute inset-0 bg-neutral-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
              <div className="bg-slate-900 rounded-[2rem] border border-slate-700 shadow-2xl w-full max-w-xs p-6 flex flex-col items-center text-center transform transition-all">
                <div className="w-14 h-14 rounded-full bg-amber-500/10 flex items-center justify-center mb-5 text-amber-500">
                  <MetroBell size={28} />
                </div>
                <p className="text-slate-200 text-[15px] whitespace-pre-line leading-relaxed mb-6 font-medium">
                  {alertMessage}
                </p>
                <button 
                  onClick={() => setAlertMessage('')}
                  className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold rounded-xl transition border border-slate-700"
                >
                  확인
                </button>
              </div>
            </div>
          )}

          {/* Custom Confirm Modal */}
          {confirmDialog && (
            <div className="absolute inset-0 bg-neutral-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-[70]">
              <div className="bg-slate-900 rounded-[2rem] border border-slate-700 shadow-2xl w-full max-w-xs p-6 flex flex-col items-center text-center transform transition-all">
                <div className="w-14 h-14 rounded-full bg-emerald-500/10 flex items-center justify-center mb-5 text-emerald-500">
                  <MetroBell size={28} />
                </div>
                <p className="text-slate-200 text-[15px] whitespace-pre-line leading-relaxed mb-6 font-medium">
                  {confirmDialog.message}
                </p>
                <div className="flex gap-3 w-full">
                  <button 
                    onClick={() => setConfirmDialog(null)}
                    className="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl transition border border-slate-700"
                  >
                    취소
                  </button>
                  <button 
                    onClick={confirmDialog.onConfirm}
                    className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition border border-emerald-500"
                  >
                    복구
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      // 온보딩 관련 상태
      const [showOnboarding, setShowOnboarding] = useState(() => localStorage.getItem('golf_memo_onboarding_seen') !== 'true');
      
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [fbUser, setFbUser] = useState(null);

      const [defaultTab, setDefaultTab] = useState('memo');
      const [currentTab, setCurrentTab] = useState(defaultTab);
      const [view, setView] = useState('list');
      const [activeCategory, setActiveCategory] = useState("전체");
      const [searchQuery, setSearchQuery] = useState("");
      const [categories, setCategories] = useState(INITIAL_CATEGORIES);
      const [memos, setMemos] = useState([]);
      const [shotMemos, setShotMemos] = useState([]);
      const [blockedUsers, setBlockedUsers] = useState([]);
      const [hiddenFromUsers, setHiddenFromUsers] = useState([]);
      const [currentMemo, setCurrentMemo] = useState(null);
      
      const [isSelectionMode, setIsSelectionMode] = useState(false);
      const [selectedMemoIds, setSelectedMemoIds] = useState([]);
      const [confirmDelMerge, setConfirmDelMerge] = useState(false);
      
      const [blockModalTarget, setBlockModalTarget] = useState(null);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [showMergeModal, setShowMergeModal] = useState(false);
      const [isMerging, setIsMerging] = useState(false);

      const [baseFontSize, setBaseFontSize] = useState(15);
      const [followingUsers, setFollowingUsers] = useState(['골프여신']);
      
      const [toastMsg, setToastMsg] = useState('');
      const menuRef = useRef(null);

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (menuRef.current && !menuRef.current.contains(event.target)) {
            setIsMenuOpen(false);
          }
        };
        if (isMenuOpen) {
          document.addEventListener('mousedown', handleClickOutside);
          document.addEventListener('touchstart', handleClickOutside);
        }
        return () => {
          document.removeEventListener('mousedown', handleClickOutside);
          document.removeEventListener('touchstart', handleClickOutside);
        };
      }, [isMenuOpen]);

      useEffect(() => {
        const handleToast = (e) => {
            setToastMsg(e.detail);
            setTimeout(() => setToastMsg(''), 3000);
        };
        window.addEventListener('show-toast', handleToast);
        return () => window.removeEventListener('show-toast', handleToast);
      }, []);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('room')) {
          setDefaultTab('game');
          setCurrentTab('game');
          setView('game_draw');
        }
      }, []);

      useEffect(() => {
        if (!auth) return;
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            }
          } catch (e) { console.error("Firebase Auth Error", e); }
        };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, (user) => {
          setFbUser(user);
          const hasSeenOnboarding = localStorage.getItem('golf_memo_onboarding_seen') === 'true';
          if (user && hasSeenOnboarding) {
            setIsAuthenticated(true);
          } else {
            setIsAuthenticated(false);
          }
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!fbUser || typeof db === 'undefined') return;
        const q = collection(db, 'artifacts', appId, 'public', 'data', 'memos');
        const unsub = onSnapshot(q, (snap) => {
          if (snap.empty) {
            setMemos(INITIAL_MEMOS);
            INITIAL_MEMOS.forEach(async (m) => {
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'memos', m.id.toString()), m);
                } catch(e) { console.warn("Firestore permissions: ", e); }
            });
          } else {
            const data = snap.docs.map(d => ({ ...d.data(), id: d.id })).sort((a, b) => Number(b.id) - Number(a.id));
            setMemos(data);
          }
        }, (err) => {
            console.error("Firebase permission error (memos):", err);
            if (memos.length === 0) setMemos(INITIAL_MEMOS);
        });
        return () => unsub();
      }, [fbUser]);

      useEffect(() => {
        if (!fbUser || typeof db === 'undefined') return;
        const q = collection(db, 'artifacts', appId, 'users', fbUser.uid, 'shotMemos');
        const unsub = onSnapshot(q, (snap) => {
          if (snap.empty) {
            setShotMemos(INITIAL_SHOT_MEMOS);
            INITIAL_SHOT_MEMOS.forEach(async (m) => {
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'users', fbUser.uid, 'shotMemos', m.id.toString()), m);
                } catch(e) { console.warn("Firestore permissions: ", e); }
            });
          } else {
            const data = snap.docs.map(d => ({ ...d.data(), id: d.id })).sort((a, b) => Number(b.id) - Number(a.id));
            setShotMemos(data);
          }
        }, (err) => {
            console.error("Firebase permission error (shotMemos):", err);
            if (shotMemos.length === 0) setShotMemos(INITIAL_SHOT_MEMOS);
        });
        return () => unsub();
      }, [fbUser]);

      const scrollToTop = () => setTimeout(() => { const el = document.getElementById('main-scroll-area'); if (el) el.scrollTo({ top: 0, behavior: 'smooth' }); }, 50);
      const scrollToBottom = () => setTimeout(() => { const el = document.getElementById('main-scroll-area'); if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' }); }, 50);

      const handleSaveMemo = async (memo) => {
        if (typeof db === 'undefined' || !fbUser) return;
        const memoId = memo.id ? memo.id.toString() : Date.now().toString();
        const memoRef = doc(db, 'artifacts', appId, 'public', 'data', 'memos', memoId);
        
        const safeMemo = Object.fromEntries(Object.entries(memo).map(([k, v]) => [k, v === undefined ? null : v]));
        const payload = safeMemo.id ? { ...safeMemo } : { ...safeMemo, id: memoId, author: fbUser?.displayName || "나", likes: 0, likedByMe: false, comments: [], views: 0, shares: 0, date: "방금 전", isPinned: false };
        
        try {
            await setDoc(memoRef, payload);
        } catch(e) {
            console.warn("Firestore Set Error:", e);
            window.showToast("저장 권한이 없습니다. (파이어베이스 규칙을 확인하세요)");
        }
        setCurrentTab('memo'); setView('list'); scrollToTop();
      };

      const handleDeleteMemo = async (id) => {
        if (typeof db === 'undefined' || !fbUser) return;
        try {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'memos', id.toString()));
        } catch(e) {
            console.warn("Delete Error:", e);
        }
        setView('list');
      };

      const handleSaveShotMemo = async (memo) => {
        if (typeof db === 'undefined' || !fbUser) return;
        try {
            await setDoc(doc(db, 'artifacts', appId, 'users', fbUser.uid, 'shotMemos', memo.id.toString()), memo);
        } catch(e) {
            console.warn("Set Error:", e);
        }
        scrollToBottom();
      };

      const handleDeleteShotMemos = async (ids) => {
        if (typeof db === 'undefined' || !fbUser) return;
        for (const id of ids) { 
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', fbUser.uid, 'shotMemos', id.toString())); 
            } catch(e) { console.warn("Delete Error:", e); }
        }
      };

      const filteredMyMemos = memos.filter(m => m.author === "나" && (activeCategory === "전체" || m.category === activeCategory));

      const handleMergeMemos = async (type) => {
        const targetMemos = memos.filter(m => selectedMemoIds.includes(m.id)).sort((a, b) => Number(a.id) - Number(b.id));
        if (targetMemos.length < 2) return;

        setIsMerging(true);
        let mergedContent = "";

        if (type === 'time') {
          mergedContent = targetMemos.map(m => `<div style="color:#10b981; font-size:12px; font-weight:bold; margin-bottom:4px;">[${m.date} - ${m.category}]</div>${m.content}`).join('<br/><br/><hr style="border-top: 1px dashed #e5e7eb; margin: 12px 0;"/><br/>');
        } else {
          const apiKey = "";
          const rawTexts = targetMemos.map(m => `[${m.category}] ${m.content.replace(/<[^>]*>?/gm, '')}`).join('\n\n---\n\n');
          const prompt = `다음은 사용자가 작성한 여러 개의 골프 메모입니다. 이 내용들을 분석하여 유사한 주제끼리 묶어서 가독성 좋고 자연스러운 하나의 완성 글로 합쳐주세요. 강조할 부분은 <b> 태그를, 줄바꿈은 <br/>을 사용하세요.\n\n[원본 메모들]\n${rawTexts}`;

          const payload = { contents: [{ parts: [{ text: prompt }] }] };

          const fetchWithBackoff = async (retries = 3, delay = 1000) => {
            try {
              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
              });
              if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
              return JSON.parse(await response.text());
            } catch (error) {
              if (retries > 0) {
                await new Promise(resolve => setTimeout(resolve, delay));
                return fetchWithBackoff(retries - 1, delay * 2);
              } else throw error;
            }
          };

          try {
            const result = await fetchWithBackoff();
            let text = result.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) mergedContent = text.replace(/```html/gi, '').replace(/```/g, '').trim();
          } catch (error) {
            window.showToast("AI 정리 중 오류가 발생했습니다. 시간순으로 임시 병합됩니다.");
            mergedContent = targetMemos.map(m => `<b>[${m.date}]</b><br/>${m.content}`).join('<br/><br/>');
          }
        }

        const allUrls = [...new Set(targetMemos.flatMap(m => m.urls || []))];
        let checklistIdCounter = Date.now();
        const allChecklists = targetMemos.flatMap(m => m.checklist || []).map(item => ({ id: checklistIdCounter++, text: item.text, completed: item.completed }));
        const firstImage = targetMemos.find(m => m.imageUrl)?.imageUrl || null;

        const newDraft = { id: null, author: "나", category: "기타", content: mergedContent, urls: allUrls, checklist: allChecklists, imageUrl: firstImage, isPublic: false };

        setIsMerging(false); setShowMergeModal(false); setIsSelectionMode(false); setSelectedMemoIds([]);
        setCurrentMemo(newDraft); setView('edit');
      };

      const handleShotMemoMerge = (ids) => { 
        const merged = shotMemos.filter(m => ids.includes(m.id)).map(m => m.content).join('<br/>'); 
        setCurrentMemo({ id: null, author: "나", category: "기타", content: merged, urls: [], checklist: [], imageUrl: null, isPublic: false }); 
        setIsSelectionMode(false);
        setSelectedMemoIds([]);
        setView('edit'); 
      };
      
      const handleBlockPost = (author) => { if (!blockedUsers.includes(author)) setBlockedUsers([...blockedUsers, author]); setBlockModalTarget(null); window.showToast(`${author} 차단됨`); };
      const handleBlockHide = (author) => { if (!hiddenFromUsers.includes(author)) setHiddenFromUsers([...hiddenFromUsers, author]); setBlockModalTarget(null); window.showToast(`${author}에게 숨김됨`); };
      const handleToggleFollow = (author) => { if (author === '나') return; setFollowingUsers(prev => prev.includes(author) ? prev.filter(u => u !== author) : [...prev, author]); };
      
      const handleTogglePin = async (id) => { 
        const memo = memos.find(m => m.id === id);
        if(!memo || typeof db === 'undefined' || !fbUser) return;
        try {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'memos', id.toString()), { ...memo, isPinned: !memo.isPinned });
        } catch(e) { console.warn(e); }
      };
      
      const handleToggleChecklist = async (memoId, itemId) => {
        const memo = memos.find(m => m.id === memoId);
        if(!memo || typeof db === 'undefined' || !fbUser) return;
        const updated = { ...memo, checklist: memo.checklist.map(c => c.id === itemId ? { ...c, completed: !c.completed } : c) };
        try {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'memos', memoId.toString()), updated);
        } catch(e) { console.warn(e); }
      };

      const handleTabChange = (tab) => {
        setIsSelectionMode(false); setSelectedMemoIds([]);
        setCurrentTab(tab); setView('list');
        setCurrentMemo(null); 
        if (tab === 'shot_memo') scrollToBottom(); else scrollToTop();
      };

      const handleLogout = async () => { 
        try {
          const isCanvas = typeof __firebase_config !== 'undefined';
          if (!isCanvas) {
             await signOut(auth); // 실제 깃허브 배포 환경에서만 완전 로그아웃
          }
          setIsAuthenticated(false); 
          setView('list'); 
          setCurrentTab(defaultTab); 
          window.showToast("로그아웃 되었습니다.");
        } catch (e) {
          console.error("로그아웃 실패:", e);
        }
      };

      if (showOnboarding) {
        return (
          <div className="fixed inset-0 bg-[#c8c3b7] flex justify-center sm:items-center sm:py-6 text-gray-900 w-full h-full">
            <GlobalStyle />
            <div className="w-full h-full max-w-[440px] shadow-2xl flex flex-col bg-white overflow-hidden kraft-bg sm:max-h-[850px] sm:rounded-[40px] sm:border-[10px] sm:border-gray-800 relative">
              <OnboardingScreen onComplete={() => { 
                localStorage.setItem('golf_memo_onboarding_seen', 'true'); 
                setShowOnboarding(false);
                if (fbUser) setIsAuthenticated(true);
              }} />
            </div>
          </div>
        );
      }

      return (
        <div className="fixed inset-0 bg-[#c8c3b7] flex justify-center sm:items-center sm:py-6 text-gray-900 w-full h-full">
          <GlobalStyle />
          <div className="w-full h-full max-w-[440px] shadow-2xl flex flex-col bg-white overflow-hidden kraft-bg sm:max-h-[850px] sm:rounded-[40px] sm:border-[10px] sm:border-gray-800 relative">
            
            {toastMsg && (
                <div className="absolute top-10 left-1/2 -translate-x-1/2 z-[100] bg-gray-900/90 text-white px-6 py-3 rounded-full font-bold shadow-xl text-sm whitespace-nowrap animate-in fade-in slide-in-from-top-4">
                    {toastMsg}
                </div>
            )}

            {!isAuthenticated ? (
              <AuthScreen onLogin={() => setIsAuthenticated(true)} />
            ) : (
              <>
                <header className="pt-[max(env(safe-area-inset-top),1rem)] pb-2.5 px-4 z-50 flex-shrink-0 flex justify-between items-center bg-white/50 backdrop-blur-sm border-b border-[#d1c9b8]/50">
                  <div className="flex items-center gap-2.5">
                    <h1 className="text-[22px] font-[900] stamped-text pb-0.5">진심골프메모</h1>
                    <div className="flex flex-col border-l-[2px] border-[#1a4314]/80 pl-2 leading-[1.1]"><span className="text-[8px] font-[900] stamped-text">GOLF MEMO</span><span className="text-[8px] font-[900] stamped-text">& PRACTICE</span></div>
                  </div>
                  {view === 'list' && (
                    <div className="relative ml-auto" ref={menuRef}>
                      <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="p-2 bg-white/60 rounded-full border border-[#d1c9b8] hover:bg-white transition-colors shadow-sm">
                        <Icon name="Menu" size={20} className="text-[#1a4314]" />
                      </button>
                      {isMenuOpen && (
                        <div className="absolute right-0 top-full mt-2 w-36 bg-white rounded-2xl shadow-xl border border-[#d1c9b8] overflow-hidden z-50 animate-in fade-in zoom-in-95 duration-200">
                          <button onClick={() => { setView('search'); setIsMenuOpen(false); }} className="w-full flex items-center gap-2.5 px-4 py-3.5 hover:bg-gray-50 font-extrabold text-[14px] text-gray-800 border-b border-gray-100 transition-colors">
                            <Icon name="Search" size={18} className="text-[#1a4314]"/> 통합 검색
                          </button>
                          <button onClick={() => { setView('mypage'); setIsMenuOpen(false); }} className="w-full flex items-center gap-2.5 px-4 py-3.5 hover:bg-gray-50 font-extrabold text-[14px] text-gray-800 transition-colors">
                            <Icon name="User" size={18} className="text-[#1a4314]"/> 마이페이지
                          </button>
                        </div>
                      )}
                    </div>
                  )}
                  {view !== 'list' && view !== 'mypage' && view !== 'search' && <button onClick={() => setView('list')} className="flex items-center text-[#1a4314] font-extrabold ml-auto"><Icon name="ChevronLeft" size={28} /> 뒤로</button>}
                </header>

                <main id="main-scroll-area" className="flex-1 overflow-y-auto scrollbar-hide relative flex flex-col">
                  {view === 'list' && currentTab === 'memo' && <MemoList memos={filteredMyMemos} categories={categories} activeCategory={activeCategory} setActiveCategory={setActiveCategory} isSelectionMode={isSelectionMode} setIsSelectionMode={setIsSelectionMode} selectedMemoIds={selectedMemoIds} setSelectedMemoIds={setSelectedMemoIds} onOpenDetail={m=>{setCurrentMemo(m); setView('detail');}} baseFontSize={baseFontSize} />}
                  {view === 'search' && <GlobalSearch memos={memos} shotMemos={shotMemos} onOpenDetail={m=>{setCurrentMemo(m); setView('detail');}} onCancel={()=>setView('list')} baseFontSize={baseFontSize} />}
                  {view === 'list' && currentTab === 'shot_memo' && <ShotMemoMain shotMemos={shotMemos} onSaveShotMemo={handleSaveShotMemo} onDeleteShotMemos={handleDeleteShotMemos} isSelectionMode={isSelectionMode} setIsSelectionMode={setIsSelectionMode} selectedIds={selectedMemoIds} setSelectedIds={setSelectedMemoIds} baseFontSize={baseFontSize} />}
                  {view === 'mypage' && <MyPage onCancel={()=>setView('list')} defaultTab={defaultTab} setDefaultTab={setDefaultTab} baseFontSize={baseFontSize} setBaseFontSize={setBaseFontSize} onLogout={handleLogout} />}
                  {view === 'detail' && <MemoDetail memo={memos.find(m => m.id === currentMemo?.id) || currentMemo} onDelete={handleDeleteMemo} onEdit={() => setView('edit')} onTogglePin={handleTogglePin} onToggleChecklist={handleToggleChecklist} baseFontSize={baseFontSize} />}
                  {view === 'edit' && <MemoEditor memo={currentMemo} categories={categories} onSave={handleSaveMemo} onCancel={()=>setView(currentMemo?.id ? 'detail' : 'list')} baseFontSize={baseFontSize} />}
                  {view === 'categories' && <CategoryManager categories={categories} setCategories={setCategories} />}
                  
                  {view === 'list' && currentTab === 'game' && <GameMain onSelectGame={id=>setView(`game_${id}`)} />}
                  {view === 'game_draw' && <TeamDrawGame fbUser={fbUser} />}
                  {view === 'game_chip' && <ChipFlipGame />}
                  {view === 'game_tee' && <TeeSpinGame />}
                  {view === 'list' && currentTab === 'metronome' && <MetronomeMain />}
                </main>

                {!isSelectionMode && view === 'list' && currentTab === 'shot_memo' && (
                  <ShotMemoInputBar onSaveShotMemo={handleSaveShotMemo} />
                )}

                {!isSelectionMode && view === 'list' && currentTab === 'memo' && (
                  <button onClick={() => { setCurrentMemo(null); setView('edit'); }} className="absolute right-5 w-[56px] h-[56px] bg-[#1a4314] rounded-full flex items-center justify-center text-white shadow-xl z-[40] active:scale-95 transition-transform" style={{ bottom: 'calc(80px + env(safe-area-inset-bottom))' }}>
                    <Icon name="Plus" size={32} />
                  </button>
                )}

                {isSelectionMode && view === 'list' && (currentTab === 'memo' || currentTab === 'shot_memo') && (
                  <div className="absolute left-0 right-0 bg-white/95 backdrop-blur-md border-t border-[#d1c9b8] p-4 pb-5 flex justify-between items-center z-[50] shadow-[0_-10px_20px_rgba(0,0,0,0.1)] rounded-t-[20px]" style={{ bottom: 'calc(55px + env(safe-area-inset-bottom))' }}>
                    <span className="font-extrabold text-[#1a4314] text-[15px] pl-2">{selectedMemoIds.length}개 선택됨</span>
                    <div className="flex gap-2">
                      <button onClick={()=> {setIsSelectionMode(false); setSelectedMemoIds([]);}} className="px-4 py-2.5 bg-[#E2D9C8] text-[#1a4314] rounded-xl font-bold text-[13px] hover:bg-[#d5ccba] transition-colors border border-[#d1c9b8]">취소</button>
                      {selectedMemoIds.length > 0 && (
                        <button onClick={() => { if (confirmDelMerge) { if (currentTab === 'memo') selectedMemoIds.forEach(id => handleDeleteMemo(id)); else handleDeleteShotMemos(selectedMemoIds); setIsSelectionMode(false); setSelectedMemoIds([]); setConfirmDelMerge(false); } else { setConfirmDelMerge(true); setTimeout(() => setConfirmDelMerge(false), 3000); } }} className="px-4 py-2.5 bg-red-50 text-red-600 rounded-xl font-bold text-[13px] shadow-sm hover:bg-red-100">{confirmDelMerge ? "정말 삭제?" : "삭제"}</button>
                      )}
                      <button onClick={() => { if (currentTab === 'memo') setShowMergeModal(true); else handleShotMemoMerge(selectedMemoIds); }} disabled={selectedMemoIds.length < 2} className="px-4 py-2.5 bg-[#1a4314] text-white rounded-xl font-bold text-[13px] disabled:opacity-50 disabled:bg-gray-400 shadow-md hover:bg-[#2d6a4f] transition-colors">합치기</button>
                    </div>
                  </div>
                )}

                {view === 'list' && (
                  <nav className="shrink-0 bg-[#E8E2D2]/95 border-t border-[#d1c9b8]/60 flex justify-between z-10 text-[9px] font-bold text-[#6b7280] pb-[env(safe-area-inset-bottom)] sm:rounded-b-[30px]">
                    <div onClick={() => handleTabChange('memo')} className={`p-2 flex-1 flex flex-col items-center cursor-pointer ${currentTab==='memo'?'text-[#1a4314]':''}`}><Icon name="PenTool" size={20}/><span>메모</span></div>
                    <div onClick={() => handleTabChange('shot_memo')} className={`p-2 flex-1 flex flex-col items-center cursor-pointer ${currentTab==='shot_memo'?'text-[#1a4314]':''}`}><Icon name="MessageSquare" size={20}/><span>Shot메모</span></div>
                    <div onClick={() => handleTabChange('game')} className={`p-2 flex-1 flex flex-col items-center cursor-pointer ${currentTab==='game'?'text-[#1a4314]':''}`}><Icon name="Dices" size={20}/><span>게임</span></div>
                    <div onClick={() => handleTabChange('metronome')} className={`p-2 flex-1 flex flex-col items-center cursor-pointer ${currentTab==='metronome'?'text-[#1a4314]':''}`}><Icon name="Timer" size={20}/><span>메트로놈</span></div>
                  </nav>
                )}

                {showMergeModal && (
                  <div className="absolute inset-0 bg-black/60 z-[60] flex items-center justify-center p-5 animate-in fade-in duration-200">
                    <div className="bg-[#fcfbf9] rounded-3xl p-6 w-full max-w-sm flex flex-col gap-4 shadow-2xl animate-in zoom-in-95 duration-200 relative overflow-hidden border border-[#d1c9b8]">
                      {isMerging && (
                        <div className="absolute inset-0 bg-white/90 backdrop-blur-sm z-10 flex flex-col items-center justify-center">
                          <Icon name="Loader2" size={40} className="text-[#1a4314] animate-spin mb-3" />
                          <p className="font-bold text-[#1a4314] text-sm">AI가 메모를 합치고 있습니다...</p>
                        </div>
                      )}
                      <h3 className="text-lg font-extrabold text-gray-900 mb-1">어떤 방식으로 합칠까요?</h3>
                      <button onClick={() => handleMergeMemos('time')} className="flex flex-col items-start p-4 border border-gray-200 rounded-xl hover:border-[#1a4314] hover:bg-[#e8f5e9] transition-all text-left bg-white">
                        <span className="font-bold text-gray-800 flex items-center gap-1.5"><Icon name="Calendar" size={16} className="text-[#1a4314]"/> 시간순서로 합치기</span>
                        <span className="text-[12px] text-gray-500 mt-1.5 leading-snug">선택한 메모들을 작성된 순서대로 단순하게 이어 붙입니다.</span>
                      </button>
                      <button onClick={() => handleMergeMemos('ai')} className="flex flex-col items-start p-4 border border-gray-200 rounded-xl hover:border-purple-500 hover:bg-purple-50 transition-all text-left bg-white">
                        <span className="font-bold text-gray-800 flex items-center gap-1.5"><Icon name="Sparkles" size={16} className="text-purple-500"/> AI 유사 내용 묶기</span>
                        <span className="text-[12px] text-gray-500 mt-1.5 leading-snug">AI가 분석하여 비슷한 주제끼리 매끄럽게 재작성합니다.</span>
                      </button>
                      <button onClick={() => setShowMergeModal(false)} className="mt-2 py-3 bg-[#E2D9C8] text-[#1a4314] font-bold rounded-xl hover:bg-[#d5ccba] transition-colors">취소</button>
                    </div>
                  </div>
                )}

                {blockModalTarget && (
                  <div className="absolute inset-0 bg-black/60 z-[70] flex items-end justify-center animate-in fade-in" onClick={() => setBlockModalTarget(null)}>
                    <div className="bg-[#fdfcf9] w-full max-w-[440px] rounded-t-[32px] p-6 pb-[calc(3rem+env(safe-area-inset-bottom))] flex flex-col gap-2 shadow-2xl animate-in slide-in-from-bottom-full border border-[#d1c9b8]" onClick={e => e.stopPropagation()}>
                      <div className="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-4"></div><h3 className="text-[18px] font-black mb-4 px-2">{blockModalTarget}님 차단 설정</h3>
                      <button onClick={() => handleBlockPost(blockModalTarget)} className="w-full text-left px-5 py-4 bg-white border rounded-2xl font-bold text-red-600 hover:bg-red-50">이 유저의 게시물 숨기기</button>
                      <button onClick={() => handleBlockHide(blockModalTarget)} className="w-full text-left px-5 py-4 bg-white border rounded-2xl font-bold text-orange-600 hover:bg-orange-50 mt-2">내 메모를 보지 못하게 차단</button>
                      <button onClick={() => setBlockModalTarget(null)} className="w-full py-4 mt-4 bg-[#E2D9C8] font-extrabold rounded-2xl hover:bg-[#d5ccba]">취소</button>
                    </div>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    }
    
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
